io da tutela de urgência responde pelo prejuízo ao adversário se a sentença lhe for desfavorável, se cessar por falta de citação no prazo ou se prevalecer decadência ou prescrição.", "Resumo PDF 7 + aula em áudio"], ["Cumprimento provisório corre por iniciativa e responsabilidade do exequente, que repara os danos se a sentença for reformada. A apelação contra sentença que concede, confirma ou revoga tutela não tem efeito suspensivo. O julgamento antecipado parcial desafia agravo de instrumento.", "Resumo PDF 7 + aula em áudio"]]}, {"n": 7, "nome": "Procedimento comum e provas", "sub": "", "a": [["Fases do procedimento comum: postulatória, saneamento, instrução e decisória. A contestação é de 15 dias, contados da audiência de conciliação ou do último ato (art. 335). A reconvenção vem na própria contestação, e a réplica é de 15 dias.", "Resumo PDF 8 + aula em áudio"], ["A audiência de conciliação não ocorre se ambas as partes a recusarem expressamente ou se o direito não admitir autocomposição.", "Resumo PDF 8 + aula em áudio"], ["Improcedência liminar (art. 332): sem citar o réu, quando o pedido contraria súmula do STF ou STJ, repetitivo, IRDR, IAC ou súmula de TJ sobre direito local, ou há decadência ou prescrição.", "Resumo PDF 8 + aula em áudio"], ["Saneamento (art. 357): o juiz resolve questões processuais, delimita questões de fato e de direito, define o ônus da prova e designa audiência. As partes têm 5 dias para pedir esclarecimentos; depois a decisão se estabiliza.", "Resumo PDF 8 + aula em áudio"], ["O rol de testemunhas é entregue em até 15 dias, com limite de 10 por parte e 3 por fato.", "Resumo PDF 8 + aula em áudio"], ["Ônus da prova (art. 373): o autor prova o fato constitutivo e o réu, os impeditivos, modificativos ou extintivos. O juiz pode redistribuir por decisão fundamentada, sem criar prova impossível (prova diabólica).", "Resumo PDF 8 + aula em áudio"], ["Não dependem de prova os fatos notórios, confessados, incontroversos e os de presunção legal (art. 374). As partes podem convencionar o ônus, salvo direito indisponível.", "Resumo PDF 8 + aula em áudio"], ["Produção antecipada de prova (art. 381): risco de perda da prova, viabilizar autocomposição ou conhecer fatos para avaliar o ajuizamento. Corre no foro da prova ou no domicílio do réu, sem prevenção, e o juiz não valora o fato.", "Resumo PDF 8 + aula em áudio"], ["Depoimento pessoal: a parte intimada pessoalmente que não comparece ou se recusa a depor sofre confissão ficta (art. 385, §1º). Ata notarial é meio de prova típico.", "Resumo PDF 8 + aula em áudio"], ["Perícia: o juiz não está adstrito ao laudo e pode determinar nova perícia. Audiência de instrução: perito, depoimentos pessoais, depois testemunhas do autor e do réu. Razões finais orais, ou escritas em 15 dias se a causa for complexa.", "Resumo PDF 8 + aula em áudio"]]}, {"n": 8, "nome": "Sentença e coisa julgada", "sub": "", "a": [["A sentença põe fim à fase cognitiva ou extingue a execução. Seus elementos são relatório, fundamentação e dispositivo. A motivação é exigência constitucional (art. 93, IX).", "Resumo PDF 9 + aula em áudio"], ["Não é fundamentada a decisão (art. 489, §1º) que parafraseia ato normativo, usa conceito indeterminado sem explicar, serve a qualquer decisão, não enfrenta os argumentos capazes de infirmar a conclusão, ou invoca ou afasta precedente sem demonstrar identidade ou distinção.", "Resumo PDF 9 + aula em áudio"], ["Sem resolução de mérito (art. 485): indeferimento da inicial, abandono, ausência de pressupostos, litispendência, coisa julgada, ilegitimidade, falta de interesse, convenção de arbitragem e desistência.", "Resumo PDF 9 + aula em áudio"], ["Com resolução de mérito (art. 487): acolhimento ou rejeição do pedido, decadência ou prescrição, reconhecimento do pedido, transação e renúncia.", "Resumo PDF 9 + aula em áudio"], ["Congruência (art. 492): é vedada sentença ultra petita (mais), extra petita (objeto diverso) e citra petita (menos). O juiz considera fato superveniente.", "Resumo PDF 9 + aula em áudio"], ["Publicada, a sentença só se altera para corrigir inexatidão material ou erro de cálculo, ou por embargos de declaração. A condenação em dinheiro gera hipoteca judiciária.", "Resumo PDF 9 + aula em áudio"], ["Coisa julgada material torna a decisão de mérito imutável e indiscutível. A formal impede a rediscussão só no mesmo processo. A sentença sem mérito, em regra, permite repropor a ação.", "Resumo PDF 9 + aula em áudio"], ["Questão prejudicial faz coisa julgada se dela depender o mérito, houver contraditório prévio e efetivo, sem revelia, e o juízo tiver competência para decidi-la como principal. Não se aplica havendo restrições probatórias ou de cognição, como no mandado de segurança.", "Resumo PDF 9 + aula em áudio"], ["Não fazem coisa julgada os motivos nem a verdade dos fatos (art. 504). Ela vincula as partes e não prejudica terceiros. Eficácia preclusiva: reputam-se deduzidas e repelidas todas as alegações que poderiam ser opostas.", "Resumo PDF 9 + aula em áudio"], ["Coisa julgada é matéria de ordem pública e conhece-se de ofício. Sua ofensa gera rescisória em 2 anos. Na ação civil pública é erga omnes, salvo improcedência por insuficiência de provas, sem limite territorial (Tema 1075). O assistente simples só discute a justiça da decisão nas hipóteses do art. 123.", "Resumo PDF 9 + aula em áudio"]]}, {"n": 9, "nome": "Recursos: teoria geral, apelação, agravo, embargos", "sub": "", "a": [["Princípios recursais: taxatividade (art. 994), singularidade, fungibilidade (sem erro grosseiro nem má-fé), dialeticidade, voluntariedade e proibição da reformatio in pejus. Despachos são irrecorríveis.", "Resumo PDF 10 + aula em áudio"], ["Admissibilidade intrínseca: cabimento, legitimidade e interesse e inexistência de fato impeditivo (renúncia, aquiescência). Extrínseca: tempestividade, regularidade formal e preparo.", "Resumo PDF 10 + aula em áudio"], ["Prazo recursal de 15 dias úteis, exceto embargos de declaração, de 5 dias. Fazenda e MP têm prazo em dobro, e a Fazenda é dispensada de preparo.", "Resumo PDF 10 + aula em áudio"], ["Efeito devolutivo limita a matéria ao impugnado, em profundidade sobre as questões suscitadas. Há também efeitos suspensivo, translativo (ordem pública), expansivo e regressivo (retratação).", "Resumo PDF 10 + aula em áudio"], ["Apelação: cabe contra sentença e tem efeito suspensivo, em regra, salvo as hipóteses do art. 1.012, §1º, como tutela provisória. Interlocutórias não agraváveis se impugnam em preliminar de apelação ou contrarrazões. A admissibilidade é só do tribunal.", "Resumo PDF 10 + aula em áudio"], ["Teoria da causa madura (art. 1.013, §3º): o tribunal julga o mérito de imediato se o processo estiver em condições. Cabe apelação adesiva.", "Resumo PDF 10 + aula em áudio"], ["Agravo de instrumento (art. 1.015): cabe contra interlocutórias do rol e, no parágrafo único, em liquidação, cumprimento, execução e inventário. Tema 988 do STJ: taxatividade mitigada se houver urgência. É interposto direto no tribunal, e o relator pode dar efeito suspensivo.", "Resumo PDF 10 + aula em áudio"], ["Agravo interno (art. 1.021): contra decisão monocrática do relator, em 15 dias. Se unânime e manifestamente inadmissível ou improcedente, multa de 1% a 5% do valor da causa.", "Resumo PDF 10 + aula em áudio"], ["Embargos de declaração: contra qualquer decisão, para obscuridade, contradição, omissão (inclusive art. 489, §1º) ou erro material. Interrompem o prazo dos demais recursos, se tempestivos. Multa de até 2% se protelatórios e até 10% na reiteração. Prequestionamento ficto (art. 1.025).", "Resumo PDF 10 + aula em áudio"], ["Honorários recursais majoram-se ao julgar o recurso, até o limite de 20% no total. Preparo insuficiente: complementação em 5 dias. Falta de preparo: recolhimento em dobro, sob pena de deserção. Desistir do recurso independe de anuência do recorrido.", "Resumo PDF 10 + aula em áudio"]]}]}];
let m=null,t=null,i=0;
const app=document.getElementById('app');
const esc=s=>String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;');
function tema(x){const r=document.documentElement.style;r.setProperty('--tema',x.c);r.setProperty('--tema-t',x.t);r.setProperty('--tema-t2',x.t2);r.setProperty('--tema-d',x.d)}
function home(){m=t=null;i=0;let h='<p class="muted" style="margin-bottom:16px">Escolha a matéria.</p>';
 D.forEach((x,k)=>{const n=x.topicos.reduce((s,y)=>s+y.a.length,0);
  h+='<button class="card topic" style="--tema:'+x.c+';--tema-t:'+x.t+'" data-m="'+k+'"><h3>'+esc(x.nome)+'</h3><p>'+n+' assertivas</p></button>'});
 app.innerHTML=h;app.querySelectorAll('[data-m]').forEach(b=>b.onclick=()=>{m=D[+b.dataset.m];tema(m);topics()});window.scrollTo(0,0)}
function topics(){t=null;i=0;let h='<button class="back" id="b">← Matérias</button><span class="chip">'+esc(m.nome)+'</span><p class="muted" style="margin-bottom:14px">Escolha o tópico do edital.</p>';
 m.topicos.forEach((x,k)=>{h+='<button class="card topic" data-t="'+k+'"><h3>'+x.n+'. '+esc(x.nome)+'</h3><p>'+(x.a.length?x.a.length+(x.a.length==1?' assertiva':' assertivas'):'sem assertivas')+'</p></button>'});
 app.innerHTML=h;document.getElementById('b').onclick=home;
 app.querySelectorAll('[data-t]').forEach(b=>b.onclick=()=>{t=m.topicos[+b.dataset.t];i=0;read()});window.scrollTo(0,0)}
function go(d){const tk=m.topicos.indexOf(t);
 if(d>0){if(t.a.length&&i<t.a.length-1){i++}else if(tk<m.topicos.length-1){t=m.topicos[tk+1];i=0}else return}
 else{if(t.a.length&&i>0){i--}else if(tk>0){t=m.topicos[tk-1];i=Math.max(0,t.a.length-1)}else return}
 read()}
function read(){const n=t.a.length,tk=m.topicos.indexOf(t);
 const ini=tk===0&&i===0,fim=tk===m.topicos.length-1&&(!n||i===n-1);
 let h='<button class="back" id="b">← Tópicos</button><span class="chip">'+esc(m.nome)+'</span><p class="tname">'+t.n+'. '+esc(t.nome)+'</p>';
 if(!n){h+='<div class="card rd"><p class="vazio">Não há questões verdadeiras sobre esse tópico no nosso banco de questões.</p></div>'}
 else{const a=t.a[i];h+='<div class="cnt">'+(i+1)+' / '+n+'</div><div class="card rd"><p'+(a[0].length>260?' class="long"':'')+'>'+esc(a[0])+'</p><div class="fonte">'+esc(a[1])+'</div></div>'}
 h+='<div class="nav2"><button class="btn sec" id="v"'+(ini?' disabled':'')+'>Voltar</button><button class="btn" id="a"'+(fim?' disabled':'')+'>Avançar</button></div>';
 app.innerHTML=h;document.getElementById('b').onclick=topics;
 document.getElementById('v').onclick=()=>go(-1);document.getElementById('a').onclick=()=>go(1);
 window.scrollTo(0,0)}
document.addEventListener('keydown',e=>{if(!t)return;if(e.key==='ArrowRight')go(1);if(e.key==='ArrowLeft')go(-1)});
let x0=null;document.addEventListener('touchstart',e=>{x0=e.touches[0].clientX},{passive:true});
document.addEventListener('touchend',e=>{if(x0===null||!t)return;const d=e.changedTouches[0].clientX-x0;x0=null;if(d<-60)go(1);if(d>60)go(-1)});
home();
</script></body></html>
