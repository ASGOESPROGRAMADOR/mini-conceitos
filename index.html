o cumprimento conforme as competências do SUS e determina o ressarcimento a quem suportou o custo (Tema 793).","Resumo PDF 17"],["Medicamento não incorporado ao SUS (Tema 6, SV 61): exige prova cumulativa de negativa administrativa, ilegalidade da não incorporação, impossibilidade de substituição, evidência científica de alto nível, imprescindibilidade e incapacidade financeira. O ônus é do autor.","Resumo PDF 17"],["Medicamento registrado na Anvisa e não incorporado (Tema 1.234, SV 60): Justiça Federal se o tratamento anual custar 210 salários mínimos ou mais. Sem registro na Anvisa, a regra é a vedação (Tema 500).","Resumo PDF 17"]]},{"n":17,"nome":"Ordem social na CF: educação, cultura, comunicação, meio ambiente, família e indígenas (arts. 205 a 232)","sub":"","a":[["Educação básica é obrigatória e gratuita dos 4 aos 17 anos, e é direito público subjetivo. Municípios atuam prioritariamente no ensino fundamental e na educação infantil.","Resumo PDF 18"],["Tema 548 do STF: acesso a creche e pré-escola é direito exigível do Município, e a reserva do possível não o afasta.","Resumo PDF 18"],["Autonomia das universidades (art. 207). Súmula Vinculante 12: veda taxa de matrícula em universidade pública.","Resumo PDF 18"],["Homeschooling: sem lei, não há direito público subjetivo. Ensino religioso (ADI 4439): pode ser confessional, de matrícula facultativa.","Resumo PDF 18"],["Financiamento: a União aplica no mínimo 18% e os demais entes 25% da receita de impostos. Fundeb permanente, com complementação da União de no mínimo 23%. EC 135/2024 veda usar receita da educação para aposentadorias e pensões.","Resumo PDF 18"],["Comunicação social: vedada toda censura. A classificação indicativa não vincula o horário (ADI 2404). A Lei de Imprensa não foi recepcionada (ADPF 130).","Resumo PDF 18"],["Rádio e TV: a não renovação exige 2/5 do Congresso, em votação nominal. O cancelamento antes do prazo exige decisão judicial.","Resumo PDF 18"],["Desporto: o Judiciário só admite ação após esgotadas as instâncias da justiça desportiva, que tem 60 dias para decidir.","Resumo PDF 18"],["Meio ambiente (art. 225): EIA/RIMA para obra potencialmente degradante, e a reparação do dano ambiental é imprescritível (Tema 999). O Município pode legislar no interesse local, de forma mais protetiva (Tema 145).","Resumo PDF 18"],["Família e grupos: divórcio sem prazo prévio (EC 66/2010) e equiparação de cônjuge e companheiro na sucessão (Tema 809). Gratuidade no transporte urbano do idoso a partir de 65 anos. Terras indígenas são bens da União, com usufruto exclusivo dos índios. Marco temporal afastado no Tema 1.031, retomado pela Lei 14.701/2023 e de volta ao STF.","Resumo PDF 18"]]}]},{"id":"CIV","nome":"Direito Civil","c":"#8E24AA","t":"#F3E5F5","t2":"#E1BEE7","d":"#4A148C","topicos":[{"n":1,"nome":"Parte Geral do Código Civil, LINDB e prescrição contra a Fazenda (Dec. 20.910/1932)","sub":"","a":[["São absolutamente incapazes apenas os menores de 16 anos.","Resumo PDF 19"],["Bens públicos não são usucapíveis, e os de uso comum e especial são inalienáveis enquanto afetados.","Resumo PDF 19"],["A lei começa a vigorar 45 dias depois de publicada, e a lei revogada não volta pela perda de vigência da que a revogou.","Resumo PDF 19"],["O negócio nulo não se confirma, não convalesce com o tempo e é declarado de ofício. O anulável pode ser confirmado.","Resumo PDF 19"],["O prazo para anular o negócio por vício do consentimento é de 4 anos, e o subsidiário é de 2 anos.","Resumo PDF 19"],["No estado de perigo a outra parte conhece o dano. Na lesão não é preciso esse conhecimento.","Resumo PDF 19"],["A fraude contra credores torna o negócio anulável, e a ação cabe aos credores quirografários anteriores.","Resumo PDF 19"],["As partes não podem alterar os prazos de prescrição, e a renúncia só vale depois de consumada.","Resumo PDF 19"],["A prescrição se interrompe uma só vez. Contra a Fazenda, o prazo é de 5 anos (Decreto 20.910), inclusive em indenização.","Resumo PDF 19"],["Interrompida a prescrição, o prazo recomeça pela metade, sem ficar abaixo de 5 anos (Súmula 383 do STF).","Resumo PDF 19"]]},{"n":2,"nome":"Obrigações e contratos: teoria geral, espécies do Código Civil e atos unilaterais","sub":"","a":[["A solidariedade não se presume: resulta da lei ou da vontade das partes.","Resumo PDF 20"],["Na cessão de crédito não se exige anuência do devedor, mas ela só vale contra ele depois da notificação.","Resumo PDF 20"],["Não há mora sem culpa, mas na mora ex re o devedor responde mesmo por caso fortuito.","Resumo PDF 20"],["A cláusula penal não pode exceder o valor da obrigação principal, e o juiz a reduz se for excessiva.","Resumo PDF 20"],["Os vícios redibitórios têm prazo decadencial de 30 dias (móvel) e 1 ano (imóvel) da entrega efetiva.","Resumo PDF 20"],["A compensação não vale para dívida que provém de depósito.","Resumo PDF 20"],["O fiador demandado pode chamar o devedor ao processo (chamamento ao processo).","Resumo PDF 20"],["A doação de todos os bens sem reserva de renda para a subsistência é nula, e a inoficiosa é nula na parte que excede a legítima.","Resumo PDF 20"],["O contrato entre ausentes se aperfeiçoa com a expedição da aceitação.","Resumo PDF 20"],["O dolo de terceiro só anula o negócio se a parte beneficiada soubesse ou devesse saber.","Resumo PDF 20"]]}]},{"id":"TRI","nome":"Direito Tributário","c":"#FB8C00","t":"#FFF3E0","t2":"#FFE0B2","d":"#BF360C","topicos":[{"n":1,"nome":"Princípios, limitações ao poder de tributar, imunidades","sub":"","a":[["Instituir ou majorar tributo exige lei (CF, art. 150, I; CTN, art. 97). A atualização monetária pelo índice oficial não é majoração.","Resumo PDF 2"],["Podem ter alíquotas alteradas pelo Executivo, nos limites da lei: II, IE, IPI e IOF (art. 153, §1º). Taxa não pode ser instituída por decreto.","Resumo PDF 2"],["Anterioridade anual e nonagesimal (art. 150, III, \"b\" e \"c\"): II, IE, IOF, imposto extraordinário de guerra e empréstimo compulsório de guerra ou calamidade escapam das duas.","Resumo PDF 2"],["IPI e contribuições sociais escapam só da anual e respeitam a noventena. IR e a base de cálculo do IPTU e do IPVA escapam só da noventena.","Resumo PDF 2"],["Medida provisória pode tratar de imposto, que só produz efeitos no exercício seguinte se convertida em lei até o último dia do exercício em que foi editada.","Resumo PDF 2"],["Imunidade recíproca (art. 150, VI, \"a\"): alcança União, Estados, DF, Municípios, autarquias e fundações públicas, só quanto a impostos e às finalidades essenciais.","Resumo PDF 2"],["A imunidade recíproca não vale para atividade econômica regida pelo direito privado nem quando há preço ou tarifa pago pelo usuário.","Resumo PDF 2"],["Templos de qualquer culto são imunes a impostos, inclusive suas organizações assistenciais. A taxa de lixo é devida (SV 19), pois imunidade só alcança impostos.","Resumo PDF 2"],["Imunidade protege a entidade, e não a pessoa física: salário de empregado e remuneração de ministro religioso sofrem IRPF.","Resumo PDF 2"],["Imunidade musical (art. 150, VI, \"e\") abrange o produto nacional. O STF não a estende a suportes importados de fora do Brasil.","Resumo PDF 2"]]},{"n":2,"nome":"Competência, fontes, vigência, interpretação","sub":"","a":[["Competência tributária é indelegável (CTN, art. 7º). Delegam-se apenas as funções de arrecadar ou fiscalizar tributos (capacidade tributária ativa).","Resumo PDF 3"],["A atribuição de funções pode ser revogada a qualquer tempo, por ato unilateral. Quem a recebe tem as garantias e privilégios processuais do atribuinte.","Resumo PDF 3"],["Arrecadação por banco ou outra pessoa de direito privado não é delegação de competência (art. 7º, §3º).","Resumo PDF 3"],["O não exercício da competência tributária não a transfere a outro ente (art. 8º).","Resumo PDF 3"],["Legislação tributária (art. 96) inclui leis, tratados, decretos e normas complementares, e abrange as obrigações acessórias. Decreto não inova: seu conteúdo e alcance se restringem aos da lei (art. 99).","Resumo PDF 3"],["Tratados revogam ou modificam a legislação interna e são observados pela superveniente (art. 98). Súmula 575 do STF estende ao importado de país do GATT ou da ALALC a isenção dada ao similar nacional.","Resumo PDF 3"],["Normas complementares (art. 100): atos normativos das autoridades administrativas, decisões com eficácia normativa, práticas reiteradas e convênios. Sua observância exclui penalidades, juros de mora e atualização monetária.","Resumo PDF 3"],["Vigência (arts. 103 e 104): ato normativo, na publicação. Decisão com eficácia normativa, 30 dias depois. Convênio, na data nele prevista. Impostos sobre patrimônio ou renda que criam ou majoram entram em vigor em 1º de janeiro seguinte.","Resumo PDF 3"],["A lei aplica-se a fatos geradores futuros e pendentes. Lei interpretativa retroage, salvo para penalidade. Lei mais benigna retroage a ato não definitivamente julgado, sem fraude. Majorar tributo nunca retroage.","Resumo PDF 3"],["Integração: analogia, princípios gerais de direito tributário, princípios gerais de direito público e equidade, sem exigir tributo não previsto em lei (art. 108). Interpretação literal (art. 111) para suspensão ou exclusão do crédito, isenção e dispensa de acessórias. Na dúvida sobre infrações, interpreta-se a favor do acusado (art. 112).","Resumo PDF 3"]]},{"n":3,"nome":"Tributos e regra-matriz","sub":"","a":[["Tributo (CTN, art. 3º): prestação pecuniária compulsória, que não é sanção de ato ilícito, instituída em lei e cobrada por atividade administrativa plenamente vinculada.","Resumo PDF 4"],["Pecunia non olet (art. 118, I): a ilicitude do fato praticado é irrelevante para a incidência. Multa não é tributo.","Resumo PDF 4"],["Espécies segundo o STF (teoria pentapartida): impostos, taxas, contribuição de melhoria, empréstimos compulsórios e contribuições especiais.","Resumo PDF 4"],["Empréstimo compulsório: competência exclusiva da União, por lei complementar. Guerra ou calamidade dispensam anterioridade, e investimento urgente e relevante a exige. Recurso vinculado e restituível.","Resumo PDF 4"],["Taxa exige serviço público específico e divisível ou poder de polícia. SV 19: coleta domiciliar de lixo pode, limpeza de vias não. Segurança pública não é taxa.","Resumo PDF 4"],["SV 29: a taxa pode usar elemento da base de cálculo de imposto, sem identidade integral. SV 41: iluminação pública não pode ser taxa; há a contribuição do art. 149-A, dos Municípios e do DF.","Resumo PDF 4"],["Contribuição de melhoria (competência comum) exige obra pública e valorização imobiliária. Limite total é a despesa da obra e individual é o acréscimo de valor. Exige edital prévio.","Resumo PDF 4"],["Contribuições: CIDE e sociais, de competência da União (art. 149). As de seguridade seguem a noventena e não a anterioridade anual (art. 195, §6º). Nova fonte de custeio exige lei complementar.","Resumo PDF 4"],["Regra-matriz, hipótese: critério material (verbo e complemento), espacial (onde) e temporal (quando).","Resumo PDF 4"],["Regra-matriz, consequência: critério pessoal (sujeitos ativo e passivo) e quantitativo (base de cálculo e alíquota). No IPTU, o critério material é \"ser proprietário de imóvel urbano\".","Resumo PDF 4"]]},{"n":4,"nome":"Obrigação tributária e responsabilidade","sub":"","a":[["Obrigação principal tem por objeto pagar tributo ou penalidade pecuniária. A acessória é prestação positiva ou negativa no interesse da fiscalização. Descumprida, converte-se em principal quanto à penalidade (CTN, art. 113, §3º).","Resumo PDF 5"],["Sujeito passivo: contribuinte tem relação pessoal e direta com o fato gerador; responsável tem obrigação decorrente de lei (art. 121). Convenções particulares não se opõem à Fazenda (art. 123).","Resumo PDF 5"],["Solidariedade (art. 124): interesse comum na situação que constitui o fato gerador, ou designação legal. Não há benefício de ordem, e o interesse meramente econômico não basta.","Resumo PDF 5"],["Imóveis (art. 130): tributos sobre a propriedade sub-rogam-se na pessoa do adquirente, salvo prova de quitação no título. Na arrematação em hasta pública, a sub-rogação ocorre sobre o preço.","Resumo PDF 5"],["Fusão, transformação e incorporação: a sucessora responde pelos tributos da sucedida (art. 132). O STJ dispensa nova CDA se a sucessão não foi comunicada ao Fisco.","Resumo PDF 5"],["Fundo de comércio (art. 133): o adquirente responde integralmente se o alienante cessar a atividade, e subsidiariamente se este continuar ou retomar em seis meses. Não se aplica à alienação judicial em falência ou recuperação.","Resumo PDF 5"],["Art. 134: responsabilidade de terceiros é subsidiária, quando impossível exigir do contribuinte, e quanto a penalidades só as moratórias.","Resumo PDF 5"],["Art. 135: respondem pessoalmente mandatários, prepostos, empregados e diretores por atos com excesso de poderes ou infração de lei, contrato social ou estatutos.","Resumo PDF 5"],["Súmula 430 do STJ: o simples inadimplemento não responsabiliza o sócio-gerente. Súmula 435: a empresa que deixa de funcionar no domicílio fiscal sem comunicar presume-se dissolvida irregularmente, o que autoriza o redirecionamento.","Resumo PDF 5"],["Infrações: responsabilidade em regra objetiva (art. 136). Denúncia espontânea (art. 138) exige pagamento do tributo e juros antes de procedimento fiscal, e não vale para tributo declarado e pago em atraso (Súmula 360 do STJ).","Resumo PDF 5"]]},{"n":5,"nome":"Crédito tributário: lançamento, suspensão, extinção, exclusão, decadência/prescrição","sub":"","a":[["Lançamento (CTN, art. 142): procedimento privativo da autoridade, vinculado e obrigatório, que constitui o crédito. Modalidades: de ofício, por declaração e por homologação.","Resumo PDF 6 + aula em áudio"],["Súmula 436 do STJ: a entrega de declaração (DCTF, GIA) constitui o crédito, sem outro ato do Fisco. Rege o lançamento a lei vigente na data do fato gerador. Mudança de critério jurídico só vale para fatos futuros.","Resumo PDF 6 + aula em áudio"],["Suspensão da exigibilidade (art. 151), macete MORTAL: Moratória, depósito integral, Reclamações e recursos administrativos, Liminar em mandado de segurança (ou tutela de urgência) e Parcelamento.","Resumo PDF 6 + aula em áudio"],["O depósito deve ser integral e em dinheiro (Súmula 112 do STJ). A suspensão não dispensa obrigações acessórias. SV 21: é vedado exigir depósito ou arrolamento para recurso administrativo.","Resumo PDF 6 + aula em áudio"],["Extinção (art. 156): pagamento, compensação, transação, remissão, prescrição, decadência, conversão de depósito em renda, homologação, consignação, decisão administrativa irreformável, decisão judicial transitada e dação de imóveis. Moratória e parcelamento suspendem, e não extinguem.","Resumo PDF 6 + aula em áudio"],["Repetição do indébito: 5 anos da extinção do crédito (nos tributos por homologação, do pagamento antecipado). A ação anulatória da decisão que nega a restituição prescreve em 2 anos, e lei estadual não altera.","Resumo PDF 6 + aula em áudio"],["Compensação depende de lei autorizadora e é vedada antes do trânsito em julgado (art. 170-A). O mandado de segurança declara o direito, mas não convalida a compensação (Súmula 213). Súmula 212: não se defere em liminar.","Resumo PDF 6 + aula em áudio"],["Decadência (art. 173): 5 anos para constituir o crédito, contados do primeiro dia do exercício seguinte ao em que o lançamento poderia ser feito. Com pagamento antecipado, conta-se do fato gerador (art. 150, §4º). Decadência não se suspende nem se interrompe.","Resumo PDF 6 + aula em áudio"],["Prescrição (art. 174): 5 anos para cobrar, da constituição definitiva. Interrompe-se pelo despacho que ordena a citação em execução fiscal, protesto judicial, ato que constitua em mora e ato inequívoco do devedor. A decadência extingue o direito de lançar; a prescrição, a ação de cobrança.","Resumo PDF 6 + aula em áudio"],["Exclusão: isenção e anistia. Isenção exige lei específica e atinge fatos futuros; anistia alcança infrações passadas, nunca dolo, fraude ou simulação. Nenhuma dispensa obrigações acessórias.","Resumo PDF 6 + aula em áudio"]]},{"n":6,"nome":"Reforma tributária: IBS, CBS, IS, LC 214","sub":"","a":[["IVA dual (EC 132/2023): a CBS é federal e substitui PIS e Cofins. O IBS é compartilhado entre Estados, DF e Municípios, com legislação uniforme, e substitui ICMS e ISS.","Resumo PDF 7 + aula em áudio"],["O IPI fica reduzido a zero, salvo produtos que concorrem com a Zona Franca de Manaus. O Imposto Seletivo (IS) é federal.","Resumo PDF 7 + aula em áudio"],["IBS e CBS incidem sobre operações com bens materiais e imateriais, serviços e direitos, inclusive importações, e não incidem sobre exportações.","Resumo PDF 7 + aula em áudio"],["A não cumulatividade é ampla, com crédito financeiro, salvo exceções constitucionais como uso e consumo pessoal.","Resumo PDF 7 + aula em áudio"],["O IBS segue o princípio do destino (cobrança onde ocorre o consumo). O imposto é cobrado por fora, sem integrar a própria base.","Resumo PDF 7 + aula em áudio"],["Cada ente fixa por lei a sua alíquota de IBS, uniforme para todas as operações, ressalvados os regimes diferenciados.","Resumo PDF 7 + aula em áudio"],["LC 214/2025: alíquota zero para a cesta básica nacional, redução de 60% (saúde, educação, alimentos, dispositivos médicos) e de 30% (profissionais liberais). Há cashback para famílias de baixa renda e split payment.","Resumo PDF 7 + aula em áudio"],["Imposto Seletivo: extrafiscal, incide uma só vez (monofásico) sobre bens e serviços prejudiciais à saúde e ao meio ambiente. Em regra não incide sobre exportações, e pode coexistir com IBS e CBS.","Resumo PDF 7 + aula em áudio"],["Transição: 2026 é teste (CBS 0,9% e IBS 0,1%). Em 2027 a CBS é plena e o IPI zera. De 2029 a 2032, reduz-se gradualmente ICMS e ISS. Em 2033 o IBS é pleno e ICMS e ISS são extintos.","Resumo PDF 7 + aula em áudio"],["A CF veda incentivos e benefícios fiscais de IBS e CBS fora dos previstos nela. O Comitê Gestor do IBS não regulamenta fato gerador, base de cálculo e contribuintes sem lei complementar.","Resumo PDF 7 + aula em áudio"]]},{"n":7,"nome":"Comitê Gestor, transição e processo do IBS, LC 227","sub":"","a":[["O Comitê Gestor do IBS (CG-IBS) exerce, de forma integrada, as atribuições de Estados, DF e Municípios sobre o IBS (CF, art. 156-B), e só por meio dele.","Resumo PDF 8 + aula em áudio"],["Atribuições do CG-IBS: editar o regulamento único e uniformizar a interpretação, arrecadar, compensar e distribuir o produto, e decidir o contencioso administrativo.","Resumo PDF 8 + aula em áudio"],["A LC 227/2026 (sancionada em 13/01/2026) instituiu o CG-IBS e tratou de fiscalização, cobrança e contencioso. Também alterou a LC 214/2025 e trouxe normas gerais do ITCMD.","Resumo PDF 8 + aula em áudio"],["O CG-IBS tem caráter técnico, atuação nacional e sede no DF. Sua gestão é compartilhada entre Estados, DF e Municípios, e não da União. O Conselho Superior decide por maioria qualificada.","Resumo PDF 8 + aula em áudio"],["O IBS é não cumulativo, neutro e segue o destino. Cada ente fixa sua alíquota por lei específica, e o Senado fixa as alíquotas de referência. O CG-IBS não fixa alíquota de todos.","Resumo PDF 8 + aula em áudio"],["Cronograma: 2026, teste. 2027, CBS plena, fim de PIS e Cofins e início do Imposto Seletivo. 2029 a 2032, redução gradual de ICMS e ISS. 2033, IBS pleno e extinção de ICMS e ISS.","Resumo PDF 8 + aula em áudio"],["Na transição, o destino convive com retenção e redistribuição por receita histórica (ADCT, art. 131 e ss.), para evitar perdas bruscas aos entes.","Resumo PDF 8 + aula em áudio"],["Durante a transição pode haver cumulatividade residual, pela convivência dos dois sistemas.","Resumo PDF 8 + aula em áudio"],["Os processos administrativos do IBS e da CBS são apartados. O CG-IBS decide o contencioso do IBS.","Resumo PDF 8 + aula em áudio"],["Câmara Nacional de Integração do Contencioso Administrativo do IBS e da CBS: uniformiza a legislação comum, e suas decisões vinculam o CARF e o Conselho Superior do CG-IBS.","Resumo PDF 8 + aula em áudio"]]},{"n":8,"nome":"IPTU","sub":"","a":[["O IPTU é de competência do Município ou DF. O fato gerador é ser proprietário, titular do domínio útil ou possuidor a qualquer título de imóvel por natureza ou acessão física, na zona urbana (CTN, art. 32). Zona rural é ITR.","Resumo PDF 9 + aula em áudio"],["Zona urbana, definida em lei municipal, exige ao menos dois de cinco melhoramentos: meio-fio, água, esgoto, iluminação pública e escola ou posto de saúde a até 3 km. Expansão urbana, loteamentos e chácaras de recreio também são urbanos.","Resumo PDF 9 + aula em áudio"],["Sujeito passivo (art. 34): proprietário, titular do domínio útil ou possuidor. Para o STJ (Tema 122), promitente comprador e promitente vendedor podem ser contribuintes, e o Município escolhe. Locatário não é contribuinte, e contrato não vale contra o Fisco.","Resumo PDF 9 + aula em áudio"],["Base de cálculo: o valor venal do imóvel (art. 33), sem os bens móveis nele mantidos. A planta genérica de valores é fixada por lei.","Resumo PDF 9 + aula em áudio"],["Atualização monetária pelo índice oficial não é majoração e pode ser feita por decreto. Acima do índice exige lei (Súmula 160 do STJ).","Resumo PDF 9 + aula em áudio"],["Progressividade fiscal em razão do valor, e alíquotas por localização e uso, são permitidas desde a EC 29/2000 (art. 156, §1º). A Súmula 668 do STF veda a progressividade de lei anterior à emenda, salvo função social.","Resumo PDF 9 + aula em áudio"],["Progressividade no tempo (art. 182, §4º, II) é extrafiscal e exige plano diretor, lei específica e notificação: parcelamento ou edificação compulsórios, IPTU progressivo por 5 anos e desapropriação-sanção.","Resumo PDF 9 + aula em áudio"],["Anterioridade: a base de cálculo do IPTU escapa só da nonagesimal e respeita a anual. A alíquota respeita as duas.","Resumo PDF 9 + aula em áudio"],["Lançamento de ofício. O envio do carnê ao endereço do contribuinte o notifica (Súmula 397 do STJ). Prescrição de 5 anos, do dia seguinte ao vencimento. Parcelamento de ofício não interrompe a prescrição.","Resumo PDF 9 + aula em áudio"],["Imunidades (art. 150, VI): entes e autarquias, templos, partidos, sindicatos de trabalhadores, educação e assistência sem fins lucrativos. Abrangem impostos, não taxas como a de lixo. Súmula 724: imóvel de entidade imune alugado a terceiro permanece imune se a renda for aplicada nas finalidades essenciais. Isenção exige lei municipal.","Resumo PDF 9 + aula em áudio"]]},{"n":9,"nome":"ISSQN","sub":"","a":[["ISSQN: imposto municipal e do DF sobre serviços de qualquer natureza não compreendidos no ICMS, definidos em lei complementar (CF, art. 156, III). A norma geral é a LC 116/2003 (com a LC 157/2016); em Curitiba, a LC 40/2001.","Resumo PDF 10 + aula em áudio"],["Fato gerador: prestar serviço da lista anexa da LC 116, ainda que não seja a atividade preponderante. A lista é taxativa, mas admite interpretação extensiva (Tema 296). Incide também sobre serviço vindo do exterior (importação).","Resumo PDF 10 + aula em áudio"],["Transporte interestadual e intermunicipal e comunicação são ICMS, e não ISS. SV 31: locação de bens móveis não sofre ISS.","Resumo PDF 10 + aula em áudio"],["Não incidência (art. 2º): exportação de serviços (resultado só no exterior), relação de emprego, trabalhadores avulsos e diretores e membros de conselhos. Serviço no Brasil com resultado aqui é tributado, ainda que o contratante esteja no exterior.","Resumo PDF 10 + aula em áudio"],["Alíquotas: máxima de 5% e mínima de 2%. É vedada isenção ou benefício que reduza a carga abaixo de 2%, com exceções expressas. Em Curitiba varia de 2% a 5%.","Resumo PDF 10 + aula em áudio"],["Local da incidência (art. 3º): em regra, o estabelecimento prestador, com exceções, como a construção civil (local da obra). A LC 157 levou o imposto ao domicílio do tomador em planos de saúde, cartões e leasing (questionado na ADI 5835).","Resumo PDF 10 + aula em áudio"],["Contribuinte é o prestador. A lei pode atribuir responsabilidade ao tomador ou intermediário (substituição). Em Curitiba, tomadores listados retêm e recolhem, em regra 5%, até o dia 20 do mês seguinte.","Resumo PDF 10 + aula em áudio"],["Base de cálculo: o preço do serviço. Na construção civil, excluem-se os materiais fornecidos pelo prestador e as subempreitadas já tributadas.","Resumo PDF 10 + aula em áudio"],["Industrialização por encomenda para a etapa seguinte do ciclo produtivo: o STF afastou o ISS (Tema 816). Multa moratória não pode exceder 20% (Tema 214).","Resumo PDF 10 + aula em áudio"],["Sociedades uniprofissionais de trabalho pessoal, sem caráter empresarial, pagam ISS fixo por profissional habilitado (DL 406/68). ISS incide em leasing (Súmula 138), em serviços bancários da lista (Súmula 424) e em concreto fornecido por empreitada (Súmula 167). O ISS será extinto em 2033, substituído pelo IBS.","Resumo PDF 10 + aula em áudio"]]},{"n":10,"nome":"ITBI: hipóteses, imunidades, base de cálculo e sujeição passiva","sub":"","a":[["ITBI é de competência dos Municípios e do DF (art. 156, II). Não incide em causa mortis nem em doação (ITCMD, estadual), nem em hipoteca e outros direitos reais de garantia.","Resumo PDF 11"],["O fato gerador ocorre com o registro da transmissão no cartório de imóveis (art. 1.245 do CC; Tema 1.124 do STF). Contrato, escritura ou compromisso sem registro não geram o imposto.","Resumo PDF 11"],["Competência para o imóvel: Município da situação do bem (art. 156, §2º, II).","Resumo PDF 11"],["Imunidade condicionada (art. 156, §2º, I): na integralização de capital, vai só até o valor do capital (Tema 796); o excedente sofre incidência. Perde-se a imunidade se a atividade preponderante for imobiliária.","Resumo PDF 11"],["Imunidades gerais do art. 150, VI: entes federados, templos, partidos e outros.","Resumo PDF 11"],["Base de cálculo: valor venal do imóvel ou dos direitos transmitidos (art. 38 do CTN). Para o STJ (Tema 1.113), é o valor de mercado em condições normais, sem vínculo com a base do IPTU.","Resumo PDF 11"],["O Município não pode arbitrar previamente a base por valor de referência ou tabela. O valor declarado tem presunção de veracidade, afastada só em processo regular (art. 148 do CTN).","Resumo PDF 11"],["Súmula 656 do STF: é inconstitucional a progressividade do ITBI pelo valor venal. Admitem-se alíquotas diferentes pela natureza da operação, como no financiamento habitacional.","Resumo PDF 11"],["Sujeito passivo: a lei escolhe qualquer das partes da operação (art. 42 do CTN). O tabelião pode responder se não exigir a prova de pagamento (art. 134, VI).","Resumo PDF 11"],["ITBI respeita a anterioridade anual e a nonagesimal. Restituição do indébito: 5 anos (art. 168 do CTN).","Resumo PDF 11"]]},{"n":11,"nome":"Taxas, contribuição de melhoria e COSIP","sub":"","a":[["Taxa é tributo vinculado: poder de polícia ou serviço público específico e divisível, efetivo ou potencial (art. 145, II, CF; arts. 77 a 80 do CTN).","Resumo PDF 12"],["Taxa de combate a incêndios é inconstitucional (Tema 16): o que importa é a divisibilidade do serviço.","Resumo PDF 12"],["A taxa não pode ter base de cálculo própria de imposto nem ser calculada em função do capital das empresas. A Súmula Vinculante 29 admite usar elementos da base de imposto, sem identidade integral.","Resumo PDF 12"],["Súmula Vinculante 19: é válida a taxa cobrada exclusivamente pela coleta, remoção e tratamento do lixo domiciliar. Súmula Vinculante 41: taxa de iluminação pública é inconstitucional.","Resumo PDF 12"],["Taxa de renovação de licença de funcionamento é constitucional se o Município mantém órgão e estrutura em efetivo funcionamento (Tema 217).","Resumo PDF 12"],["Tarifa ou preço público é facultativa e contratual (Súmula 545 do STF). Pedágio e tarifa de transporte são preço público.","Resumo PDF 12"],["Imunidade recíproca alcança impostos, não taxas. A natureza do tributo se define pelo fato gerador (art. 4º do CTN).","Resumo PDF 12"],["Contribuição de melhoria (art. 82 do CTN): exige obra pública e valorização, com edital prévio e prazo mínimo de 30 dias para impugnação. Sem edital, o lançamento é nulo.","Resumo PDF 12"],["COSIP (art. 149-A): instituída por lei municipal ou do DF, custeia iluminação pública e, desde a EC 132, expansão, melhoria e monitoramento. Pode ser cobrada na fatura de energia. Segue legalidade e anterioridade, inclusive a noventena.","Resumo PDF 12"],["COSIP é contribuição sui generis, constitucional, com alíquotas progressivas conforme o consumo (Tema 7). Em Curitiba, LC 46/2002 e LC 129/2021, com teto de 10% da fatura.","Resumo PDF 12"]]},{"n":12,"nome":"Administração tributária, dívida ativa e garantias do crédito","sub":"","a":[["A legislação tributária se aplica a todas as pessoas, inclusive imunes e isentas, quanto às obrigações acessórias. O termo de início de fiscalização afasta a denúncia espontânea.","Resumo PDF 13"],["Sigilo fiscal (art. 198): exceções são requisição judicial, solicitação de autoridade em processo administrativo, representação fiscal para fins penais, inscrição em dívida ativa e parcelamento.","Resumo PDF 13"],["O Fisco pode acessar dados bancários sem ordem judicial (ADI 2.859 e Tema 225): há transferência de sigilo, e não quebra.","Resumo PDF 13"],["A presunção de certeza e liquidez da CDA é relativa e só cai com prova inequívoca. A nulidade por erro ou omissão pode ser sanada até a decisão de primeira instância.","Resumo PDF 13"],["Súmula 392 do STJ: a CDA pode ser substituída até a sentença dos embargos para corrigir erro material ou formal, nunca para mudar o sujeito passivo.","Resumo PDF 13"],["Súmulas 558 e 559 do STJ: a inicial da execução fiscal não é indeferida por falta de pedido de citação ou de provas, e dispensa demonstrativo de cálculo.","Resumo PDF 13"],["O protesto da CDA é constitucional (ADI 5.135). São vedadas sanções políticas (Súmulas 70, 323 e 547 do STF).","Resumo PDF 13"],["Certidão negativa sai em 10 dias. A positiva com efeitos de negativa vale com crédito não vencido, penhora efetivada ou exigibilidade suspensa.","Resumo PDF 13"],["Fraude à execução fiscal (art. 185 do CTN): presume-se na alienação por devedor com crédito inscrito em dívida ativa, sem exigir registro da penhora. No processo civil comum, vale a Súmula 375.","Resumo PDF 13"],["Crédito tributário prefere a qualquer outro, salvo trabalhistas e acidente de trabalho. A cobrança não se sujeita a concurso de credores nem a habilitação (ADPF 357 afastou a Súmula 563). Em Curitiba, a multa moratória é de 0,33% ao dia, limitada a 10% (LC 40/2001).","Resumo PDF 13"]]},{"n":13,"nome":"Processo administrativo tributário de Curitiba: lançamento, revisão, JJT, CMC, CRT e consulta","sub":"","a":[["Lançamento é atividade vinculada, obrigatória e privativa da autoridade (art. 142 do CTN). Mudança de critério jurídico só vale para fatos geradores posteriores (art. 146).","Resumo PDF 14"],["Súmula 622 do STJ: a notificação do auto de infração faz cessar a contagem da decadência. A impugnação suspende a exigibilidade (art. 151, III), e a prescrição só começa com a decisão administrativa definitiva.","Resumo PDF 14"],["Impugnação em 30 dias, julgada em primeira instância pela Junta de Julgamento Tributário (JJT), com até 5 membros estáveis, Auditores Fiscais (Decreto 502/2018).","Resumo PDF 14"],["JJT: mandato de 1 ano, sorteio, sessões semanais, quórum de 3 membros e abstenção vedada.","Resumo PDF 14"],["Recurso voluntário ao Conselho Municipal de Contribuintes, em 30 dias, com efeito suspensivo. Não se exige depósito ou arrolamento (SV 21 e Súmula 373 do STJ).","Resumo PDF 14"],["Reexame necessário quando a decisão contra a Fazenda superar R$ 25 mil no ISS ou R$ 10 mil nos demais tributos.","Resumo PDF 14"],["Perde o mandato o conselheiro que retém processo por mais de 60 dias, falta a 3 sessões consecutivas sem justificativa ou deixa de apresentar processos por 3 sessões.","Resumo PDF 14"],["Comissão de Recursos Tributários (CRT, Decreto 824/2002): julga recurso só dos representantes da Fazenda, contra decisão não unânime do Conselho. O contribuinte não recorre à CRT.","Resumo PDF 14"],["Ação judicial com o mesmo objeto importa renúncia ou desistência da via administrativa. Os prazos são contínuos, e podem ser cancelados débitos de até R$ 135.","Resumo PDF 14"],["Consulta (arts. 112 a 114): resposta vinculante para a Administração. Comissão de Consultas com 4 membros, presidida pelo Procurador-Chefe do Núcleo de Assuntos Jurídicos da Secretaria de Finanças (Decreto 825/2002).","Resumo PDF 14"]]},{"n":14,"nome":"Execução fiscal: Lei 6.830/1980","sub":"","a":[["Lei 6.830, art. 2º, §5º: a CDA traz devedor e corresponsáveis, valor originário, juros e correção, origem e natureza, dispositivo legal, data e número da inscrição.","Resumo PDF 15"],["A inicial indica só o juiz, o pedido e a citação, e é instruída com a CDA. O executado é citado para pagar em 5 dias ou garantir a execução, em regra pelo correio.","Resumo PDF 15"],["Súmula 414 do STJ: a citação por edital só cabe depois de esgotados os demais meios.","Resumo PDF 15"],["Garantia (art. 9º): depósito em dinheiro, fiança bancária, seguro garantia, nomeação de bens ou bens de terceiros aceitos pela Fazenda. Ordem de penhora (art. 11) começa pelo dinheiro.","Resumo PDF 15"],["A Fazenda pode recusar substituição por precatório (Súmula 406 do STJ) e pedir a substituição a qualquer tempo.","Resumo PDF 15"],["Embargos (art. 16): 30 dias, contados do depósito, da juntada da fiança ou seguro, ou da intimação da penhora. Exigem garantia e não admitem reconvenção nem compensação. A Fazenda impugna em 30 dias.","Resumo PDF 15"],["Sem garantia, a defesa é por exceção de pré-executividade, só para matéria de ordem pública sem dilação probatória (Súmula 393 do STJ).","Resumo PDF 15"],["Art. 26: cancelada a inscrição antes da decisão de primeiro grau, a execução é extinta sem ônus. Súmula 153 do STJ: cancelamento depois dos embargos não exime a Fazenda da sucumbência.","Resumo PDF 15"],["Art. 38: fora da execução, discute-se a dívida por mandado de segurança, repetição de indébito ou ação anulatória, sem depósito prévio (SV 28). Súmula 190 do STJ: a Fazenda antecipa as despesas do oficial de justiça.","Resumo PDF 15"],["Tema 1.184 do STF: admite extinção de execução de baixo valor por falta de interesse de agir, após tentativa de conciliação ou solução administrativa e protesto da CDA. Redirecionamento: sócio só responde nos casos do art. 135 do CTN, e a dissolução irregular o autoriza (Súmula 435).","Resumo PDF 15"]]},{"n":15,"nome":"Embargos, exceção, redirecionamento e prescrição intercorrente","sub":"","a":[["Embargos à execução fiscal: 30 dias, exigem garantia, sem reconvenção nem compensação. Não suspendem a execução automaticamente.","Resumo PDF 16"],["Efeito suspensivo exige garantia, relevância da fundamentação e perigo de dano (Tema 526 do STJ).","Resumo PDF 16"],["Exceção de pré-executividade: sem garantia, só matéria de ordem pública sem dilação probatória (Súmula 393 do STJ).","Resumo PDF 16"],["Prescrição do crédito tributário: 5 anos da constituição definitiva, interrompida pelo despacho que ordena a citação (LC 118/2005).","Resumo PDF 16"],["LC 236/2026 deu nova redação ao art. 174 do CTN e acrescentou marcos interruptivos, como mediação, arbitragem especial, sentença de extinção por não localização, falência e execução fiscal extrajudicial. Confira a data da prova.","Resumo PDF 16"],["Art. 40 da Lei 6.830: não localizados devedor ou bens, o juiz suspende por 1 ano, sem curso de prescrição. Depois, os autos vão ao arquivo e corre a prescrição intercorrente de 5 anos (Súmula 314 do STJ).","Resumo PDF 16"],["A suspensão de 1 ano começa automaticamente com a ciência da Fazenda, sem depender de despacho (Tema 566). O prazo total é de 6 anos. O juiz pode reconhecer a prescrição de ofício, ouvida a Fazenda.","Resumo PDF 16"],["Só citação e penhora efetivas interrompem a prescrição intercorrente. Petições que não resultam em localização de bens não bastam.","Resumo PDF 16"],["Redirecionamento: o mero inadimplemento não basta (Súmula 430). A dissolução irregular o autoriza (Súmula 435). Responde o administrador da época da dissolução (Tema 981), e não quem se retirou regularmente antes (Tema 962).","Resumo PDF 16"],["Nome do sócio na CDA: o ônus de provar a ausência de excesso é dele (Tema 103). Prazo para redirecionar: 5 anos da citação da empresa, exigida inércia da Fazenda (Tema 444). O IDPJ na execução fiscal está afetado, sem tese (Tema 1.209 do STJ).","Resumo PDF 16"]]},{"n":16,"nome":"Ações tributárias: anulatória, declaratória, repetição de indébito, mandado de segurança, consignação e cautelar fiscal","sub":"","a":[["Art. 38 da LEF: fora da execução, a dívida ativa só é discutida por mandado de segurança, repetição de indébito e ação anulatória. Propor a ação judicial implica renúncia à via administrativa.","Resumo PDF 17"],["Ação anulatória não exige depósito prévio (SV 28) e, por si só, não suspende a execução. Para suspender é preciso depósito integral em dinheiro (Súmula 112 do STJ) ou tutela provisória.","Resumo PDF 17"],["Ação declaratória: afirma a inexistência de relação jurídico-tributária e pode ser proposta antes do lançamento. Em tributos de trato sucessivo, a coisa julgada cessa com decisão contrária do STF (Tema 881).","Resumo PDF 17"],["Fiança bancária e seguro-garantia não suspendem a exigibilidade do crédito. O depósito precisa ser integral e em dinheiro.","Resumo PDF 17"],["Repetição de indébito: independe de protesto e prescreve em 5 anos do pagamento. Nos tributos indiretos, exige prova do encargo ou autorização de quem o suportou (art. 166 do CTN).","Resumo PDF 17"],["Juros moratórios na repetição correm do trânsito em julgado (Súmula 188). Correção monetária desde o pagamento indevido (Súmula 162).","Resumo PDF 17"],["Mandado de segurança: 120 dias, sem honorários. Declara o direito à compensação (Súmula 213), mas não convalida compensação já feita (Súmula 460). A ADI 4296 afastou a vedação de liminar para compensação.","Resumo PDF 17"],["Consignação em pagamento: cabe diante de recusa, exigência ilegal ou bitributação. O contribuinte consigna só o valor que quer pagar.","Resumo PDF 17"],["Cautelar fiscal (Lei 8.397/1992): instrumento da Fazenda, antes ou durante a execução, que torna indisponíveis os bens do devedor. Liminar sem caução. Se preparatória, a execução deve ser proposta em 60 dias.","Resumo PDF 17"],["Art. 185-A do CTN (indisponibilidade na execução) exige citação, ausência de pagamento e esgotamento de diligências (Tema 714). A anulatória da decisão que nega restituição prescreve em 2 anos (art. 169).","Resumo PDF 17"]]},{"n":17,"nome":"Transação tributária e dívida ativa de Curitiba (LC 141/2023 e Decretos 2.305 e 2.306/2023)","sub":"","a":[["LC 141/2023 revogou a LC 68/2008 e disciplina a transação e a autocomposição em Curitiba. A transação extingue o crédito por concessões mútuas e depende de lei do ente.","Resumo PDF 18"],["A PGM autoriza a transação em juízo de conveniência e oportunidade, e a decisão é irrecorrível.","Resumo PDF 18"],["A transação não gera novação, e a confissão do débito é irretratável. Os agentes só respondem por dolo ou fraude.","Resumo PDF 18"],["Parcelamento em até 120 parcelas, corrigidas pelo IPCA mais 1% ao mês. Atraso superior a 60 dias revoga o acordo.","Resumo PDF 18"],["O desconto vai até 100% de juros e multa, nunca do principal, e alcança créditos em atraso há mais de 7 anos e devedores em recuperação judicial ou falência.","Resumo PDF 18"],["Município devedor: transação por chamamento público, com deságio mínimo de 20%.","Resumo PDF 18"],["Decreto 2.305: pedido pelo PROCEC. São irrecuperáveis créditos inscritos há mais de 15 anos, de empresa falida e extinta, de devedor falecido sem bens, os suspensos pelo art. 40 da LEF há mais de 3 anos e os do Tema 566.","Resumo PDF 18"],["Crédito de baixo valor: até R$ 10.000,00. Decreto 2.306: parcelas de 12 a 120 conforme o valor, com mínimo de R$ 100 no ISS e R$ 50 nos demais tributos.","Resumo PDF 18"],["Reparcelamento: entrada de 10% ou 20%. Honorários de 10% nas dívidas em execução e 5% nas protestadas. Desistência das ações judiciais em 60 dias.","Resumo PDF 18"],["Desconto especial (dívidas inscritas antes de 15/11/2016): parcela única, 100% de juros e 100% de multa; 6 parcelas, 90% e 80%; 12, 70% e 60%; 24, 50% e 40%. Não alcança o Simples Nacional.","Resumo PDF 18"]]},{"n":18,"nome":"Repartição constitucional das receitas tributárias (CF arts. 157 a 162)","sub":"","a":[["O IRRF pertence ao ente que paga o rendimento: Estados, Municípios e o DF ficam com o que retêm sobre seus pagamentos.","Resumo PDF 19"],["Ao Município pertencem 50% do ITR, ou 100% se fiscalizar e cobrar por opção.","Resumo PDF 19"],["Ao Município pertencem 50% do IPVA dos veículos licenciados em seu território.","Resumo PDF 19"],["Ao Município pertencem 25% do ICMS, sendo no mínimo 65% pelo valor adicionado.","Resumo PDF 19"],["Os Municípios recebem 25% da parcela do IBS distribuída aos Estados.","Resumo PDF 19"],["O FPM recebe 22,5% do IR e do IPI, mais três parcelas de 1%. O FPE recebe 21,5%.","Resumo PDF 19"],["Os Estados recebem 10% do IPI-exportação, com limite de 20% por unidade, e repassam 25% aos Municípios.","Resumo PDF 19"],["É vedada a retenção dos repasses, mas se admite condicioná-los ao pagamento de créditos do ente repassador e ao mínimo de saúde.","Resumo PDF 19"],["Lei complementar define o valor adicionado e os critérios de rateio dos fundos.","Resumo PDF 19"],["A falta de repasse das receitas constitucionais é hipótese de intervenção.","Resumo PDF 19"]]},{"n":19,"nome":"Direito Financeiro e orçamento: Lei 4.320/1964, PPA, LDO, LOA e execução (CF arts. 165 a 169)","sub":"","a":[["PPA, LDO e LOA são de iniciativa do Poder Executivo.","Resumo PDF 20"],["A Lei 4.320 cita os princípios de unidade, universalidade e anualidade, e o orçamento é bruto, sem deduções.","Resumo PDF 20"],["A LOA pode autorizar créditos suplementares e operações de crédito, sem violar a exclusividade.","Resumo PDF 20"],["Créditos suplementares reforçam dotação, especiais atendem despesa sem dotação específica e extraordinários, despesas urgentes e imprevisíveis.","Resumo PDF 20"],["Suplementares e especiais são autorizados por lei e abertos por decreto.","Resumo PDF 20"],["Os recursos dos créditos adicionais incluem superávit financeiro, excesso de arrecadação, anulação de dotações e operações de crédito.","Resumo PDF 20"],["O exercício financeiro coincide com o ano civil, e pertencem a ele as receitas arrecadadas e as despesas empenhadas.","Resumo PDF 20"],["É vedada despesa sem prévio empenho, e o empenho não pode exceder o crédito.","Resumo PDF 20"],["É vedada operação de crédito que exceda as despesas de capital, salvo crédito suplementar ou especial com finalidade precisa aprovado por maioria absoluta.","Resumo PDF 20"],["Os duodécimos dos demais Poderes e da Defensoria são entregues até o dia 20 de cada mês.","Resumo PDF 20"]]}]},{"id":"PCV","nome":"Direito Processual Civil","c":"#1E88E5","t":"#E3F2FD","t2":"#BBDEFB","d":"#0D47A1","topicos":[{"n":1,"nome":"Teoria geral e normas fundamentais","sub":"","a":[["Art. 1º: o processo civil é ordenado, disciplinado e interpretado conforme os valores e as normas fundamentais da Constituição.","Resumo PDF 2"],["Art. 2º: o processo começa por iniciativa da parte (demanda) e se desenvolve por impulso oficial, salvo exceções legais.","Resumo PDF 2"],["Art. 3º: não se exclui da apreciação jurisdicional ameaça ou lesão a direito. A arbitragem é permitida, e a solução consensual deve ser estimulada.","Resumo PDF 2"],["Justiça multiportas: o sistema aceita arbitragem, mediação e outros meios além do Judiciário (CPC, Res. CNJ 125/2010 e Lei 13.140/2015).","Resumo PDF 2"],["Boa-fé (art. 5º) e cooperação (art. 6º) obrigam todos os sujeitos do processo, o juiz inclusive, e geram sanções, como a litigância de má-fé.","Resumo PDF 2"],["Contraditório (arts. 9º e 10): não se decide contra uma parte sem ouvi-la, e é vedada a decisão surpresa, mesmo sobre matéria apreciável de ofício.","Resumo PDF 2"],["Dispensam a oitiva prévia: tutela de urgência, tutela da evidência dos incisos II e III do art. 311 e mandado monitório.","Resumo PDF 2"],["Poder instrutório do juiz (art. 370) não se sobrepõe ao contraditório. Prova pericial sem intimar as partes torna a sentença nula.","Resumo PDF 2"],["Art. 12: o juiz deve atender \"preferencialmente\" à ordem cronológica de conclusão. Embargos de declaração, sentenças em audiência e metas do CNJ ficam fora dela.","Resumo PDF 2"],["Art. 14: a norma processual não retroage e se aplica de imediato aos processos em curso, respeitados os atos praticados. Art. 15: o CPC é supletivo ao processo administrativo, trabalhista e eleitoral.","Resumo PDF 2"]]},{"n":2,"nome":"Jurisdição, competência, ação","sub":"","a":[["Para postular exige-se interesse e legitimidade. Ninguém pleiteia direito alheio em nome próprio, salvo autorização do ordenamento (substituição processual, art. 18).","Resumo PDF 3"],["Pela teoria da asserção, legitimidade e interesse são aferidos pelas afirmações da inicial. Sua falta leva à extinção sem resolução de mérito (art. 485, VI), e não à improcedência.","Resumo PDF 3"],["O interesse pode se limitar à declaração de existência, inexistência ou modo de ser de relação jurídica, ou à autenticidade ou falsidade de documento, em ação autônoma (art. 19).","Resumo PDF 3"],["A convenção de arbitragem deve ser alegada na contestação e o juiz não a conhece de ofício. Se o réu não alega, aceita a jurisdição estatal (art. 337, X, §§5º e 6º).","Resumo PDF 3"],["A administração pública pode arbitrar direitos patrimoniais disponíveis. A sentença arbitral dispensa homologação e é título executivo judicial.","Resumo PDF 3"],["Jurisdição voluntária: começa por provocação do interessado, do MP ou da Defensoria. Não há reconvenção, e o juiz não está preso à legalidade estrita (arts. 720 e 723).","Resumo PDF 3"],["Perpetuatio jurisdictionis (art. 43): a competência fixa-se no registro ou na distribuição da inicial. Mudanças posteriores são irrelevantes, salvo supressão do órgão ou alteração de competência absoluta.","Resumo PDF 3"],["Competência absoluta (matéria, pessoa, função) é inderrogável e declarável de ofício, a qualquer tempo. Relativa (valor e território) admite foro de eleição e deve ser alegada na contestação. Súmula 33 do STJ veda declará-la de ofício.","Resumo PDF 3"],["Foros: regra geral, domicílio do réu. Imóvel, foro da situação (possessória imobiliária é absoluta). Alimentos, domicílio do alimentando. Contra a União, quatro foros possíveis (art. 51, parágrafo único).","Resumo PDF 3"],["Conexão: pedido ou causa de pedir comum, com reunião dos processos, salvo se um já foi sentenciado (Súmula 235 do STJ). Continência: mesmas partes e causa de pedir, com pedido mais amplo. Litispendência: partes, causa de pedir e pedido idênticos.","Resumo PDF 3"]]},{"n":3,"nome":"Sujeitos, litisconsórcio, terceiros, DPJ","sub":"","a":[["Litisconsórcio necessário (arts. 114 e 115): a eficácia da sentença depende da citação de todos. O juiz manda o autor requerer a citação, sob pena de extinção, e não inclui de ofício.","Resumo PDF 4"],["Exemplo clássico: ação de despejo contra apenas um dos colocatários exige citar todos.","Resumo PDF 4"],["Alienação da coisa litigiosa (art. 109): não muda a legitimidade das partes. O adquirente só sucede com consentimento da parte contrária; sem ele, entra como assistente do alienante.","Resumo PDF 4"],["Chamamento ao processo (art. 130): do afiançado, dos demais fiadores e devedores solidários, quando o fiador é réu.","Resumo PDF 4"],["Denunciação da lide (art. 125) serve ao direito de regresso por lei ou contrato. Oposição (art. 682) é de quem pretende a coisa disputada.","Resumo PDF 4"],["Amicus curiae (art. 138): admitido de ofício ou a pedido, pessoa natural ou jurídica, em qualquer grau. Sua decisão é irrecorrível, cabendo embargos de declaração.","Resumo PDF 4"],["A intervenção de amicus curiae, mesmo de ente federal, não altera a competência.","Resumo PDF 4"],["IDPJ (arts. 133 a 137): cabe em qualquer fase, inclusive na execução. A instauração suspende o processo, salvo se pedida na inicial. O sócio tem 15 dias para se manifestar.","Resumo PDF 4"],["A decisão do IDPJ é interlocutória: cabe agravo de instrumento (agravo interno se for do relator). Acolhido, a alienação em fraude é ineficaz, a contar da citação do sócio.","Resumo PDF 4"],["Desconsideração: o CDC (art. 28, §5º) adota a teoria menor, bastando que a personalidade seja obstáculo ao ressarcimento. O CC (art. 50) adota a teoria maior, com desvio de finalidade ou confusão patrimonial.","Resumo PDF 4"]]},{"n":4,"nome":"Fazenda Pública em juízo: prazos, remessa necessária","sub":"","a":[["Prazo em dobro (CPC, art. 183): União, Estados, DF, Municípios, autarquias e fundações públicas têm prazo em dobro para todas as manifestações, contado da intimação pessoal.","Resumo PDF 5"],["A dobra não se aplica quando a lei fixar prazo próprio para o ente. Por isso, embargos à execução fiscal (30 dias) não dobram. Ação rescisória e mandado de segurança, prazos decadenciais, também não.","Resumo PDF 5"],["Empresas públicas e sociedades de economia mista, em regra, não têm prazo em dobro nem remessa necessária. A ECT é exceção quanto às prerrogativas.","Resumo PDF 5"],["Contestação e recursos: 30 dias úteis para a Fazenda (15 em dobro). Embargos de declaração: 10 dias (5 em dobro).","Resumo PDF 5"],["Defensor Público (art. 186) e Ministério Público (art. 180) também têm prazo em dobro e intimação pessoal.","Resumo PDF 5"],["Remessa necessária (art. 496): a sentença contra a Fazenda Pública e a que julga procedentes, ainda que em parte, os embargos à execução fiscal só produzem efeito depois de confirmadas pelo tribunal.","Resumo PDF 5"],["Dispensa por valor (condenação certa e líquida): menos de 1.000 salários mínimos (União), 500 (Estados, DF e capitais) e 100 (demais Municípios).","Resumo PDF 5"],["Dispensa por precedente: súmula de tribunal superior, repetitivo do STF ou STJ, IRDR, IAC ou orientação vinculante administrativa do próprio ente.","Resumo PDF 5"],["Súmula 45 do STJ: na remessa necessária o tribunal não pode agravar a condenação da Fazenda. Súmula 423 do STF: sem a remessa a sentença não transita em julgado. Nos Juizados da Fazenda não há remessa.","Resumo PDF 5"],["Outras prerrogativas: dispensa de caução e preparo recursal, com custas ao final, mas a Fazenda antecipa honorários periciais se pediu a perícia (Súmula 232 do STJ). Honorários contra ela seguem as faixas do art. 85, §3º.","Resumo PDF 5"]]},{"n":5,"nome":"Atos processuais e nulidades","sub":"","a":[["Liberdade de forma: os atos são válidos se atingem a finalidade (CPC, art. 188). Praticam-se em dias úteis, das 6h às 20h. A petição eletrônica pode ser enviada até as 24h do último dia do prazo.","Resumo PDF 6 + aula em áudio"],["Prazos contam-se em dias úteis, só para prazos processuais, excluindo o dia do começo e incluindo o do vencimento. Ficam suspensos de 20 de dezembro a 20 de janeiro.","Resumo PDF 6 + aula em áudio"],["Omissa a lei, o juiz fixa o prazo e, na falta, são 5 dias. Prazo do juiz é impróprio: não gera preclusão. Peremptório não se altera por convenção; dilatório, sim. Justa causa devolve o prazo.","Resumo PDF 6 + aula em áudio"],["Negócio processual (art. 190) e calendário processual (art. 191) permitem ajustar atos e prazos.","Resumo PDF 6 + aula em áudio"],["Citação válida induz litispendência, torna litigiosa a coisa e constitui em mora. O despacho que a ordena interrompe a prescrição, retroagindo à propositura.","Resumo PDF 6 + aula em áudio"],["A regra é a citação eletrônica, com confirmação em 3 dias úteis. As empresas mantêm cadastro. A omissão sem justa causa é ato atentatório à dignidade da justiça.","Resumo PDF 6 + aula em áudio"],["Hora certa: quando o réu se oculta. Edital: réu desconhecido, ignorado, em local incerto ou inacessível. Requerer edital sem fundamento gera multa de 5 salários mínimos ao autor.","Resumo PDF 6 + aula em áudio"],["Revel citado por edital ou hora certa tem curador especial, que pode contestar por negação geral. Na execução fiscal, o edital só cabe se frustradas as demais formas (Súmula 414 do STJ).","Resumo PDF 6 + aula em áudio"],["Comparecimento espontâneo supre a falta ou nulidade da citação. Citação nula com processo à revelia pode ser atacada na impugnação ao cumprimento de sentença ou por querela nullitatis.","Resumo PDF 6 + aula em áudio"],["Nulidades: instrumentalidade das formas, prejuízo (sem prejuízo, não há nulidade) e aproveitamento. Relativa deve ser alegada na primeira oportunidade e não por quem lhe deu causa. Absoluta é conhecível de ofício.","Resumo PDF 6 + aula em áudio"]]},{"n":6,"nome":"Tutela provisória","sub":"","a":[["Tutela provisória é de urgência (cautelar ou antecipada, antecedente ou incidental) ou de evidência. Conserva eficácia no processo, mas pode ser revogada ou modificada a qualquer tempo.","Resumo PDF 7 + aula em áudio"],["Tutela de urgência (CPC, art. 300): probabilidade do direito e perigo de dano ou risco ao resultado útil. O juiz pode exigir caução, dispensável ao hipossuficiente.","Resumo PDF 7 + aula em áudio"],["A tutela antecipada não se concede se houver perigo de irreversibilidade dos efeitos (§3º). A jurisprudência mitiga a regra em casos extremos, como saúde.","Resumo PDF 7 + aula em áudio"],["Tutela de evidência (art. 311) independe de perigo de dano.","Resumo PDF 7 + aula em áudio"],["Hipóteses da evidência: abuso do direito de defesa; tese firmada em repetitivos ou súmula vinculante com prova documental; contrato de depósito; prova documental suficiente sem contraprova capaz de gerar dúvida razoável.","Resumo PDF 7 + aula em áudio"],["Na evidência, a liminar só cabe nos incisos II e III do art. 311.","Resumo PDF 7 + aula em áudio"],["Antecipada antecedente: o autor pede a tutela e anuncia o pedido final. Estabiliza-se se concedida e o réu não recorrer. A estabilização não faz coisa julgada, e a ação para rever pode ser proposta em 2 anos.","Resumo PDF 7 + aula em áudio"],["Cautelar antecedente: o autor indica a lide e o direito a acautelar. O pedido principal vem em 30 dias, nos mesmos autos, sem novas custas. A eficácia cessa se não formulado, se não efetivada em 30 dias ou se o pedido for improcedente.","Resumo PDF 7 + aula em áudio"],["Art. 302: o beneficiário da tutela de urgência responde pelo prejuízo ao adversário se a sentença lhe for desfavorável, se cessar por falta de citação no prazo ou se prevalecer decadência ou prescrição.","Resumo PDF 7 + aula em áudio"],["Cumprimento provisório corre por iniciativa e responsabilidade do exequente, que repara os danos se a sentença for reformada. A apelação contra sentença que concede, confirma ou revoga tutela não tem efeito suspensivo. O julgamento antecipado parcial desafia agravo de instrumento.","Resumo PDF 7 + aula em áudio"]]},{"n":7,"nome":"Procedimento comum e provas","sub":"","a":[["Fases do procedimento comum: postulatória, saneamento, instrução e decisória. A contestação é de 15 dias, contados da audiência de conciliação ou do último ato (art. 335). A reconvenção vem na própria contestação, e a réplica é de 15 dias.","Resumo PDF 8 + aula em áudio"],["A audiência de conciliação não ocorre se ambas as partes a recusarem expressamente ou se o direito não admitir autocomposição.","Resumo PDF 8 + aula em áudio"],["Improcedência liminar (art. 332): sem citar o réu, quando o pedido contraria súmula do STF ou STJ, repetitivo, IRDR, IAC ou súmula de TJ sobre direito local, ou há decadência ou prescrição.","Resumo PDF 8 + aula em áudio"],["Saneamento (art. 357): o juiz resolve questões processuais, delimita questões de fato e de direito, define o ônus da prova e designa audiência. As partes têm 5 dias para pedir esclarecimentos; depois a decisão se estabiliza.","Resumo PDF 8 + aula em áudio"],["O rol de testemunhas é entregue em até 15 dias, com limite de 10 por parte e 3 por fato.","Resumo PDF 8 + aula em áudio"],["Ônus da prova (art. 373): o autor prova o fato constitutivo e o réu, os impeditivos, modificativos ou extintivos. O juiz pode redistribuir por decisão fundamentada, sem criar prova impossível (prova diabólica).","Resumo PDF 8 + aula em áudio"],["Não dependem de prova os fatos notórios, confessados, incontroversos e os de presunção legal (art. 374). As partes podem convencionar o ônus, salvo direito indisponível.","Resumo PDF 8 + aula em áudio"],["Produção antecipada de prova (art. 381): risco de perda da prova, viabilizar autocomposição ou conhecer fatos para avaliar o ajuizamento. Corre no foro da prova ou no domicílio do réu, sem prevenção, e o juiz não valora o fato.","Resumo PDF 8 + aula em áudio"],["Depoimento pessoal: a parte intimada pessoalmente que não comparece ou se recusa a depor sofre confissão ficta (art. 385, §1º). Ata notarial é meio de prova típico.","Resumo PDF 8 + aula em áudio"],["Perícia: o juiz não está adstrito ao laudo e pode determinar nova perícia. Audiência de instrução: perito, depoimentos pessoais, depois testemunhas do autor e do réu. Razões finais orais, ou escritas em 15 dias se a causa for complexa.","Resumo PDF 8 + aula em áudio"]]},{"n":8,"nome":"Sentença e coisa julgada","sub":"","a":[["A sentença põe fim à fase cognitiva ou extingue a execução. Seus elementos são relatório, fundamentação e dispositivo. A motivação é exigência constitucional (art. 93, IX).","Resumo PDF 9 + aula em áudio"],["Não é fundamentada a decisão (art. 489, §1º) que parafraseia ato normativo, usa conceito indeterminado sem explicar, serve a qualquer decisão, não enfrenta os argumentos capazes de infirmar a conclusão, ou invoca ou afasta precedente sem demonstrar identidade ou distinção.","Resumo PDF 9 + aula em áudio"],["Sem resolução de mérito (art. 485): indeferimento da inicial, abandono, ausência de pressupostos, litispendência, coisa julgada, ilegitimidade, falta de interesse, convenção de arbitragem e desistência.","Resumo PDF 9 + aula em áudio"],["Com resolução de mérito (art. 487): acolhimento ou rejeição do pedido, decadência ou prescrição, reconhecimento do pedido, transação e renúncia.","Resumo PDF 9 + aula em áudio"],["Congruência (art. 492): é vedada sentença ultra petita (mais), extra petita (objeto diverso) e citra petita (menos). O juiz considera fato superveniente.","Resumo PDF 9 + aula em áudio"],["Publicada, a sentença só se altera para corrigir inexatidão material ou erro de cálculo, ou por embargos de declaração. A condenação em dinheiro gera hipoteca judiciária.","Resumo PDF 9 + aula em áudio"],["Coisa julgada material torna a decisão de mérito imutável e indiscutível. A formal impede a rediscussão só no mesmo processo. A sentença sem mérito, em regra, permite repropor a ação.","Resumo PDF 9 + aula em áudio"],["Questão prejudicial faz coisa julgada se dela depender o mérito, houver contraditório prévio e efetivo, sem revelia, e o juízo tiver competência para decidi-la como principal. Não se aplica havendo restrições probatórias ou de cognição, como no mandado de segurança.","Resumo PDF 9 + aula em áudio"],["Não fazem coisa julgada os motivos nem a verdade dos fatos (art. 504). Ela vincula as partes e não prejudica terceiros. Eficácia preclusiva: reputam-se deduzidas e repelidas todas as alegações que poderiam ser opostas.","Resumo PDF 9 + aula em áudio"],["Coisa julgada é matéria de ordem pública e conhece-se de ofício. Sua ofensa gera rescisória em 2 anos. Na ação civil pública é erga omnes, salvo improcedência por insuficiência de provas, sem limite territorial (Tema 1075). O assistente simples só discute a justiça da decisão nas hipóteses do art. 123.","Resumo PDF 9 + aula em áudio"]]},{"n":9,"nome":"Recursos: teoria geral, apelação, agravo, embargos","sub":"","a":[["Princípios recursais: taxatividade (art. 994), singularidade, fungibilidade (sem erro grosseiro nem má-fé), dialeticidade, voluntariedade e proibição da reformatio in pejus. Despachos são irrecorríveis.","Resumo PDF 10 + aula em áudio"],["Admissibilidade intrínseca: cabimento, legitimidade e interesse e inexistência de fato impeditivo (renúncia, aquiescência). Extrínseca: tempestividade, regularidade formal e preparo.","Resumo PDF 10 + aula em áudio"],["Prazo recursal de 15 dias úteis, exceto embargos de declaração, de 5 dias. Fazenda e MP têm prazo em dobro, e a Fazenda é dispensada de preparo.","Resumo PDF 10 + aula em áudio"],["Efeito devolutivo limita a matéria ao impugnado, em profundidade sobre as questões suscitadas. Há também efeitos suspensivo, translativo (ordem pública), expansivo e regressivo (retratação).","Resumo PDF 10 + aula em áudio"],["Apelação: cabe contra sentença e tem efeito suspensivo, em regra, salvo as hipóteses do art. 1.012, §1º, como tutela provisória. Interlocutórias não agraváveis se impugnam em preliminar de apelação ou contrarrazões. A admissibilidade é só do tribunal.","Resumo PDF 10 + aula em áudio"],["Teoria da causa madura (art. 1.013, §3º): o tribunal julga o mérito de imediato se o processo estiver em condições. Cabe apelação adesiva.","Resumo PDF 10 + aula em áudio"],["Agravo de instrumento (art. 1.015): cabe contra interlocutórias do rol e, no parágrafo único, em liquidação, cumprimento, execução e inventário. Tema 988 do STJ: taxatividade mitigada se houver urgência. É interposto direto no tribunal, e o relator pode dar efeito suspensivo.","Resumo PDF 10 + aula em áudio"],["Agravo interno (art. 1.021): contra decisão monocrática do relator, em 15 dias. Se unânime e manifestamente inadmissível ou improcedente, multa de 1% a 5% do valor da causa.","Resumo PDF 10 + aula em áudio"],["Embargos de declaração: contra qualquer decisão, para obscuridade, contradição, omissão (inclusive art. 489, §1º) ou erro material. Interrompem o prazo dos demais recursos, se tempestivos. Multa de até 2% se protelatórios e até 10% na reiteração. Prequestionamento ficto (art. 1.025).","Resumo PDF 10 + aula em áudio"],["Honorários recursais majoram-se ao julgar o recurso, até o limite de 20% no total. Preparo insuficiente: complementação em 5 dias. Falta de preparo: recolhimento em dobro, sob pena de deserção. Desistir do recurso independe de anuência do recorrido.","Resumo PDF 10 + aula em áudio"]]},{"n":10,"nome":"REsp, RE, IRDR, IAC, reclamação, precedentes e ação rescisória","sub":"","a":[["Recurso especial (art. 105, III): contra acórdão de TJ ou TRF em única ou última instância, por contrariedade a lei federal, validade de ato local contestado em face de lei federal ou divergência. Vai ao STJ. O extraordinário é para a Constituição e vai ao STF. Ambos são interpostos no tribunal de origem.","Resumo PDF 11"],["Repercussão geral é presumida quando o acórdão contraria súmula ou jurisprudência dominante do STF ou declara inconstitucional tratado ou lei federal. Só 2/3 dos ministros podem recusá-la.","Resumo PDF 11"],["Prequestionamento ficto (art. 1.025 do CPC): consideram-se incluídos no acórdão os elementos suscitados nos embargos, mesmo inadmitidos ou rejeitados, se o tribunal superior reconhecer o vício.","Resumo PDF 11"],["Vedações: reexame de prova (Súmula 7 do STJ e 279 do STF), interpretação de cláusula contratual (Súmula 5 do STJ) e ofensa a lei local (Súmula 280 do STF).","Resumo PDF 11"],["Súmulas 283 e 284 do STF: fundamento suficiente não impugnado e deficiência de fundamentação impedem o recurso.","Resumo PDF 11"],["Repetitivos (arts. 1.036 a 1.041): o presidente do tribunal de origem seleciona dois ou mais recursos representativos, e o STJ ou STF afeta a questão. Os demais ficam suspensos.","Resumo PDF 11"],["IAC (art. 947): relevante questão de direito, com grande repercussão social, sem repetição em múltiplos processos. IRDR: repetição de processos e risco à isonomia. O acórdão vincula juízes e órgãos fracionários.","Resumo PDF 11"],["Reclamação (arts. 988 a 993): preserva competência e garante a autoridade das decisões, súmula vinculante, controle concentrado e acórdão de IRDR ou IAC. Não cabe contra decisão transitada em julgado.","Resumo PDF 11"],["O juiz pode distinguir e superar precedente, com fundamentação. A modificação de tese pode ser modulada.","Resumo PDF 11"],["Ação rescisória: 2 anos do trânsito em julgado da última decisão (Súmula 401 do STJ). Prova nova: 2 anos da descoberta, limitado a 5 anos. Exige depósito de 5%, e a Fazenda é dispensada. A Súmula 343 do STF não se aplica à matéria constitucional.","Resumo PDF 11"]]},{"n":11,"nome":"Cumprimento de sentença contra a Fazenda Pública, precatórios e RPV","sub":"","a":[["Cumprimento de sentença contra a Fazenda (arts. 534 e 535): o exequente apresenta demonstrativo discriminado e atualizado do crédito.","Resumo PDF 12"],["A Fazenda é intimada, e não citada, para impugnar em 30 dias, nos próprios autos. Não incide a multa de 10% do art. 523.","Resumo PDF 12"],["Art. 85, §7º: não são devidos honorários no cumprimento de sentença contra a Fazenda que enseje precatório, se não houve impugnação.","Resumo PDF 12"],["Execução de título extrajudicial contra a Fazenda é cabível (Súmula 279 do STJ), com embargos em 30 dias (art. 910). Bens públicos são impenhoráveis.","Resumo PDF 12"],["Ação monitória é admissível contra a Fazenda. Sem embargos, aplica-se a remessa necessária.","Resumo PDF 12"],["Precatório (art. 100): ordem cronológica de apresentação, após o trânsito em julgado. Créditos alimentares têm preferência, mas não dispensam precatório (Súmula 655 do STF).","Resumo PDF 12"],["Superpreferência: titulares com 60 anos ou mais, doença grave ou deficiência recebem primeiro, até o triplo do valor da RPV. A Constituição não hierarquiza entre eles.","Resumo PDF 12"],["Atualização: EC 113/2021 adotou a Selic. EC 136/2025 antecipou a apresentação de 2 de abril para 1º de fevereiro e trouxe nova regra de atualização com IPCA.","Resumo PDF 12"],["Súmula Vinculante 17: no prazo constitucional de pagamento do precatório não incidem juros de mora. Súmula Vinculante 47: permite destacar honorários do principal, com requisição própria.","Resumo PDF 12"],["RPV: valor fixado por lei de cada ente. Sem lei local, 40 salários mínimos (Estados e DF) e 30 (Municípios), conforme o art. 87 do ADCT. É vedado fracionar a execução. Atos do presidente do tribunal no precatório são administrativos (Súmulas 311 do STJ e 733 do STF).","Resumo PDF 12"]]},{"n":12,"nome":"Execução de título extrajudicial e defesas do executado","sub":"","a":[["A execução exige título com certeza, liquidez e exigibilidade (art. 783). O art. 784 lista os títulos extrajudiciais, como cheque, nota promissória, duplicata, contrato com duas testemunhas, CDA e crédito condominial.","Resumo PDF 13"],["Ajuizar ação sobre o débito não impede a execução.","Resumo PDF 13"],["O executado é citado para pagar em 3 dias, com honorários de 10%, reduzidos à metade se pagar integralmente nesse prazo. A penhora segue o art. 835, que começa por dinheiro.","Resumo PDF 13"],["Fraude à execução é ineficaz perante o exequente, mas o juiz deve antes intimar o terceiro adquirente, que pode opor embargos de terceiro em 15 dias. Súmula 375 do STJ: exige registro da penhora ou má-fé do terceiro.","Resumo PDF 13"],["Embargos à execução: independem de penhora, depósito ou caução. Prazo de 15 dias da juntada do comprovante de citação, contado individualmente para cada executado, salvo cônjuges.","Resumo PDF 13"],["Os embargos não têm efeito suspensivo automático: dependem de requerimento, dos requisitos da tutela provisória e de garantia do juízo.","Resumo PDF 13"],["Matérias dos embargos (art. 917): inexequibilidade, penhora incorreta, excesso de execução, retenção por benfeitorias, incompetência e qualquer defesa do processo de conhecimento. No excesso, deve-se indicar o valor correto.","Resumo PDF 13"],["Embargos protelatórios geram multa de até 20%. Parcelamento do art. 916: depósito de 30% mais custas e honorários, restante em até 6 parcelas, com juros de 1% ao mês. Não depende da concordância do exequente e não se aplica ao cumprimento de sentença.","Resumo PDF 13"],["Contra a Fazenda: execução de título extrajudicial é cabível, com citação para embargar em 30 dias. Execução fiscal tem regime próprio (Lei 6.830): 5 dias para pagar ou garantir e embargos em 30 dias com garantia.","Resumo PDF 13"],["Impenhoráveis: móveis de uso doméstico de médio valor, vestuário, salários, poupança até 40 salários mínimos e instrumentos de trabalho. O bem de família cede ao crédito condominial do próprio imóvel (Lei 8.009). A cota de condomínio é obrigação propter rem.","Resumo PDF 13"]]},{"n":13,"nome":"Juizados Especiais da Fazenda Pública (Lei 12.153) e Lei 9.099","sub":"","a":[["Juizado da Fazenda (Lei 12.153): causas de interesse de Estados, DF, Territórios e Municípios, até 60 salários mínimos (parcelas vencidas mais 12 vincendas). A competência é absoluta onde o Juizado estiver instalado.","Resumo PDF 14"],["O autor pode renunciar ao excedente para ficar no Juizado.","Resumo PDF 14"],["Não cabem no Juizado: mandado de segurança, desapropriação, divisão e demarcação, ação popular, improbidade, execução fiscal, direitos difusos e coletivos, causas sobre bens imóveis dos entes e demissão de servidor.","Resumo PDF 14"],["Autores: pessoas físicas, microempresas e empresas de pequeno porte. Réus: os entes federados, autarquias, fundações e empresas públicas vinculadas. Sociedade de economia mista não pode ser ré.","Resumo PDF 14"],["Não há prazos diferenciados para a Fazenda no Juizado, nem reexame necessário.","Resumo PDF 14"],["Citação com antecedência mínima de 30 dias da audiência. Os representantes do ente podem conciliar, transigir e desistir, nos termos da lei do ente.","Resumo PDF 14"],["Só cabe recurso contra a sentença e contra a decisão que defere ou nega tutela de urgência. Outras interlocutórias não admitem agravo.","Resumo PDF 14"],["Recurso inominado vai à Turma Recursal (juízes de primeiro grau, mandato de 2 anos, sem recondução). Cabe recurso extraordinário (Súmula 640 do STF), mas não recurso especial (Súmula 203 do STJ).","Resumo PDF 14"],["Obrigação de pagar quantia certa: RPV em 60 dias, sob pena de sequestro. Limites de 40 salários mínimos (Estados e DF) e 30 (Municípios), salvo lei do ente. É vedado fracionar.","Resumo PDF 14"],["Uniformização de jurisprudência entre Turmas do mesmo Estado pela reunião das Turmas, e ao STJ se contrariar súmula. Lei 9.099: competência de 40 salários mínimos, advogado dispensável até 20, recurso inominado em 10 dias e embargos em 5. O IDPJ é admitido (art. 1.062 do CPC).","Resumo PDF 14"]]},{"n":14,"nome":"Mediação, arbitragem e negócios processuais com a Fazenda Pública","sub":"","a":[["Conciliador atua sem vínculo anterior e pode sugerir soluções. Mediador atua com vínculo anterior e ajuda as partes a construir a solução, sem sugerir (art. 165 do CPC).","Resumo PDF 15"],["Princípios da mediação (Lei 13.140, art. 2º): imparcialidade, isonomia, oralidade, informalidade, autonomia da vontade, busca do consenso, confidencialidade e boa-fé.","Resumo PDF 15"],["Pode ser objeto de mediação direito disponível ou indisponível que admita transação. Neste caso, o acordo exige homologação judicial com oitiva do MP.","Resumo PDF 15"],["O mediador segue as regras de impedimento e suspeição do juiz e fica impedido por 1 ano de assessorar ou representar qualquer das partes.","Resumo PDF 15"],["Audiência do art. 334: designada com 30 dias de antecedência. Só não se realiza se ambas as partes manifestarem desinteresse ou se não for admitida autocomposição. No litisconsórcio, todos devem manifestar.","Resumo PDF 15"],["Câmaras de prevenção e resolução administrativa de conflitos (art. 32 da Lei 13.140): os entes poderão criá-las. A submissão do particular é facultativa e depende de regulamento.","Resumo PDF 15"],["A instauração do procedimento de composição suspende a prescrição, e não a interrompe.","Resumo PDF 15"],["Arbitragem (Lei 9.307): a Administração direta e indireta pode usá-la para direitos patrimoniais disponíveis. É sempre de direito, nunca por equidade, e respeita a publicidade.","Resumo PDF 15"],["A sentença arbitral não depende de homologação, não comporta recurso e, se condenatória, é título executivo. A nulidade se pede ao Judiciário em 90 dias.","Resumo PDF 15"],["Negócio processual (art. 190): partes capazes podem convencionar sobre procedimento, ônus, poderes e deveres, em causas que admitam autocomposição. O juiz controla a validade. Calendário processual (art. 191) vincula partes e juiz.","Resumo PDF 15"]]},{"n":15,"nome":"Juros, correção monetária e prescrição contra a Fazenda","sub":"","a":[["Decreto 20.910/1932: prescrevem em 5 anos as dívidas e ações contra a Fazenda, contados do ato ou fato. O Decreto-Lei 4.597 estende às autarquias.","Resumo PDF 16"],["A indenização contra a Fazenda prescreve em 5 anos, e não em 3 como no Código Civil (Tema 553 do STJ).","Resumo PDF 16"],["Trato sucessivo (Súmula 85): se o direito em si não foi negado, prescrevem apenas as parcelas anteriores ao quinquênio.","Resumo PDF 16"],["A prescrição se interrompe uma só vez e recomeça pela metade, sem ficar abaixo de 5 anos (Súmula 383 do STF). A execução prescreve no mesmo prazo da ação (Súmula 150).","Resumo PDF 16"],["A demora da repartição em estudar ou pagar suspende a prescrição. A demora do credor em prestar esclarecimentos não suspende.","Resumo PDF 16"],["Prescrição intercorrente (art. 921 do CPC): o termo inicial é a ciência da primeira tentativa infrutífera, a suspensão de 1 ano ocorre uma só vez, e citação, intimação ou constrição efetivas interrompem.","Resumo PDF 16"],["Ressarcimento ao erário: imprescritível se decorrente de improbidade dolosa (Tema 897); prescritível no ilícito civil (Tema 666) e na decisão de Tribunal de Contas (Tema 899).","Resumo PDF 16"],["Correção e juros: o STF declarou inconstitucional a TR na correção (IPCA-E) e manteve juros da poupança nas condenações não tributárias (Tema 810). Nas tributárias, vale o critério com que a Fazenda corrige seus créditos.","Resumo PDF 16"],["EC 113/2021: a Selic é índice único de correção, remuneração do capital e mora. EC 136/2025: nos requisitórios, IPCA mais 2% ao ano, juros simples, limitado à Selic, desde 1º de agosto de 2025 (art. 97, §16, do ADCT).","Resumo PDF 16"],["Súmula Vinculante 17: sem juros de mora no prazo constitucional de pagamento do precatório. Tema 96: incidem juros entre o cálculo e a expedição do requisitório.","Resumo PDF 16"]]},{"n":16,"nome":"Lei 9.469/1997, pedido de suspensão de liminar, de tutela provisória e de sentença (Leis 8.437/1992 e 12.016/2009)","sub":"","a":[["Lei 9.469/1997, intervenção anômala (art. 5º, parágrafo único): pessoa jurídica de direito público pode intervir quando houver reflexos econômicos, ainda que indiretos, sem demonstrar interesse jurídico. Só se torna parte, para deslocar a competência, se recorrer.","Resumo PDF 17"],["No acordo, cada parte paga os honorários de seu próprio advogado.","Resumo PDF 17"],["Lei 8.437: não cabe liminar contra o Poder Público que esgote o objeto da ação ou defira compensação tributária. Na ação civil pública, exige oitiva prévia do ente em 72 horas.","Resumo PDF 17"],["Pedido de suspensão não é recurso, é contracautela. Quem pede é o MP ou a pessoa jurídica de direito público, ao presidente do tribunal.","Resumo PDF 17"],["Requisito: grave lesão à ordem, à saúde, à segurança e à economia públicas. Meio ambiente não está na lista.","Resumo PDF 17"],["Cabe agravo em 5 dias da decisão. Mantida, novo pedido ao presidente do STJ ou do STF. O agravo de instrumento contra a liminar não prejudica o pedido de suspensão.","Resumo PDF 17"],["Várias liminares idênticas podem ser suspensas em bloco, e a suspensão se estende às supervenientes por simples aditamento.","Resumo PDF 17"],["A suspensão dura até o trânsito em julgado da decisão de mérito (art. 4º, §9º; Súmula 626 do STJ). O exame é político, com análise mínima do mérito.","Resumo PDF 17"],["ADI 4296: o STF declarou inconstitucionais a vedação de liminar do art. 7º, §2º, e a oitiva prévia no MS coletivo. Manteve o prazo de 120 dias e a ausência de honorários.","Resumo PDF 17"],["Concedida a segurança, o duplo grau é obrigatório e cabe execução provisória. O impetrante pode desistir a qualquer tempo, sem anuência da parte contrária (Tema 530). No MS coletivo, a associação precisa de 1 ano de funcionamento, e o impetrante individual só se beneficia se desistir em 30 dias.","Resumo PDF 17"]]},{"n":17,"nome":"Mandado de segurança individual e coletivo (Lei 12.016/2009)","sub":"","a":[["Mandado de segurança protege direito líquido e certo, não amparado por habeas corpus ou habeas data, contra ato ilegal ou abusivo de autoridade. Não cabe contra atos de gestão comercial de estatais e concessionárias.","Resumo PDF 18"],["Não cabe contra ato sujeito a recurso administrativo com efeito suspensivo, contra decisão judicial recorrível com efeito suspensivo, nem contra decisão transitada em julgado.","Resumo PDF 18"],["Súmula 266: não cabe MS contra lei em tese. Cabe contra lei de efeitos concretos. Súmulas 269 e 271: o MS não substitui ação de cobrança, e a concessão não produz efeitos patrimoniais pretéritos.","Resumo PDF 18"],["Prazo: 120 dias da ciência do ato, decadencial, sem suspensão ou interrupção. A lei que fixa o prazo é constitucional (Súmula 632).","Resumo PDF 18"],["Liminar: informações em 10 dias, fundamento relevante e risco de ineficácia. Cabe agravo de instrumento, e a liminar persiste até a sentença.","Resumo PDF 18"],["ADI 4296: vedação de liminar do art. 7º, §2º, e oitiva prévia no MS coletivo foram declaradas inconstitucionais. A Súmula 212 do STJ ainda consta e deve ser conferida no enunciado cobrado.","Resumo PDF 18"],["O MP opina em 10 dias e a sentença sai em 30. Não se admite litisconsórcio ativo após o despacho da inicial. A liminar caduca se o impetrante deixa de promover atos por mais de 3 dias úteis.","Resumo PDF 18"],["Concedida a segurança, há reexame necessário e execução provisória, salvo onde a liminar é vedada. O servidor só recebe vencimentos desde o ajuizamento.","Resumo PDF 18"],["Não cabem honorários (Súmulas 512 do STF e 105 do STJ), sem prejuízo de sanção por má-fé. O descumprimento é crime de desobediência.","Resumo PDF 18"],["MS coletivo: partido com representação no Congresso e associação constituída há 1 ano, sem autorização especial (Súmula 629). A coisa julgada alcança só os substituídos, sem litispendência com as ações individuais, e o impetrante individual só se beneficia se desistir em 30 dias.","Resumo PDF 18"]]},{"n":18,"nome":"Habeas data, mandado de injunção e ação popular","sub":"","a":[["O habeas data protege informações sobre a pessoa do impetrante, e não de terceiros.","Resumo PDF 19"],["O habeas data exige prova da recusa administrativa ou do silêncio por mais de 10 ou 15 dias (Súmula 2 do STJ).","Resumo PDF 19"],["O habeas data é gratuito, e a apelação da sentença que o concede tem só efeito devolutivo.","Resumo PDF 19"],["O mandado de injunção cabe para direitos e liberdades constitucionais e prerrogativas da nacionalidade, soberania e cidadania.","Resumo PDF 19"],["A decisão no mandado de injunção vale, em regra, entre as partes, até o advento da norma.","Resumo PDF 19"],["O mandado de injunção coletivo pode ser impetrado por associação com 1 ano, partido com representação, Ministério Público e Defensoria.","Resumo PDF 19"],["Só o cidadão propõe ação popular, e a pessoa jurídica não tem legitimidade (Súmula 365 do STF).","Resumo PDF 19"],["Na ação popular o Ministério Público não pode defender o ato impugnado.","Resumo PDF 19"],["A coisa julgada na ação popular é erga omnes, salvo improcedência por falta de provas.","Resumo PDF 19"],["A ação popular prescreve em 5 anos, e a sentença de improcedência ou carência sujeita-se
