<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Conceitos</title><meta name="theme-color" content="#2f2119">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#f4ecdc;--cream-2:#fff8f0;--sand:#eadcc3;--salmon:#d88f79;--salmon-2:#efb6a3;--brown:#8a5a2b;--brown-2:#5b3a22;--brown-3:#2f2119;--gold:#c28b2f;--ink:#352d24;--muted:#766b5d;--white:#fffdf9;--green:#3fa36b;--red:#b5482f;
--tema:#F9A825;--tema-t:#FFF8E1;--tema-t2:#FFECB3;--tema-d:#8A5200}
*{box-sizing:border-box;margin:0}
body{background:var(--cream);color:var(--ink);font:17px/1.55 Inter,system-ui,sans-serif;min-height:100vh}
body:before{content:"";display:block;height:10px;background:linear-gradient(90deg,var(--salmon) 0 25%,var(--gold) 0 50%,var(--brown) 0 75%,var(--brown-3) 0)}
h1,h2,h3{font-family:Lora,Georgia,serif;color:var(--brown-3);line-height:1.2}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;max-width:820px;margin:0 auto}
header h1{font-size:24px}header small{color:var(--muted);display:block;font-family:Inter;font-size:13px}
nav{display:flex;gap:8px;max-width:820px;margin:0 auto;padding:0 16px 12px}
nav button{flex:1;font:600 15px Inter;padding:10px 6px;background:var(--white);border:3px solid var(--brown-3);border-radius:12px;color:var(--brown-3);cursor:pointer;box-shadow:3px 3px 0 var(--brown-3)}
nav button.on{background:var(--brown-3);color:var(--cream)}
main{max-width:820px;margin:0 auto;padding:6px 16px 60px}
.card{background:var(--white);border:3px solid var(--brown-3);border-radius:16px;box-shadow:5px 5px 0 var(--brown-3);padding:18px;margin-bottom:18px}
.topic{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;background:var(--tema-t);border-left-width:12px;border-left-color:var(--tema)}
.topic h3{font-size:20px}.topic p{color:var(--muted);font-size:14px;margin-top:4px}
.chip{display:inline-block;font:700 12px Inter;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border:2px solid var(--brown-3);border-radius:99px;background:var(--tema);color:var(--brown-3);margin-bottom:8px}
.bar{height:10px;border:2px solid var(--brown-3);border-radius:9px;background:var(--white);margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--tema)}
.q{border-top:12px solid var(--tema)}
.src{font-size:13px;color:var(--muted);margin-bottom:8px}
.en{font-family:Lora,serif;font-size:19px;color:var(--brown-3);margin-bottom:10px}
.itens{background:var(--tema-t);border:2px dashed var(--tema-d);border-radius:10px;padding:10px 14px;margin:8px 0 12px;font-size:16px}.itens p+p{margin-top:6px}
.alt{display:flex;gap:12px;width:100%;text-align:left;font:inherit;background:var(--white);border:2.5px solid var(--brown-3);border-radius:12px;padding:11px 12px;margin:9px 0;cursor:pointer;box-shadow:3px 3px 0 var(--brown-3)}
.alt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--brown-3)}
.alt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--tema-t2);border:2px solid var(--brown-3);display:grid;place-items:center;font-size:14px}
.alt.dis{cursor:default;box-shadow:none;opacity:.8}.alt.dis:active{transform:none}
.alt.ok{border-color:var(--green);background:#e7f5ec;opacity:1}.alt.bad{border-color:var(--red);background:#fbece7;opacity:1}
.fb{margin-top:16px;border-radius:14px;padding:14px;border:2.5px solid}
.fb.ok{background:#e7f5ec;border-color:var(--green)}.fb.bad{background:var(--cream-2);border-color:var(--brown-3)}
.fb .h{display:flex;align-items:center;gap:12px;font:700 18px Lora,serif}
.fb svg{flex:none}.fb .ex{margin-top:10px;font-size:16px}
.obs{margin-top:10px;font-size:14px;background:var(--sand);border-radius:10px;padding:8px 12px;color:var(--brown-2)}
.act{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{font:700 16px Inter;padding:11px 18px;border:3px solid var(--brown-3);border-radius:12px;background:var(--tema);color:var(--brown-3);cursor:pointer;box-shadow:3px 3px 0 var(--brown-3)}
.btn.sec{background:var(--white)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{text-align:center;background:var(--white);border:3px solid var(--brown-3);border-radius:14px;padding:12px 4px;box-shadow:3px 3px 0 var(--brown-3)}.stat b{display:block;font:700 28px Lora,serif}.stat span{font-size:13px;color:var(--muted)}
.list button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;background:var(--white);border:2px solid var(--brown-3);border-radius:10px;padding:9px 12px;margin:7px 0;cursor:pointer}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--brown-3);flex:none;background:var(--sand)}.dot.c{background:var(--green)}.dot.e{background:var(--red)}
.muted{color:var(--muted);font-size:14px}
.ed{display:inline-block;font:600 12px Inter;background:var(--brown-3);color:var(--cream);border-radius:8px;padding:2px 8px;margin:6px 0 0}
.zr{font:600 13px Inter;background:none;border:2px solid var(--red);color:var(--red);border-radius:10px;padding:5px 12px;cursor:pointer;margin:-8px 0 18px}
.fe{margin:0 0 12px;font-size:14px;background:#fbece7;border:2px dashed var(--red);border-radius:10px;padding:8px 12px;color:var(--brown-2)}

.back{font:600 14px Inter;background:none;border:2px solid var(--brown-3);border-radius:10px;padding:5px 12px;color:var(--brown-3);cursor:pointer;margin:0 0 14px}
.rd{border-top:12px solid var(--tema);min-height:230px;display:flex;flex-direction:column;justify-content:space-between}
.rd p{font:500 21px/1.6 Lora,Georgia,serif;color:var(--brown-3)}
.rd p.long{font-size:18px}
.rd .fonte{margin-top:18px;font-size:12px;color:var(--muted);opacity:.75;letter-spacing:.02em}
.tname{font:600 17px Lora,Georgia,serif;color:var(--brown);margin:12px 0 4px;line-height:1.3}
.cnt{font:600 13px Inter;color:var(--muted);margin:0 0 8px}
.nav2{display:flex;gap:12px}.nav2 .btn{flex:1}.btn[disabled]{opacity:.35;cursor:default;box-shadow:none}
.vazio{font-size:15px;color:var(--muted);padding:6px 0}
</style></head><body>
<header><div><h1>Mini Conceitos</h1><small>Revisão rápida · 10 assertivas curtas por tópico</small></div></header>
<main id="app"></main>
<script>
const D=[{"id": "ADM", "nome": "Direito Administrativo", "c": "#F9A825", "t": "#FFF8E1", "t2": "#FFECB3", "d": "#8A5200", "topicos": [{"n": 1, "nome": "Regime jurídico e princípios", "sub": "", "a": [["Legalidade é juridicidade: a Administração se vincula à lei, à Constituição e ao Direito como um todo, e não só à lei em sentido estrito.", "Resumo PDF 4"], ["O edital é a lei do concurso, mas não se sobrepõe à lei. Se a contraria, a Administração deve corrigi-lo em autotutela, mesmo após as provas. Não há direito adquirido a edital ilegal.", "Resumo PDF 4"], ["Motivação (Lei 9.784, art. 50): obrigatória nos atos que neguem, limitem ou afetem direitos ou imponham deveres e sanções. Deve ser explícita, clara e congruente.", "Resumo PDF 4"], ["Motivação aliunde é válida: o ato pode se fundar em pareceres ou decisões anteriores, que passam a integrá-lo. Em casos repetitivos admite-se meio mecânico.", "Resumo PDF 4"], ["Proporcionalidade: adequação, necessidade e proporcionalidade em sentido estrito. Há ponderação caso a caso, e a supremacia do interesse público não vence automaticamente.", "Resumo PDF 4"], ["Teoria do órgão: o ato é imputado ao órgão ou entidade, e não ao agente. Por isso a vítima processa o Estado.", "Resumo PDF 4"], ["Dupla garantia (STF, Tema 940): o agente não é parte passiva legítima na ação da vítima, e o Estado tem regresso contra ele em caso de dolo ou culpa.", "Resumo PDF 4"], ["Publicidade oficial não pode ter nomes, símbolos ou imagens de promoção pessoal (CF, art. 37, §1º). Nepotismo é vedado sem necessidade de lei formal (SV 13).", "Resumo PDF 4"], ["Lei 13.140, art. 32: as câmaras de prevenção e resolução administrativa de conflitos dirimem conflitos entre órgãos da Administração. A submissão é facultativa e o acordo é título executivo extrajudicial.", "Resumo PDF 4"], ["Autotutela (Súmulas 346 e 473 do STF): anula-se o ato ilegal e revoga-se o inconveniente, respeitados direitos adquiridos. Só ato discricionário é revogável. Anular ato favorável decai em 5 anos, salvo má-fé (Lei 9.784, art. 54).", "Resumo PDF 4"]]}, {"n": 2, "nome": "LINDB/Lei 13.655", "sub": "", "a": [["Art. 20 da LINDB: não se decide com base em valores jurídicos abstratos sem considerar as consequências práticas. A motivação deve mostrar a necessidade e a adequação da medida. Princípios não são proibidos.", "Resumo PDF 5"], ["Art. 21: a decisão que invalida ato, contrato ou norma deve indicar expressamente as consequências jurídicas e administrativas e as condições de regularização proporcional e equânime.", "Resumo PDF 5"], ["Art. 22: a interpretação de normas de gestão considera os obstáculos e as dificuldades reais do gestor, sem prejuízo dos direitos dos administrados.", "Resumo PDF 5"], ["Art. 22, §§2º e 3º: na sanção pesam a natureza e a gravidade da infração, os danos, agravantes, atenuantes e antecedentes. Sanções já aplicadas pelo mesmo fato entram na dosimetria.", "Resumo PDF 5"], ["Art. 23: a decisão que fixa interpretação nova sobre norma de conteúdo indeterminado, impondo novo dever ou condicionamento de direito, deverá prever regime de transição quando indispensável.", "Resumo PDF 5"], ["Art. 24: a revisão da validade de ato já produzido considera as orientações gerais da época. Mudança posterior de orientação não invalida situações plenamente constituídas.", "Resumo PDF 5"], ["Orientações gerais (art. 24): atos públicos de caráter geral, jurisprudência majoritária e prática administrativa reiterada e amplamente aceita.", "Resumo PDF 5"], ["Art. 26: o compromisso para eliminar irregularidade ou incerteza exige oitiva do órgão jurídico e só produz efeitos após publicação oficial. Não pode desonerar permanentemente de dever e deve prever sanção por descumprimento.", "Resumo PDF 5"], ["Art. 27: a decisão pode impor compensação por benefícios indevidos ou prejuízos anormais ou injustos, ouvidas as partes.", "Resumo PDF 5"], ["Arts. 28 a 30: o agente responde só por dolo ou erro grosseiro. A consulta pública sobre atos normativos é facultativa (\"poderá\"). Regulamentos, súmulas administrativas e respostas a consultas vinculam o órgão. A ação declaratória de validade (art. 25) foi vetada.", "Resumo PDF 5"]]}, {"n": 3, "nome": "Administração direta e indireta, entidades, agências", "sub": "", "a": [["Desconcentração: distribuição de competências dentro da mesma pessoa jurídica, entre órgãos, com hierarquia. Descentralização: transferência a outra pessoa.", "Resumo PDF 6 + aula em áudio"], ["Guarde: outorga é por lei e transfere titularidade e execução (criação de autarquia). Delegação é por contrato ou ato e transfere só a execução (concessão).", "Resumo PDF 6 + aula em áudio"], ["Entre a Administração direta e a indireta há vinculação (tutela, controle finalístico), prevista em lei. Não há hierarquia: o Ministério não é superior hierárquico da autarquia.", "Resumo PDF 6 + aula em áudio"], ["Autarquia: pessoa de direito público, criada por lei específica, com patrimônio e receitas próprios. Seus bens são públicos. Tem prazo em dobro, remessa necessária, precatórios e imunidade recíproca.", "Resumo PDF 6 + aula em áudio"], ["Autarquia federal litiga na Justiça Federal (CF, art. 109, I). Sua responsabilidade é objetiva (art. 37, §6º) e seu regime de pessoal, estatutário.", "Resumo PDF 6 + aula em áudio"], ["Fundação pública de direito público é autarquia fundacional, criada por lei. A de direito privado exige lei autorizadora e registro do estatuto. As áreas de atuação são definidas por lei complementar, e MP não trata disso.", "Resumo PDF 6 + aula em áudio"], ["Empresa pública (capital 100% público, qualquer forma societária) e sociedade de economia mista (S.A., maioria votante pública) são pessoas de direito privado, autorizadas por lei, com personalidade nascida do registro. Regidas pela Lei 13.303/2016.", "Resumo PDF 6 + aula em áudio"], ["Estatais: pessoal celetista, com concurso, sem estabilidade, mas com motivação na dispensa. Não se sujeitam à falência. Teto remuneratório só se receberem recursos para custeio.", "Resumo PDF 6 + aula em áudio"], ["Exploradora de atividade econômica segue o regime de empresa privada (art. 173). Prestadora de serviço público em regime não concorrencial pode ter precatório e impenhorabilidade dos bens afetados (ECT). Subsidiárias exigem autorização legislativa, que pode ser genérica.", "Resumo PDF 6 + aula em áudio"], ["Agências reguladoras (Lei 13.848): autarquias em regime especial, sem subordinação hierárquica, com dirigentes de mandato fixo nomeados após aprovação do Senado. Perdem o cargo só por renúncia, condenação transitada ou PAD. AIR é a regra; consulta pública não é obrigatória para todo ato. Agência executiva é qualificação por decreto, com contrato de gestão.", "Resumo PDF 6 + aula em áudio"]]}, {"n": 4, "nome": "Consórcios públicos e convênios", "sub": "", "a": [["Consórcio público é a união de entes federativos para a gestão associada de serviços públicos (CF, art. 241; Lei 11.107). Tem personalidade jurídica própria.", "Resumo PDF 7 + aula em áudio"], ["A personalidade pode ser de direito público (associação pública, que integra a Administração indireta de todos os entes) ou de direito privado, sem fins econômicos.", "Resumo PDF 7 + aula em áudio"], ["A União só participa se também participarem todos os Estados em cujo território estejam os Municípios consorciados.", "Resumo PDF 7 + aula em áudio"], ["Formação: protocolo de intenções, publicado na imprensa oficial, ratificado por lei de cada ente, que se converte em contrato de consórcio. Dispensa-se a ratificação do ente que já disciplinou por lei sua participação.", "Resumo PDF 7 + aula em áudio"], ["Contrato de rateio é o único meio de os entes entregarem recursos ao consórcio. Formaliza-se a cada exercício, exige prévia e suficiente dotação orçamentária e veda despesas genéricas.", "Resumo PDF 7 + aula em áudio"], ["Ente que não consigna a dotação no rateio pode ser excluído, após prévia suspensão. Despesa fora do contrato de rateio pode configurar improbidade.", "Resumo PDF 7 + aula em áudio"], ["Contrato de programa regula as obrigações na gestão associada de serviços, como saneamento, e subsiste mesmo se o consórcio for extinto.", "Resumo PDF 7 + aula em áudio"], ["Pessoal do consórcio é regido pela CLT, com observância das normas de direito público sobre licitação, contratos, prestação de contas e admissão.", "Resumo PDF 7 + aula em áudio"], ["O consórcio responde por seus atos e se sujeita ao controle externo do Tribunal de Contas. Os recursos repassados continuam públicos.", "Resumo PDF 7 + aula em áudio"], ["Convênio é ajuste de cooperação para objetivos comuns, com interesses convergentes. Não há preço, em regra não cria pessoa jurídica e exige prestação de contas. A Lei 14.133 se aplica no que couber (art. 184).", "Resumo PDF 7 + aula em áudio"]]}, {"n": 5, "nome": "Terceiro setor e Lei 13.019", "sub": "", "a": [["Terceiro setor: entidades privadas, sem fins lucrativos, de interesse público, ao lado do Estado e do mercado. Compõem-no Sistema S, OS, OSCIP e as OSC do MROSC. Recebem recursos públicos, mas se sujeitam a transparência e prestação de contas.", "Resumo PDF 8 + aula em áudio"], ["OS (Lei 9.637): qualificação dada pelo Poder Executivo, por ato discricionário. O instrumento é o contrato de gestão. O STF (ADI 1923) a admite, exigindo procedimento público, objetivo e impessoal.", "Resumo PDF 8 + aula em áudio"], ["OSCIP (Lei 9.790): qualificação dada pelo Ministério da Justiça, por ato vinculado. O instrumento é o termo de parceria. Sociedades comerciais e organizações partidárias não podem ser qualificadas.", "Resumo PDF 8 + aula em áudio"], ["Perda da qualificação de OSCIP: qualquer cidadão pode pedir, em via administrativa ou judicial. Quem sabe de irregularidade e não comunica responde solidariamente.", "Resumo PDF 8 + aula em áudio"], ["O título de OS ou OSCIP não é condição para receber recursos públicos ou celebrar parceria.", "Resumo PDF 8 + aula em áudio"], ["MROSC (Lei 13.019): regime das parcerias entre a Administração e as OSC. Substitui o convênio nas parcerias com entidades privadas sem fins lucrativos, ressalvada, por exemplo, a participação complementar no SUS.", "Resumo PDF 8 + aula em áudio"], ["Três instrumentos: termo de colaboração (proposta da Administração, com repasse), termo de fomento (proposta da OSC, com repasse) e acordo de cooperação (sem repasse).", "Resumo PDF 8 + aula em áudio"], ["A regra é o chamamento público. Dispensa (art. 30): urgência (até 180 dias), guerra e calamidade. Inexigibilidade (art. 31): inviabilidade de competição. O PMIS é só um canal de proposta e não condiciona o chamamento.", "Resumo PDF 8 + aula em áudio"], ["Requisitos da OSC: estatuto de relevância pública, destinação do patrimônio a entidade congênere, escrituração contábil e tempo mínimo com CNPJ ativo: 1 ano (Municípios), 2 (Estados) e 3 (União).", "Resumo PDF 8 + aula em áudio"], ["Execução: plano de trabalho e divulgação na internet e na sede (a sede não dispensa a internet). Pagam-se despesas com equipe e custos indiretos, mas não servidor da Administração. Sanções: advertência, suspensão (até 2 anos) e declaração de inidoneidade.", "Resumo PDF 8 + aula em áudio"]]}, {"n": 6, "nome": "Normas municipais de organização, Leis 7.671/91, 9.226/97, Dec. 1.192/17", "sub": "", "a": [["Lei 7.671/1991 reorganiza o Executivo de Curitiba em administração direta e indireta. A direta tem órgãos colegiados, de assessoramento, secretarias meio (Administração, Recursos Humanos, Finanças) e secretarias fim.", "Resumo PDF 9 + aula em áudio"], ["O Prefeito pode criar por decreto até duas secretarias extraordinárias, para programas de duração transitória (art. 3º). O Gabinete do Vice-Prefeito integra a estrutura básica.", "Resumo PDF 9 + aula em áudio"], ["Administração indireta na redação original: autarquias (IPPUC, IMAP e IPMC), fundações públicas (Fundação Cultural de Curitiba e FREI) e sociedades de economia mista (COHAB-CT, URBS e CIC).", "Resumo PDF 9 + aula em áudio"], ["A Lei 7.671 menciona empresas públicas como tipo possível, mas não relaciona nenhuma. As estatais adequam seus estatutos às novas competências (art. 36).", "Resumo PDF 9 + aula em áudio"], ["A Lei 9.226/1997 criou o Programa Municipal de Publicização. O Decreto 1.192/2017 o regulamenta, com base na decisão do STF na ADI 1923 sobre Organizações Sociais.", "Resumo PDF 9 + aula em áudio"], ["Podem ser OS pessoas jurídicas de direito privado sem fins lucrativos, em forma de fundação ou associação, nas áreas social, educacional, ambiental, científica, cultural, esportiva e de saúde. Exigem pareceres do órgão promotor e da Comissão Municipal de Publicização.", "Resumo PDF 9 + aula em áudio"], ["Qualificação de OS: por chamamento público, conduzido por Comissão de Qualificação, com edital de no mínimo 30 dias, e formalizada por decreto do Prefeito. A desqualificação cabe a qualquer tempo, com ampla defesa.", "Resumo PDF 9 + aula em áudio"], ["Contrato de gestão: cláusulas obrigatórias (objeto, metas com indicadores, recursos, prazo, sanções, bens e servidores cedidos). A minuta passa pela Procuradoria Geral do Município e pela Comissão, e o extrato é publicado no Diário Oficial e no Portal da Transparência.", "Resumo PDF 9 + aula em áudio"], ["Com mais de uma OS qualificada: chamamento público seletivo, com recurso em 5 dias úteis. Com uma só OS: Comunicado de Interesse Público, com manifestação em até 15 dias.", "Resumo PDF 9 + aula em áudio"], ["Controle: Conselho da OS, supervisão da administração signatária e fiscalização do Tribunal de Contas do Estado. Relatório anual da Comissão de Avaliação em até 90 dias. Intervenção só com risco comprovado, por até 180 dias. Servidor cedido tem ônus para a origem, e a remuneração paga pela OS não se incorpora ao cargo.", "Resumo PDF 9 + aula em áudio"]]}, {"n": 7, "nome": "Advocacia pública e responsabilidade do parecerista", "sub": "", "a": [["Regra geral (LINDB, art. 28): o agente público só responde pessoalmente por decisões ou opiniões técnicas em caso de dolo ou erro grosseiro. Culpa leve não basta.", "Resumo PDF 3"], ["A responsabilidade do agente é subjetiva, nunca objetiva. Vale para o gestor e para o parecerista.", "Resumo PDF 3"], ["Parecer, em regra, é ato opinativo (STF, MS 24.073 e MS 24.631). O facultativo não vincula a autoridade.", "Resumo PDF 3"], ["Parecer obrigatório não vinculante: o administrador pode divergir, desde que motive.", "Resumo PDF 3"], ["Parecer vinculante (a lei manda decidir nos termos dele) deixa de ser só opinativo. Admite-se responsabilidade solidária do parecerista.", "Resumo PDF 3"], ["Nos demais casos, o parecerista só responde por erro grave inescusável, culpa grave ou má-fé.", "Resumo PDF 3"], ["Gestor que segue parecer fundamentado presume-se de boa-fé e afasta o erro grosseiro. Isso não protege dolo, conluio nem parecer manifestamente ilegal.", "Resumo PDF 3"], ["Lei 14.133, art. 53: a assessoria jurídica faz controle prévio de legalidade ao fim da fase preparatória, com linguagem simples, clara e objetiva. A análise pode ser dispensada em casos definidos (baixo valor, baixa complexidade, minutas padronizadas).", "Resumo PDF 3"], ["Lei 14.133, art. 10: a defesa do agente por ato praticado com estrita observância de parecer é feita pela advocacia pública, a critério do agente, nas esferas administrativa, controladora e judicial, mesmo após deixar o cargo. Cai se houver prova de ilícito doloso.", "Resumo PDF 3"], ["Improbidade (Lei 14.230/21) só admite dolo. Parecer equivocado, por si só, não é improbidade, e divergência interpretativa baseada em jurisprudência, ainda que não pacificada, também não (art. 1º, §8º). A inviolabilidade do advogado vale nos limites da lei.", "Resumo PDF 3"]]}, {"n": 8, "nome": "Atos administrativos", "sub": "", "a": [["Ato administrativo é declaração da Administração que produz efeitos jurídicos imediatos, sob regime de direito público e controle judicial. Fato administrativo é atuação material, sem declaração de vontade.", "Resumo PDF 10 + aula em áudio"], ["Elementos: competência, finalidade, forma, motivo e objeto. Competência, finalidade e forma são sempre vinculadas. O mérito administrativo (conveniência e oportunidade) está no motivo e no objeto do ato discricionário.", "Resumo PDF 10 + aula em áudio"], ["Atributos: presunção de legitimidade e veracidade (relativa), imperatividade, exigibilidade e autoexecutoriedade. Esta só existe com previsão legal ou urgência. Nem todo ato tem todos os atributos: o enunciativo não tem imperatividade.", "Resumo PDF 10 + aula em áudio"], ["Motivação (Lei 9.784, art. 50): exigida nos atos que neguem, limitem ou afetem direitos, e pode ser per relationem. Pela teoria dos motivos determinantes, o motivo declarado vincula a validade do ato, mesmo se a motivação fosse dispensada.", "Resumo PDF 10 + aula em áudio"], ["Abuso de poder: excesso de poder (extrapola a competência) ou desvio de finalidade. A Lei 4.717 (art. 2º) lista cinco vícios: incompetência, forma, objeto, inexistência de motivos e desvio de finalidade.", "Resumo PDF 10 + aula em áudio"], ["Anulação: por ilegalidade, pela Administração ou pelo Judiciário, com efeitos ex tunc. Revogação: por conveniência e oportunidade, só pela Administração, com efeitos ex nunc e respeito a direitos adquiridos.", "Resumo PDF 10 + aula em áudio"], ["Cassação: o beneficiário descumpre condição. Caducidade: nova norma torna o ato incompatível. Contraposição: novo ato de competência diversa com efeito oposto.", "Resumo PDF 10 + aula em áudio"], ["Convalidação (Lei 9.784, art. 55): vícios sanáveis, sem lesão ao interesse público nem prejuízo a terceiros. Em regra, competência (não exclusiva) e forma (não essencial). Motivo, objeto e finalidade não se convalidam.", "Resumo PDF 10 + aula em áudio"], ["Ato simples (um órgão), composto (uma vontade e um ato de verificação, como o visto) e complexo (duas vontades de órgãos diferentes que se fundem). Licença é vinculada e definitiva; autorização é discricionária e precária.", "Resumo PDF 10 + aula em áudio"], ["Controle judicial: legalidade, razoabilidade e proporcionalidade, e não o mérito. Tema 138: ato que repercute em interesses individuais exige contraditório e ampla defesa. Em concurso, o Judiciário não substitui a banca na correção, salvo ilegalidade (Tema 485).", "Resumo PDF 10 + aula em áudio"]]}, {"n": 28, "nome": "Improbidade: Acordo de Não Persecução Cível (ANPC)", "sub": "", "a": [["O ANPC (Lei 8.429/92, art. 17-B) é a solução consensual da improbidade: o investigado assume obrigações e a ação não segue ou é encerrada.", "Resumo PDF 2"], ["O MP \"poderá\" celebrar o acordo, por conveniência e oportunidade. Não é direito subjetivo, e o juiz não pode suprir a recusa do MP.", "Resumo PDF 2"], ["Resultados mínimos: integral ressarcimento do dano e reversão da vantagem indevida à pessoa jurídica lesada. O ressarcimento não pode ser parcial.", "Resumo PDF 2"], ["Requisitos cumulativos (§1º): oitiva do ente lesado, aprovação do órgão do MP em até 60 dias e homologação judicial.", "Resumo PDF 2"], ["Ouvir o ente lesado não é exigir sua aquiescência: a concordância dele não é requisito de validade nem de eficácia (Res. CNMP 306, art. 9º).", "Resumo PDF 2"], ["ADIs 7042 e 7043 (STF): a legitimidade do MP e a do ente lesado para a ação e para o ANPC são concorrentes e disjuntivas, e não subsidiárias.", "Resumo PDF 2"], ["O ANPC pode ser feito na investigação, no curso da ação ou na execução da sentença, inclusive após o trânsito em julgado.", "Resumo PDF 2"], ["Descumprimento: impedimento de novo acordo por 5 anos, contados do conhecimento pelo MP. A decisão homologatória é título executivo judicial.", "Resumo PDF 2"], ["O ANPP (penal) não vincula o promotor do patrimônio público nem impede a ação de improbidade: as esferas penal e civil são independentes.", "Resumo PDF 2"], ["Prescrição (art. 23): 8 anos do fato e 4 anos intercorrente. O inquérito civil suspende por no máximo 180 dias. Ressarcimento por ato doloso é imprescritível (Tema 897).", "Resumo PDF 2"]]}]}, {"id": "CON", "nome": "Direito Constitucional", "c": "#43A047", "t": "#E8F5E9", "t2": "#C8E6C9", "d": "#1B5E20", "topicos": [{"n": 1, "nome": "Teoria da Constituição e hermenêutica", "sub": "", "a": [["Interpretar é atribuir sentido, e não só descrever um sentido pronto. A hermenêutica constitucional não abandona os métodos gerais: complementa-os com princípios próprios.", "Resumo PDF 2"], ["Unidade da Constituição: as normas de uma mesma Constituição são interpretadas de forma sistemática, harmonizando-se entre si.", "Resumo PDF 2"], ["Máxima efetividade: dá-se à norma o sentido que mais eficácia lhe confira, e nenhuma palavra, inciso ou artigo é supérfluo.", "Resumo PDF 2"], ["Concordância prática: harmonização entre bens e direitos em conflito, sem sacrificar totalmente nenhum deles.", "Resumo PDF 2"], ["Interpretação evolutiva liga-se à mutação constitucional: muda o sentido da norma, e não o texto.", "Resumo PDF 2"], ["Métodos segundo Canotilho: jurídico clássico, tópico-problemático (Viehweg), hermenêutico-concretizador (Hesse), científico-espiritual (Smend) e normativo-estruturante (Müller).", "Resumo PDF 2"], ["Tópico-problemático vai do problema à norma. Hermenêutico-concretizador vai da Constituição ao problema, com base no círculo hermenêutico.", "Resumo PDF 2"], ["Eficácia (José Afonso da Silva): plena (aplicabilidade imediata e integral), contida (o legislador pode restringir) e limitada (depende de regulamentação).", "Resumo PDF 2"], ["Quanto à alterabilidade, a CF/88 é rígida. A emenda exige 3/5 dos membros de cada Casa, em dois turnos (art. 60, §2º).", "Resumo PDF 2"], ["O STF não admite norma constitucional originária inconstitucional (ADI 815): cláusulas pétreas limitam só o poder constituinte derivado.", "Resumo PDF 2"]]}, {"n": 2, "nome": "Poder constituinte e princípios fundamentais", "sub": "", "a": [["O poder constituinte originário é inicial, autônomo e incondicionado, rompe com a ordem anterior e institui novo Estado. É de fato, político. Para os jusnaturalistas, o direito natural o limita.", "Resumo PDF 3"], ["Direito anterior compatível com a nova Constituição é recebido (recepção). Só perde vigor o incompatível.", "Resumo PDF 3"], ["O poder derivado é secundário, de direito, condicionado e limitado. Divide-se em reformador (emendas, art. 60) e decorrente (Constituições Estaduais).", "Resumo PDF 3"], ["O ADCT é obra do poder constituinte originário e tem a mesma hierarquia da Constituição, apesar da eficácia temporária.", "Resumo PDF 3"], ["Mutação constitucional é mudança informal de sentido da norma, sem alterar o texto.", "Resumo PDF 3"], ["Limites formais da emenda: iniciativa de 1/3 de uma Casa, Presidente ou mais da metade das Assembleias. Votação por 3/5 em dois turnos em cada Casa. Promulgação pelas Mesas, sem sanção nem veto.", "Resumo PDF 3"], ["Limites circunstanciais: não há emenda na vigência de intervenção federal, estado de defesa ou estado de sítio (art. 60, §1º).", "Resumo PDF 3"], ["Limites materiais (cláusulas pétreas, art. 60, §4º): forma federativa, voto direto, secreto, universal e periódico, separação dos Poderes e direitos e garantias individuais. Proíbem emenda tendente a abolir, mas não a ampliação de direitos.", "Resumo PDF 3"], ["Proposta de emenda rejeitada ou prejudicada só pode ser reapresentada na sessão legislativa seguinte (art. 60, §5º).", "Resumo PDF 3"], ["Fundamentos (art. 1º): soberania, cidadania, dignidade da pessoa humana, valores sociais do trabalho e da livre iniciativa e pluralismo político. Poderes: Legislativo, Executivo e Judiciário (o MP não é Poder). Objetivos estão no art. 3º, e os princípios das relações internacionais no art. 4º.", "Resumo PDF 3"]]}, {"n": 3, "nome": "Ações do controle concentrado", "sub": "", "a": [["Legitimados universais (CF, art. 103): Presidente da República, Mesas do Senado e da Câmara, PGR, Conselho Federal da OAB e partido político com representação no Congresso. Não precisam de pertinência temática.", "Resumo PDF 4"], ["Legitimados especiais, que exigem pertinência temática: Mesa de Assembleia Legislativa, Governador, confederação sindical e entidade de classe de âmbito nacional. Federação sindical não tem legitimidade.", "Resumo PDF 4"], ["Proposta a ADI, não se admite desistência (Lei 9.868, art. 5º).", "Resumo PDF 4"], ["A decisão em ADI é irrecorrível, salvo embargos de declaração, e não cabe ação rescisória. Tem efeito erga omnes e vinculante para o Judiciário e a Administração.", "Resumo PDF 4"], ["No processo objetivo não há prazo recursal em dobro para a Fazenda (ADI 5.814). Pessoa física não pode ser amicus curiae (ADI 3.396 AgR).", "Resumo PDF 4"], ["ADC: a petição inicial deve indicar controvérsia judicial relevante sobre a aplicação da norma.", "Resumo PDF 4"], ["ADO: declarada a omissão, dá-se ciência ao Poder competente. Se for órgão administrativo, o prazo é de 30 dias, ou prazo razoável fixado excepcionalmente.", "Resumo PDF 4"], ["ADPF (Lei 9.882) tem os mesmos legitimados da ADI. Admite exame de direito pré-constitucional, omissões do poder público (estado de coisas inconstitucional) e conjunto de decisões judiciais reiteradas.", "Resumo PDF 4"], ["ADPF não serve para desconstituir coisa julgada, nem para interpretar, revisar ou cancelar súmula vinculante (rito do art. 103-A, §2º). Sua decisão é irrecorrível e sem rescisória.", "Resumo PDF 4"], ["A medida provisória pode ser objeto de ADI. Convertida em lei, a ação prossegue se houver continuidade normativa, com aditamento se a alteração for substancial. MP não trata de matéria de lei complementar.", "Resumo PDF 4"]]}, {"n": 4, "nome": "Controle difuso, modulação, súmulas vinculantes, controle estadual", "sub": "", "a": [["Controle difuso: qualquer juiz ou tribunal examina a constitucionalidade como questão prejudicial no caso concreto. Efeitos, em regra, inter partes e ex tunc.", "Resumo PDF 5"], ["Cabe em qualquer ação, inclusive na ação civil pública, desde que a inconstitucionalidade não seja o pedido principal.", "Resumo PDF 5"], ["Cláusula de reserva de plenário (CF, art. 97): a inconstitucionalidade só se declara pela maioria absoluta dos membros do tribunal ou do órgão especial.", "Resumo PDF 5"], ["SV 10: viola a reserva de plenário a decisão de órgão fracionário que, sem declarar a inconstitucionalidade, afasta a incidência da lei no todo ou em parte.", "Resumo PDF 5"], ["Dispensa a reserva de plenário: pronunciamento anterior do plenário ou órgão especial do próprio tribunal ou do STF (CPC, art. 949, p. único). Também não vale para juiz singular nem turma recursal.", "Resumo PDF 5"], ["Resolução do Senado (art. 52, X): suspende a lei declarada inconstitucional pelo STF em controle difuso. É discricionária e, na visão tradicional, dá eficácia erga omnes.", "Resumo PDF 5"], ["Modulação (Lei 9.868, art. 27): por 2/3 dos ministros do STF (oito), por segurança jurídica ou excepcional interesse social. Sem modulação, a regra é a nulidade ex tunc, com efeito repristinatório.", "Resumo PDF 5"], ["Súmula vinculante (art. 103-A): aprovada por 2/3 do STF, após reiteradas decisões sobre matéria constitucional com controvérsia atual e grave insegurança jurídica. Vincula o Judiciário e a Administração, mas não o STF nem o Legislativo ao legislar.", "Resumo PDF 5"], ["Legitimados da SV: os do art. 103, mais o Defensor Público-Geral da União, os Tribunais e, incidentalmente, o Município, sem suspensão do processo. Descumprimento: reclamação ao STF.", "Resumo PDF 5"], ["Controle estadual (art. 125, §2º): o TJ julga a representação contra lei estadual ou municipal em face da Constituição Estadual, vedada a legitimação de um só órgão. A lei orgânica não é parâmetro. Lei municipal contra a CF: só ADPF no STF.", "Resumo PDF 5"]]}, {"n": 5, "nome": "Direitos fundamentais: teoria e direitos individuais/sociais", "sub": "", "a": [["Características dos direitos fundamentais: universalidade, historicidade, inalienabilidade, imprescritibilidade, irrenunciabilidade (em regra), limitabilidade e cumulatividade. Não há direito absoluto.", "Resumo PDF 6 + aula em áudio"], ["Restrições devem respeitar a proporcionalidade e o núcleo essencial. Na colisão, aplicam-se a ponderação (Alexy) ou a concordância prática (Hesse).", "Resumo PDF 6 + aula em áudio"], ["Eficácia vertical (contra o Estado) e horizontal (entre particulares). O STF admite a eficácia direta nas relações privadas (RE 201.819 e RE 161.243). O art. 5º, §1º, dá aplicação imediata às normas de direitos fundamentais.", "Resumo PDF 6 + aula em áudio"], ["Art. 5º, §2º: o rol é aberto. §3º: tratado de direitos humanos aprovado por 3/5 em dois turnos em cada Casa equivale a emenda constitucional. Os demais têm status supralegal (SV 25).", "Resumo PDF 6 + aula em áudio"], ["Titulares: pessoas naturais, pessoas jurídicas (no que couber) e estrangeiros, residentes ou não.", "Resumo PDF 6 + aula em áudio"], ["Igualdade: ações afirmativas são constitucionais (cotas raciais: ADPF 186 e ADC 41). Restrições em concurso só se justificadas pela natureza do cargo (Súmula 683). Isenção de taxa para servidores, sem igualdade substancial, é inconstitucional.", "Resumo PDF 6 + aula em áudio"], ["Liberdade de expressão pondera-se com honra e imagem e não prevalece sempre. Reunião: pacífica, sem armas, sem autorização, mas com prévio aviso. Associação: dissolução só por decisão judicial transitada em julgado; suspensão por decisão judicial.", "Resumo PDF 6 + aula em áudio"], ["Quebra de sigilo telefônico exige ordem judicial. Dados cadastrais (nome, filiação, endereço) podem ser acessados por autoridades sem ordem (STF). Sigilo bancário e fiscal: ordem judicial ou CPI.", "Resumo PDF 6 + aula em áudio"], ["Domicílio (art. 5º, XI): consentimento, flagrante, desastre ou socorro, e ordem judicial apenas de dia. Entrada em flagrante exige fundadas razões (Tema 280). Pequena propriedade rural familiar é impenhorável. Prova ilícita é inadmissível e presunção de inocência vai até o trânsito em julgado.", "Resumo PDF 6 + aula em áudio"], ["Direitos sociais (art. 6º) são fundamentais, de aplicação imediata, e não meras normas programáticas. Aplicam-se o mínimo existencial e a vedação do retrocesso. Vaga em creche e pré-escola é dever do Estado (Tema 548).", "Resumo PDF 6 + aula em áudio"]]}, {"n": 6, "nome": "Remédios constitucionais e ações constitucionais", "sub": "", "a": [["Habeas corpus protege a liberdade de locomoção contra ilegalidade ou abuso de poder. É gratuito, dispensa advogado e pode ser preventivo (salvo-conduto) ou liberatório.", "Resumo PDF 7 + aula em áudio"], ["Não cabe habeas corpus quanto ao mérito de punição disciplinar militar (CF, art. 142, §2º).", "Resumo PDF 7 + aula em áudio"], ["Habeas data conhece ou retifica informações do impetrante em registros de entidades governamentais ou de caráter público. Exige prova da recusa administrativa (Súmula 2 do STJ). É gratuito.", "Resumo PDF 7 + aula em áudio"], ["Mandado de segurança protege direito líquido e certo, não amparado por HC ou HD, contra ato de autoridade. Exige prova pré-constituída. O prazo é de 120 dias da ciência do ato, decadencial.", "Resumo PDF 7 + aula em áudio"], ["Não cabe mandado de segurança contra lei em tese (Súmula 266 do STF). Não há condenação em honorários (Súmula 105 do STJ e Súmula 512 do STF).", "Resumo PDF 7 + aula em áudio"], ["Mandado de segurança coletivo: partido com representação no Congresso e organização sindical, entidade de classe ou associação com um ano de constituição. É substituição processual, sem autorização individual (Súmula 629).", "Resumo PDF 7 + aula em áudio"], ["No MS coletivo, basta que o direito atinja parte da categoria (Súmula 630), e a coisa julgada se limita aos membros do grupo.", "Resumo PDF 7 + aula em áudio"], ["Mandado de injunção (Lei 13.300): cabe quando a falta de norma regulamentadora inviabiliza direitos e liberdades constitucionais e prerrogativas ligadas à nacionalidade, soberania e cidadania.", "Resumo PDF 7 + aula em áudio"], ["No mandado de injunção, a eficácia pode ser concretista: o juiz fixa prazo ao legislador e, persistindo a omissão, estabelece as condições do exercício. Não serve para compelir ato administrativo concreto.", "Resumo PDF 7 + aula em áudio"], ["Ação popular: só o cidadão (eleitor) propõe, para anular ato lesivo ao patrimônio público, à moralidade, ao meio ambiente ou ao patrimônio histórico e cultural. Pessoa jurídica não propõe (Súmula 365). Autor é isento de custas, salvo má-fé, e prescreve em 5 anos. O MP não é autor originário.", "Resumo PDF 7 + aula em áudio"]]}, {"n": 7, "nome": "Reserva do possível, mínimo existencial, PcD, Idoso", "sub": "", "a": [["Reserva do possível é limite fático e jurídico à efetivação dos direitos sociais, ligado a recursos e razoabilidade. Não pode esvaziar o mínimo existencial (ADPF 45).", "Resumo PDF 8 + aula em áudio"], ["Cabe ao Poder Público provar a falta de recursos, e não apenas alegá-la.", "Resumo PDF 8 + aula em áudio"], ["Mínimo existencial é o núcleo que garante vida digna, extraído da dignidade humana e do art. 6º: saúde básica, educação fundamental, moradia e assistência.", "Resumo PDF 8 + aula em áudio"], ["O Judiciário pode impor obrigações de fazer diante de omissão que viola o mínimo existencial, sem ofender a separação dos Poderes (RE 592.581 e RE 410.715).", "Resumo PDF 8 + aula em áudio"], ["Saúde: os entes são solidariamente responsáveis, e o autor demanda qualquer um (Tema 793). A falta de dotação orçamentária não impede ordem judicial de medicamento essencial. Fora do SUS, o dever é excepcional, com requisitos do STF.", "Resumo PDF 8 + aula em áudio"], ["Aplicam-se a vedação do retrocesso social e a proibição da proteção insuficiente.", "Resumo PDF 8 + aula em áudio"], ["A Convenção sobre os Direitos das Pessoas com Deficiência tem status de emenda constitucional (art. 5º, §3º). A LBI adota o modelo biopsicossocial: impedimento de longo prazo em interação com barreiras, avaliado por equipe multiprofissional.", "Resumo PDF 8 + aula em áudio"], ["A pessoa com deficiência é plenamente capaz. A curatela é excepcional, proporcional e limitada a atos patrimoniais e negociais. Existe a tomada de decisão apoiada. A recusa de adaptação razoável exige demonstrar ônus desproporcional e indevido.", "Resumo PDF 8 + aula em áudio"], ["Educação inclusiva em escola regular. Escolas privadas também cumprem e não podem cobrar a mais (ADI 5357). Em concursos há reserva de vagas e adaptações razoáveis (CF, art. 37, VIII).", "Resumo PDF 8 + aula em áudio"], ["Pessoa idosa: 60 anos ou mais. Prioridade na tramitação, especial a partir de 80. Vedado reajuste de plano de saúde por faixa etária a partir de 60. Gratuidade no transporte urbano aos 65. Medidas de proteção cabem por ameaça ou violação por família, sociedade, Estado ou conduta da própria pessoa, e o MP pode requerê-las. Alimentos são obrigação solidária.", "Resumo PDF 8 + aula em áudio"]]}, {"n": 8, "nome": "Federação e competências", "sub": "", "a": [["A Federação é cláusula pétrea (CF, art. 60, §4º, I). União, Estados, DF e Municípios são autônomos (art. 18), com auto-organização, autogoverno, autolegislação e autoadministração. Não há direito de secessão.", "Resumo PDF 9 + aula em áudio"], ["Competência material exclusiva da União (art. 21) é indelegável. A comum (art. 23) é de todos os entes, em cooperação.", "Resumo PDF 9 + aula em áudio"], ["Legislativa privativa da União (art. 22) pode ser delegada aos Estados por lei complementar, sobre questões específicas. A competência remanescente é dos Estados (art. 25, §1º).", "Resumo PDF 9 + aula em áudio"], ["Concorrente (art. 24): a União edita normas gerais e os Estados suplementam. Sem lei federal, os Estados exercem a competência plena. A lei federal superveniente suspende a estadual no que for contrária.", "Resumo PDF 9 + aula em áudio"], ["Florestas, caça, pesca e fauna são competência concorrente. Trânsito, transporte e populações indígenas são privativos da União.", "Resumo PDF 9 + aula em áudio"], ["O Município é ente federativo, com Lei Orgânica própria. Legisla sobre interesse local e suplementa a legislação federal e estadual (art. 30). SV 38: pode fixar o horário de funcionamento do comércio. Não legisla sobre matéria privativa da União.", "Resumo PDF 9 + aula em áudio"], ["Bens da União (art. 20): terras devolutas indispensáveis à defesa, rios que banham mais de um Estado, mar territorial, recursos minerais. Dos Estados (art. 26): águas superficiais ou subterrâneas e ilhas fluviais e lacustres. O Município não tem lista própria na Constituição.", "Resumo PDF 9 + aula em áudio"], ["Intervenção federal (arts. 34 a 36) é exceção à autonomia: integridade nacional, invasão, grave comprometimento da ordem pública, livre exercício dos Poderes, finanças, execução de lei federal ou decisão judicial e princípios sensíveis. O decreto é do Presidente e vai ao Congresso em 24 horas.", "Resumo PDF 9 + aula em áudio"], ["Nos casos do art. 34, VI e VII, e do art. 35, IV, o decreto dispensa a apreciação do Legislativo e se limita a suspender o ato impugnado, se bastar.", "Resumo PDF 9 + aula em áudio"], ["Intervenção estadual em Município (art. 35), em rol taxativo: dívida fundada não paga por 2 anos consecutivos, falta de prestação de contas, não aplicação do mínimo em ensino e saúde, e garantia de princípios da Constituição Estadual ou execução de lei ou decisão judicial. A Constituição Estadual não cria outras hipóteses. Não cabe RE contra o acórdão do TJ que defere a intervenção (Súmula 637).", "Resumo PDF 9 + aula em áudio"]]}, {"n": 9, "nome": "Municípios, Lei Orgânica de Curitiba, Constituição do Paraná, intervenção", "sub": "", "a": [["O Município é ente federativo autônomo (CF, art. 18), com auto-organização pela Lei Orgânica, e não por Constituição. Não tem Poder Judiciário próprio.", "Resumo PDF 10 + aula em áudio"], ["Criação de Município: lei estadual, dentro do período fixado por lei complementar federal, após estudo de viabilidade e plebiscito com a população dos Municípios envolvidos (art. 18, §4º).", "Resumo PDF 10 + aula em áudio"], ["Lei Orgânica (art. 29): votada em dois turnos, com interstício mínimo de dez dias, aprovada por dois terços da Câmara, que a promulga. Não há sanção nem veto do Prefeito.", "Resumo PDF 10 + aula em áudio"], ["Prefeito e Vice: mandato de 4 anos, eleição no primeiro domingo de outubro, com segundo turno em Municípios com mais de 200 mil eleitores. Posse em 1º de janeiro.", "Resumo PDF 10 + aula em áudio"], ["Prefeito é julgado pelo TJ nos crimes comuns. Para crimes federais ou eleitorais, vai ao TRF ou TRE (Súmula 702 do STF).", "Resumo PDF 10 + aula em áudio"], ["Vereadores: número proporcional à população (Curitiba tem 38). Subsídio fixado por lei de uma legislatura para a seguinte, até 75% do subsídio dos deputados estaduais nas cidades com mais de 500 mil habitantes. Inviolabilidade por opiniões, palavras e votos no exercício do mandato e na circunscrição do Município.", "Resumo PDF 10 + aula em áudio"], ["Despesa da Câmara (art. 29-A): limitada a percentual da receita tributária do ano anterior (4,5% entre 500 mil e 3 milhões de habitantes). A folha não passa de 70% do orçamento. É crime de responsabilidade do Prefeito repassar a mais, não repassar até o dia 20 ou repassar menos que o fixado.", "Resumo PDF 10 + aula em áudio"], ["Controle externo (art. 31): da Câmara, com auxílio do Tribunal de Contas. O parecer prévio sobre as contas do Prefeito só deixa de prevalecer por dois terços da Câmara. Tema 835: a Câmara julga as contas de governo e de gestão, para fins de inelegibilidade. Não se criam novos tribunais de contas municipais.", "Resumo PDF 10 + aula em áudio"], ["Decreto-Lei 201/1967: crimes de responsabilidade são julgados pelo Judiciário; infrações político-administrativas, pela Câmara, com cassação. Tema 917: lei de iniciativa parlamentar que cria despesa, sem tratar da estrutura da Administração, não usurpa a competência do Executivo. SV 13 veda nepotismo nos três Poderes.", "Resumo PDF 10 + aula em áudio"], ["Região metropolitana: instituída pelo Estado por lei complementar (art. 25, §3º). Na ADI 1842, o STF decidiu que a competência sobre saneamento é compartilhada entre Estado e Municípios da região. Confira os textos da Lei Orgânica de Curitiba e da Constituição do Paraná.", "Resumo PDF 10 + aula em áudio"]]}]}, {"id": "TRI", "nome": "Direito Tributário", "c": "#FB8C00", "t": "#FFF3E0", "t2": "#FFE0B2", "d": "#BF360C", "topicos": [{"n": 1, "nome": "Princípios, limitações ao poder de tributar, imunidades", "sub": "", "a": [["Instituir ou majorar tributo exige lei (CF, art. 150, I; CTN, art. 97). A atualização monetária pelo índice oficial não é majoração.", "Resumo PDF 2"], ["Podem ter alíquotas alteradas pelo Executivo, nos limites da lei: II, IE, IPI e IOF (art. 153, §1º). Taxa não pode ser instituída por decreto.", "Resumo PDF 2"], ["Anterioridade anual e nonagesimal (art. 150, III, \"b\" e \"c\"): II, IE, IOF, imposto extraordinário de guerra e empréstimo compulsório de guerra ou calamidade escapam das duas.", "Resumo PDF 2"], ["IPI e contribuições sociais escapam só da anual e respeitam a noventena. IR e a base de cálculo do IPTU e do IPVA escapam só da noventena.", "Resumo PDF 2"], ["Medida provisória pode tratar de imposto, que só produz efeitos no exercício seguinte se convertida em lei até o último dia do exercício em que foi editada.", "Resumo PDF 2"], ["Imunidade recíproca (art. 150, VI, \"a\"): alcança União, Estados, DF, Municípios, autarquias e fundações públicas, só quanto a impostos e às finalidades essenciais.", "Resumo PDF 2"], ["A imunidade recíproca não vale para atividade econômica regida pelo direito privado nem quando há preço ou tarifa pago pelo usuário.", "Resumo PDF 2"], ["Templos de qualquer culto são imunes a impostos, inclusive suas organizações assistenciais. A taxa de lixo é devida (SV 19), pois imunidade só alcança impostos.", "Resumo PDF 2"], ["Imunidade protege a entidade, e não a pessoa física: salário de empregado e remuneração de ministro religioso sofrem IRPF.", "Resumo PDF 2"], ["Imunidade musical (art. 150, VI, \"e\") abrange o produto nacional. O STF não a estende a suportes importados de fora do Brasil.", "Resumo PDF 2"]]}, {"n": 2, "nome": "Competência, fontes, vigência, interpretação", "sub": "", "a": [["Competência tributária é indelegável (CTN, art. 7º). Delegam-se apenas as funções de arrecadar ou fiscalizar tributos (capacidade tributária ativa).", "Resumo PDF 3"], ["A atribuição de funções pode ser revogada a qualquer tempo, por ato unilateral. Quem a recebe tem as garantias e privilégios processuais do atribuinte.", "Resumo PDF 3"], ["Arrecadação por banco ou outra pessoa de direito privado não é delegação de competência (art. 7º, §3º).", "Resumo PDF 3"], ["O não exercício da competência tributária não a transfere a outro ente (art. 8º).", "Resumo PDF 3"], ["Legislação tributária (art. 96) inclui leis, tratados, decretos e normas complementares, e abrange as obrigações acessórias. Decreto não inova: seu conteúdo e alcance se restringem aos da lei (art. 99).", "Resumo PDF 3"], ["Tratados revogam ou modificam a legislação interna e são observados pela superveniente (art. 98). Súmula 575 do STF estende ao importado de país do GATT ou da ALALC a isenção dada ao similar nacional.", "Resumo PDF 3"], ["Normas complementares (art. 100): atos normativos das autoridades administrativas, decisões com eficácia normativa, práticas reiteradas e convênios. Sua observância exclui penalidades, juros de mora e atualização monetária.", "Resumo PDF 3"], ["Vigência (arts. 103 e 104): ato normativo, na publicação. Decisão com eficácia normativa, 30 dias depois. Convênio, na data nele prevista. Impostos sobre patrimônio ou renda que criam ou majoram entram em vigor em 1º de janeiro seguinte.", "Resumo PDF 3"], ["A lei aplica-se a fatos geradores futuros e pendentes. Lei interpretativa retroage, salvo para penalidade. Lei mais benigna retroage a ato não definitivamente julgado, sem fraude. Majorar tributo nunca retroage.", "Resumo PDF 3"], ["Integração: analogia, princípios gerais de direito tributário, princípios gerais de direito público e equidade, sem exigir tributo não previsto em lei (art. 108). Interpretação literal (art. 111) para suspensão ou exclusão do crédito, isenção e dispensa de acessórias. Na dúvida sobre infrações, interpreta-se a favor do acusado (art. 112).", "Resumo PDF 3"]]}, {"n": 3, "nome": "Tributos e regra-matriz", "sub": "", "a": [["Tributo (CTN, art. 3º): prestação pecuniária compulsória, que não é sanção de ato ilícito, instituída em lei e cobrada por atividade administrativa plenamente vinculada.", "Resumo PDF 4"], ["Pecunia non olet (art. 118, I): a ilicitude do fato praticado é irrelevante para a incidência. Multa não é tributo.", "Resumo PDF 4"], ["Espécies segundo o STF (teoria pentapartida): impostos, taxas, contribuição de melhoria, empréstimos compulsórios e contribuições especiais.", "Resumo PDF 4"], ["Empréstimo compulsório: competência exclusiva da União, por lei complementar. Guerra ou calamidade dispensam anterioridade, e investimento urgente e relevante a exige. Recurso vinculado e restituível.", "Resumo PDF 4"], ["Taxa exige serviço público específico e divisível ou poder de polícia. SV 19: coleta domiciliar de lixo pode, limpeza de vias não. Segurança pública não é taxa.", "Resumo PDF 4"], ["SV 29: a taxa pode usar elemento da base de cálculo de imposto, sem identidade integral. SV 41: iluminação pública não pode ser taxa; há a contribuição do art. 149-A, dos Municípios e do DF.", "Resumo PDF 4"], ["Contribuição de melhoria (competência comum) exige obra pública e valorização imobiliária. Limite total é a despesa da obra e individual é o acréscimo de valor. Exige edital prévio.", "Resumo PDF 4"], ["Contribuições: CIDE e sociais, de competência da União (art. 149). As de seguridade seguem a noventena e não a anterioridade anual (art. 195, §6º). Nova fonte de custeio exige lei complementar.", "Resumo PDF 4"], ["Regra-matriz, hipótese: critério material (verbo e complemento), espacial (onde) e temporal (quando).", "Resumo PDF 4"], ["Regra-matriz, consequência: critério pessoal (sujeitos ativo e passivo) e quantitativo (base de cálculo e alíquota). No IPTU, o critério material é \"ser proprietário de imóvel urbano\".", "Resumo PDF 4"]]}, {"n": 4, "nome": "Obrigação tributária e responsabilidade", "sub": "", "a": [["Obrigação principal tem por objeto pagar tributo ou penalidade pecuniária. A acessória é prestação positiva ou negativa no interesse da fiscalização. Descumprida, converte-se em principal quanto à penalidade (CTN, art. 113, §3º).", "Resumo PDF 5"], ["Sujeito passivo: contribuinte tem relação pessoal e direta com o fato gerador; responsável tem obrigação decorrente de lei (art. 121). Convenções particulares não se opõem à Fazenda (art. 123).", "Resumo PDF 5"], ["Solidariedade (art. 124): interesse comum na situação que constitui o fato gerador, ou designação legal. Não há benefício de ordem, e o interesse meramente econômico não basta.", "Resumo PDF 5"], ["Imóveis (art. 130): tributos sobre a propriedade sub-rogam-se na pessoa do adquirente, salvo prova de quitação no título. Na arrematação em hasta pública, a sub-rogação ocorre sobre o preço.", "Resumo PDF 5"], ["Fusão, transformação e incorporação: a sucessora responde pelos tributos da sucedida (art. 132). O STJ dispensa nova CDA se a sucessão não foi comunicada ao Fisco.", "Resumo PDF 5"], ["Fundo de comércio (art. 133): o adquirente responde integralmente se o alienante cessar a atividade, e subsidiariamente se este continuar ou retomar em seis meses. Não se aplica à alienação judicial em falência ou recuperação.", "Resumo PDF 5"], ["Art. 134: responsabilidade de terceiros é subsidiária, quando impossível exigir do contribuinte, e quanto a penalidades só as moratórias.", "Resumo PDF 5"], ["Art. 135: respondem pessoalmente mandatários, prepostos, empregados e diretores por atos com excesso de poderes ou infração de lei, contrato social ou estatutos.", "Resumo PDF 5"], ["Súmula 430 do STJ: o simples inadimplemento não responsabiliza o sócio-gerente. Súmula 435: a empresa que deixa de funcionar no domicílio fiscal sem comunicar presume-se dissolvida irregularmente, o que autoriza o redirecionamento.", "Resumo PDF 5"], ["Infrações: responsabilidade em regra objetiva (art. 136). Denúncia espontânea (art. 138) exige pagamento do tributo e juros antes de procedimento fiscal, e não vale para tributo declarado e pago em atraso (Súmula 360 do STJ).", "Resumo PDF 5"]]}, {"n": 5, "nome": "Crédito tributário: lançamento, suspensão, extinção, exclusão, decadência/prescrição", "sub": "", "a": [["Lançamento (CTN, art. 142): procedimento privativo da autoridade, vinculado e obrigatório, que constitui o crédito. Modalidades: de ofício, por declaração e por homologação.", "Resumo PDF 6 + aula em áudio"], ["Súmula 436 do STJ: a entrega de declaração (DCTF, GIA) constitui o crédito, sem outro ato do Fisco. Rege o lançamento a lei vigente na data do fato gerador. Mudança de critério jurídico só vale para fatos futuros.", "Resumo PDF 6 + aula em áudio"], ["Suspensão da exigibilidade (art. 151), macete MORTAL: Moratória, depósito integral, Reclamações e recursos administrativos, Liminar em mandado de segurança (ou tutela de urgência) e Parcelamento.", "Resumo PDF 6 + aula em áudio"], ["O depósito deve ser integral e em dinheiro (Súmula 112 do STJ). A suspensão não dispensa obrigações acessórias. SV 21: é vedado exigir depósito ou arrolamento para recurso administrativo.", "Resumo PDF 6 + aula em áudio"], ["Extinção (art. 156): pagamento, compensação, transação, remissão, prescrição, decadência, conversão de depósito em renda, homologação, consignação, decisão administrativa irreformável, decisão judicial transitada e dação de imóveis. Moratória e parcelamento suspendem, e não extinguem.", "Resumo PDF 6 + aula em áudio"], ["Repetição do indébito: 5 anos da extinção do crédito (nos tributos por homologação, do pagamento antecipado). A ação anulatória da decisão que nega a restituição prescreve em 2 anos, e lei estadual não altera.", "Resumo PDF 6 + aula em áudio"], ["Compensação depende de lei autorizadora e é vedada antes do trânsito em julgado (art. 170-A). O mandado de segurança declara o direito, mas não convalida a compensação (Súmula 213). Súmula 212: não se defere em liminar.", "Resumo PDF 6 + aula em áudio"], ["Decadência (art. 173): 5 anos para constituir o crédito, contados do primeiro dia do exercício seguinte ao em que o lançamento poderia ser feito. Com pagamento antecipado, conta-se do fato gerador (art. 150, §4º). Decadência não se suspende nem se interrompe.", "Resumo PDF 6 + aula em áudio"], ["Prescrição (art. 174): 5 anos para cobrar, da constituição definitiva. Interrompe-se pelo despacho que ordena a citação em execução fiscal, protesto judicial, ato que constitua em mora e ato inequívoco do devedor. A decadência extingue o direito de lançar; a prescrição, a ação de cobrança.", "Resumo PDF 6 + aula em áudio"], ["Exclusão: isenção e anistia. Isenção exige lei específica e atinge fatos futuros; anistia alcança infrações passadas, nunca dolo, fraude ou simulação. Nenhuma dispensa obrigações acessórias.", "Resumo PDF 6 + aula em áudio"]]}, {"n": 6, "nome": "Reforma tributária: IBS, CBS, IS, LC 214", "sub": "", "a": [["IVA dual (EC 132/2023): a CBS é federal e substitui PIS e Cofins. O IBS é compartilhado entre Estados, DF e Municípios, com legislação uniforme, e substitui ICMS e ISS.", "Resumo PDF 7 + aula em áudio"], ["O IPI fica reduzido a zero, salvo produtos que concorrem com a Zona Franca de Manaus. O Imposto Seletivo (IS) é federal.", "Resumo PDF 7 + aula em áudio"], ["IBS e CBS incidem sobre operações com bens materiais e imateriais, serviços e direitos, inclusive importações, e não incidem sobre exportações.", "Resumo PDF 7 + aula em áudio"], ["A não cumulatividade é ampla, com crédito financeiro, salvo exceções constitucionais como uso e consumo pessoal.", "Resumo PDF 7 + aula em áudio"], ["O IBS segue o princípio do destino (cobrança onde ocorre o consumo). O imposto é cobrado por fora, sem integrar a própria base.", "Resumo PDF 7 + aula em áudio"], ["Cada ente fixa por lei a sua alíquota de IBS, uniforme para todas as operações, ressalvados os regimes diferenciados.", "Resumo PDF 7 + aula em áudio"], ["LC 214/2025: alíquota zero para a cesta básica nacional, redução de 60% (saúde, educação, alimentos, dispositivos médicos) e de 30% (profissionais liberais). Há cashback para famílias de baixa renda e split payment.", "Resumo PDF 7 + aula em áudio"], ["Imposto Seletivo: extrafiscal, incide uma só vez (monofásico) sobre bens e serviços prejudiciais à saúde e ao meio ambiente. Em regra não incide sobre exportações, e pode coexistir com IBS e CBS.", "Resumo PDF 7 + aula em áudio"], ["Transição: 2026 é teste (CBS 0,9% e IBS 0,1%). Em 2027 a CBS é plena e o IPI zera. De 2029 a 2032, reduz-se gradualmente ICMS e ISS. Em 2033 o IBS é pleno e ICMS e ISS são extintos.", "Resumo PDF 7 + aula em áudio"], ["A CF veda incentivos e benefícios fiscais de IBS e CBS fora dos previstos nela. O Comitê Gestor do IBS não regulamenta fato gerador, base de cálculo e contribuintes sem lei complementar.", "Resumo PDF 7 + aula em áudio"]]}, {"n": 7, "nome": "Comitê Gestor, transição e processo do IBS, LC 227", "sub": "", "a": [["O Comitê Gestor do IBS (CG-IBS) exerce, de forma integrada, as atribuições de Estados, DF e Municípios sobre o IBS (CF, art. 156-B), e só por meio dele.", "Resumo PDF 8 + aula em áudio"], ["Atribuições do CG-IBS: editar o regulamento único e uniformizar a interpretação, arrecadar, compensar e distribuir o produto, e decidir o contencioso administrativo.", "Resumo PDF 8 + aula em áudio"], ["A LC 227/2026 (sancionada em 13/01/2026) instituiu o CG-IBS e tratou de fiscalização, cobrança e contencioso. Também alterou a LC 214/2025 e trouxe normas gerais do ITCMD.", "Resumo PDF 8 + aula em áudio"], ["O CG-IBS tem caráter técnico, atuação nacional e sede no DF. Sua gestão é compartilhada entre Estados, DF e Municípios, e não da União. O Conselho Superior decide por maioria qualificada.", "Resumo PDF 8 + aula em áudio"], ["O IBS é não cumulativo, neutro e segue o destino. Cada ente fixa sua alíquota por lei específica, e o Senado fixa as alíquotas de referência. O CG-IBS não fixa alíquota de todos.", "Resumo PDF 8 + aula em áudio"], ["Cronograma: 2026, teste. 2027, CBS plena, fim de PIS e Cofins e início do Imposto Seletivo. 2029 a 2032, redução gradual de ICMS e ISS. 2033, IBS pleno e extinção de ICMS e ISS.", "Resumo PDF 8 + aula em áudio"], ["Na transição, o destino convive com retenção e redistribuição por receita histórica (ADCT, art. 131 e ss.), para evitar perdas bruscas aos entes.", "Resumo PDF 8 + aula em áudio"], ["Durante a transição pode haver cumulatividade residual, pela convivência dos dois sistemas.", "Resumo PDF 8 + aula em áudio"], ["Os processos administrativos do IBS e da CBS são apartados. O CG-IBS decide o contencioso do IBS.", "Resumo PDF 8 + aula em áudio"], ["Câmara Nacional de Integração do Contencioso Administrativo do IBS e da CBS: uniformiza a legislação comum, e suas decisões vinculam o CARF e o Conselho Superior do CG-IBS.", "Resumo PDF 8 + aula em áudio"]]}, {"n": 8, "nome": "IPTU", "sub": "", "a": [["O IPTU é de competência do Município ou DF. O fato gerador é ser proprietário, titular do domínio útil ou possuidor a qualquer título de imóvel por natureza ou acessão física, na zona urbana (CTN, art. 32). Zona rural é ITR.", "Resumo PDF 9 + aula em áudio"], ["Zona urbana, definida em lei municipal, exige ao menos dois de cinco melhoramentos: meio-fio, água, esgoto, iluminação pública e escola ou posto de saúde a até 3 km. Expansão urbana, loteamentos e chácaras de recreio também são urbanos.", "Resumo PDF 9 + aula em áudio"], ["Sujeito passivo (art. 34): proprietário, titular do domínio útil ou possuidor. Para o STJ (Tema 122), promitente comprador e promitente vendedor podem ser contribuintes, e o Município escolhe. Locatário não é contribuinte, e contrato não vale contra o Fisco.", "Resumo PDF 9 + aula em áudio"], ["Base de cálculo: o valor venal do imóvel (art. 33), sem os bens móveis nele mantidos. A planta genérica de valores é fixada por lei.", "Resumo PDF 9 + aula em áudio"], ["Atualização monetária pelo índice oficial não é majoração e pode ser feita por decreto. Acima do índice exige lei (Súmula 160 do STJ).", "Resumo PDF 9 + aula em áudio"], ["Progressividade fiscal em razão do valor, e alíquotas por localização e uso, são permitidas desde a EC 29/2000 (art. 156, §1º). A Súmula 668 do STF veda a progressividade de lei anterior à emenda, salvo função social.", "Resumo PDF 9 + aula em áudio"], ["Progressividade no tempo (art. 182, §4º, II) é extrafiscal e exige plano diretor, lei específica e notificação: parcelamento ou edificação compulsórios, IPTU progressivo por 5 anos e desapropriação-sanção.", "Resumo PDF 9 + aula em áudio"], ["Anterioridade: a base de cálculo do IPTU escapa só da nonagesimal e respeita a anual. A alíquota respeita as duas.", "Resumo PDF 9 + aula em áudio"], ["Lançamento de ofício. O envio do carnê ao endereço do contribuinte o notifica (Súmula 397 do STJ). Prescrição de 5 anos, do dia seguinte ao vencimento. Parcelamento de ofício não interrompe a prescrição.", "Resumo PDF 9 + aula em áudio"], ["Imunidades (art. 150, VI): entes e autarquias, templos, partidos, sindicatos de trabalhadores, educação e assistência sem fins lucrativos. Abrangem impostos, não taxas como a de lixo. Súmula 724: imóvel de entidade imune alugado a terceiro permanece imune se a renda for aplicada nas finalidades essenciais. Isenção exige lei municipal.", "Resumo PDF 9 + aula em áudio"]]}, {"n": 9, "nome": "ISSQN", "sub": "", "a": [["ISSQN: imposto municipal e do DF sobre serviços de qualquer natureza não compreendidos no ICMS, definidos em lei complementar (CF, art. 156, III). A norma geral é a LC 116/2003 (com a LC 157/2016); em Curitiba, a LC 40/2001.", "Resumo PDF 10 + aula em áudio"], ["Fato gerador: prestar serviço da lista anexa da LC 116, ainda que não seja a atividade preponderante. A lista é taxativa, mas admite interpretação extensiva (Tema 296). Incide também sobre serviço vindo do exterior (importação).", "Resumo PDF 10 + aula em áudio"], ["Transporte interestadual e intermunicipal e comunicação são ICMS, e não ISS. SV 31: locação de bens móveis não sofre ISS.", "Resumo PDF 10 + aula em áudio"], ["Não incidência (art. 2º): exportação de serviços (resultado só no exterior), relação de emprego, trabalhadores avulsos e diretores e membros de conselhos. Serviço no Brasil com resultado aqui é tributado, ainda que o contratante esteja no exterior.", "Resumo PDF 10 + aula em áudio"], ["Alíquotas: máxima de 5% e mínima de 2%. É vedada isenção ou benefício que reduza a carga abaixo de 2%, com exceções expressas. Em Curitiba varia de 2% a 5%.", "Resumo PDF 10 + aula em áudio"], ["Local da incidência (art. 3º): em regra, o estabelecimento prestador, com exceções, como a construção civil (local da obra). A LC 157 levou o imposto ao domicílio do tomador em planos de saúde, cartões e leasing (questionado na ADI 5835).", "Resumo PDF 10 + aula em áudio"], ["Contribuinte é o prestador. A lei pode atribuir responsabilidade ao tomador ou intermediário (substituição). Em Curitiba, tomadores listados retêm e recolhem, em regra 5%, até o dia 20 do mês seguinte.", "Resumo PDF 10 + aula em áudio"], ["Base de cálculo: o preço do serviço. Na construção civil, excluem-se os materiais fornecidos pelo prestador e as subempreitadas já tributadas.", "Resumo PDF 10 + aula em áudio"], ["Industrialização por encomenda para a etapa seguinte do ciclo produtivo: o STF afastou o ISS (Tema 816). Multa moratória não pode exceder 20% (Tema 214).", "Resumo PDF 10 + aula em áudio"], ["Sociedades uniprofissionais de trabalho pessoal, sem caráter empresarial, pagam ISS fixo por profissional habilitado (DL 406/68). ISS incide em leasing (Súmula 138), em serviços bancários da lista (Súmula 424) e em concreto fornecido por empreitada (Súmula 167). O ISS será extinto em 2033, substituído pelo IBS.", "Resumo PDF 10 + aula em áudio"]]}]}, {"id": "PCV", "nome": "Direito Processual Civil", "c": "#1E88E5", "t": "#E3F2FD", "t2": "#BBDEFB", "d": "#0D47A1", "topicos": [{"n": 1, "nome": "Teoria geral e normas fundamentais", "sub": "", "a": [["Art. 1º: o processo civil é ordenado, disciplinado e interpretado conforme os valores e as normas fundamentais da Constituição.", "Resumo PDF 2"], ["Art. 2º: o processo começa por iniciativa da parte (demanda) e se desenvolve por impulso oficial, salvo exceções legais.", "Resumo PDF 2"], ["Art. 3º: não se exclui da apreciação jurisdicional ameaça ou lesão a direito. A arbitragem é permitida, e a solução consensual deve ser estimulada.", "Resumo PDF 2"], ["Justiça multiportas: o sistema aceita arbitragem, mediação e outros meios além do Judiciário (CPC, Res. CNJ 125/2010 e Lei 13.140/2015).", "Resumo PDF 2"], ["Boa-fé (art. 5º) e cooperação (art. 6º) obrigam todos os sujeitos do processo, o juiz inclusive, e geram sanções, como a litigância de má-fé.", "Resumo PDF 2"], ["Contraditório (arts. 9º e 10): não se decide contra uma parte sem ouvi-la, e é vedada a decisão surpresa, mesmo sobre matéria apreciável de ofício.", "Resumo PDF 2"], ["Dispensam a oitiva prévia: tutela de urgência, tutela da evidência dos incisos II e III do art. 311 e mandado monitório.", "Resumo PDF 2"], ["Poder instrutório do juiz (art. 370) não se sobrepõe ao contraditório. Prova pericial sem intimar as partes torna a sentença nula.", "Resumo PDF 2"], ["Art. 12: o juiz deve atender \"preferencialmente\" à ordem cronológica de conclusão. Embargos de declaração, sentenças em audiência e metas do CNJ ficam fora dela.", "Resumo PDF 2"], ["Art. 14: a norma processual não retroage e se aplica de imediato aos processos em curso, respeitados os atos praticados. Art. 15: o CPC é supletivo ao processo administrativo, trabalhista e eleitoral.", "Resumo PDF 2"]]}, {"n": 2, "nome": "Jurisdição, competência, ação", "sub": "", "a": [["Para postular exige-se interesse e legitimidade. Ninguém pleiteia direito alheio em nome próprio, salvo autorização do ordenamento (substituição processual, art. 18).", "Resumo PDF 3"], ["Pela teoria da asserção, legitimidade e interesse são aferidos pelas afirmações da inicial. Sua falta leva à extinção sem resolução de mérito (art. 485, VI), e não à improcedência.", "Resumo PDF 3"], ["O interesse pode se limitar à declaração de existência, inexistência ou modo de ser de relação jurídica, ou à autenticidade ou falsidade de documento, em ação autônoma (art. 19).", "Resumo PDF 3"], ["A convenção de arbitragem deve ser alegada na contestação e o juiz não a conhece de ofício. Se o réu não alega, aceita a jurisdição estatal (art. 337, X, §§5º e 6º).", "Resumo PDF 3"], ["A administração pública pode arbitrar direitos patrimoniais disponíveis. A sentença arbitral dispensa homologação e é título executivo judicial.", "Resumo PDF 3"], ["Jurisdição voluntária: começa por provocação do interessado, do MP ou da Defensoria. Não há reconvenção, e o juiz não está preso à legalidade estrita (arts. 720 e 723).", "Resumo PDF 3"], ["Perpetuatio jurisdictionis (art. 43): a competência fixa-se no registro ou na distribuição da inicial. Mudanças posteriores são irrelevantes, salvo supressão do órgão ou alteração de competência absoluta.", "Resumo PDF 3"], ["Competência absoluta (matéria, pessoa, função) é inderrogável e declarável de ofício, a qualquer tempo. Relativa (valor e território) admite foro de eleição e deve ser alegada na contestação. Súmula 33 do STJ veda declará-la de ofício.", "Resumo PDF 3"], ["Foros: regra geral, domicílio do réu. Imóvel, foro da situação (possessória imobiliária é absoluta). Alimentos, domicílio do alimentando. Contra a União, quatro foros possíveis (art. 51, parágrafo único).", "Resumo PDF 3"], ["Conexão: pedido ou causa de pedir comum, com reunião dos processos, salvo se um já foi sentenciado (Súmula 235 do STJ). Continência: mesmas partes e causa de pedir, com pedido mais amplo. Litispendência: partes, causa de pedir e pedido idênticos.", "Resumo PDF 3"]]}, {"n": 3, "nome": "Sujeitos, litisconsórcio, terceiros, DPJ", "sub": "", "a": [["Litisconsórcio necessário (arts. 114 e 115): a eficácia da sentença depende da citação de todos. O juiz manda o autor requerer a citação, sob pena de extinção, e não inclui de ofício.", "Resumo PDF 4"], ["Exemplo clássico: ação de despejo contra apenas um dos colocatários exige citar todos.", "Resumo PDF 4"], ["Alienação da coisa litigiosa (art. 109): não muda a legitimidade das partes. O adquirente só sucede com consentimento da parte contrária; sem ele, entra como assistente do alienante.", "Resumo PDF 4"], ["Chamamento ao processo (art. 130): do afiançado, dos demais fiadores e devedores solidários, quando o fiador é réu.", "Resumo PDF 4"], ["Denunciação da lide (art. 125) serve ao direito de regresso por lei ou contrato. Oposição (art. 682) é de quem pretende a coisa disputada.", "Resumo PDF 4"], ["Amicus curiae (art. 138): admitido de ofício ou a pedido, pessoa natural ou jurídica, em qualquer grau. Sua decisão é irrecorrível, cabendo embargos de declaração.", "Resumo PDF 4"], ["A intervenção de amicus curiae, mesmo de ente federal, não altera a competência.", "Resumo PDF 4"], ["IDPJ (arts. 133 a 137): cabe em qualquer fase, inclusive na execução. A instauração suspende o processo, salvo se pedida na inicial. O sócio tem 15 dias para se manifestar.", "Resumo PDF 4"], ["A decisão do IDPJ é interlocutória: cabe agravo de instrumento (agravo interno se for do relator). Acolhido, a alienação em fraude é ineficaz, a contar da citação do sócio.", "Resumo PDF 4"], ["Desconsideração: o CDC (art. 28, §5º) adota a teoria menor, bastando que a personalidade seja obstáculo ao ressarcimento. O CC (art. 50) adota a teoria maior, com desvio de finalidade ou confusão patrimonial.", "Resumo PDF 4"]]}, {"n": 4, "nome": "Fazenda Pública em juízo: prazos, remessa necessária", "sub": "", "a": [["Prazo em dobro (CPC, art. 183): União, Estados, DF, Municípios, autarquias e fundações públicas têm prazo em dobro para todas as manifestações, contado da intimação pessoal.", "Resumo PDF 5"], ["A dobra não se aplica quando a lei fixar prazo próprio para o ente. Por isso, embargos à execução fiscal (30 dias) não dobram. Ação rescisória e mandado de segurança, prazos decadenciais, também não.", "Resumo PDF 5"], ["Empresas públicas e sociedades de economia mista, em regra, não têm prazo em dobro nem remessa necessária. A ECT é exceção quanto às prerrogativas.", "Resumo PDF 5"], ["Contestação e recursos: 30 dias úteis para a Fazenda (15 em dobro). Embargos de declaração: 10 dias (5 em dobro).", "Resumo PDF 5"], ["Defensor Público (art. 186) e Ministério Público (art. 180) também têm prazo em dobro e intimação pessoal.", "Resumo PDF 5"], ["Remessa necessária (art. 496): a sentença contra a Fazenda Pública e a que julga procedentes, ainda que em parte, os embargos à execução fiscal só produzem efeito depois de confirmadas pelo tribunal.", "Resumo PDF 5"], ["Dispensa por valor (condenação certa e líquida): menos de 1.000 salários mínimos (União), 500 (Estados, DF e capitais) e 100 (demais Municípios).", "Resumo PDF 5"], ["Dispensa por precedente: súmula de tribunal superior, repetitivo do STF ou STJ, IRDR, IAC ou orientação vinculante administrativa do próprio ente.", "Resumo PDF 5"], ["Súmula 45 do STJ: na remessa necessária o tribunal não pode agravar a condenação da Fazenda. Súmula 423 do STF: sem a remessa a sentença não transita em julgado. Nos Juizados da Fazenda não há remessa.", "Resumo PDF 5"], ["Outras prerrogativas: dispensa de caução e preparo recursal, com custas ao final, mas a Fazenda antecipa honorários periciais se pediu a perícia (Súmula 232 do STJ). Honorários contra ela seguem as faixas do art. 85, §3º.", "Resumo PDF 5"]]}, {"n": 5, "nome": "Atos processuais e nulidades", "sub": "", "a": [["Liberdade de forma: os atos são válidos se atingem a finalidade (CPC, art. 188). Praticam-se em dias úteis, das 6h às 20h. A petição eletrônica pode ser enviada até as 24h do último dia do prazo.", "Resumo PDF 6 + aula em áudio"], ["Prazos contam-se em dias úteis, só para prazos processuais, excluindo o dia do começo e incluindo o do vencimento. Ficam suspensos de 20 de dezembro a 20 de janeiro.", "Resumo PDF 6 + aula em áudio"], ["Omissa a lei, o juiz fixa o prazo e, na falta, são 5 dias. Prazo do juiz é impróprio: não gera preclusão. Peremptório não se altera por convenção; dilatório, sim. Justa causa devolve o prazo.", "Resumo PDF 6 + aula em áudio"], ["Negócio processual (art. 190) e calendário processual (art. 191) permitem ajustar atos e prazos.", "Resumo PDF 6 + aula em áudio"], ["Citação válida induz litispendência, torna litigiosa a coisa e constitui em mora. O despacho que a ordena interrompe a prescrição, retroagindo à propositura.", "Resumo PDF 6 + aula em áudio"], ["A regra é a citação eletrônica, com confirmação em 3 dias úteis. As empresas mantêm cadastro. A omissão sem justa causa é ato atentatório à dignidade da justiça.", "Resumo PDF 6 + aula em áudio"], ["Hora certa: quando o réu se oculta. Edital: réu desconhecido, ignorado, em local incerto ou inacessível. Requerer edital sem fundamento gera multa de 5 salários mínimos ao autor.", "Resumo PDF 6 + aula em áudio"], ["Revel citado por edital ou hora certa tem curador especial, que pode contestar por negação geral. Na execução fiscal, o edital só cabe se frustradas as demais formas (Súmula 414 do STJ).", "Resumo PDF 6 + aula em áudio"], ["Comparecimento espontâneo supre a falta ou nulidade da citação. Citação nula com processo à revelia pode ser atacada na impugnação ao cumprimento de sentença ou por querela nullitatis.", "Resumo PDF 6 + aula em áudio"], ["Nulidades: instrumentalidade das formas, prejuízo (sem prejuízo, não há nulidade) e aproveitamento. Relativa deve ser alegada na primeira oportunidade e não por quem lhe deu causa. Absoluta é conhecível de ofício.", "Resumo PDF 6 + aula em áudio"]]}, {"n": 6, "nome": "Tutela provisória", "sub": "", "a": [["Tutela provisória é de urgência (cautelar ou antecipada, antecedente ou incidental) ou de evidência. Conserva eficácia no processo, mas pode ser revogada ou modificada a qualquer tempo.", "Resumo PDF 7 + aula em áudio"], ["Tutela de urgência (CPC, art. 300): probabilidade do direito e perigo de dano ou risco ao resultado útil. O juiz pode exigir caução, dispensável ao hipossuficiente.", "Resumo PDF 7 + aula em áudio"], ["A tutela antecipada não se concede se houver perigo de irreversibilidade dos efeitos (§3º). A jurisprudência mitiga a regra em casos extremos, como saúde.", "Resumo PDF 7 + aula em áudio"], ["Tutela de evidência (art. 311) independe de perigo de dano.", "Resumo PDF 7 + aula em áudio"], ["Hipóteses da evidência: abuso do direito de defesa; tese firmada em repetitivos ou súmula vinculante com prova documental; contrato de depósito; prova documental suficiente sem contraprova capaz de gerar dúvida razoável.", "Resumo PDF 7 + aula em áudio"], ["Na evidência, a liminar só cabe nos incisos II e III do art. 311.", "Resumo PDF 7 + aula em áudio"], ["Antecipada antecedente: o autor pede a tutela e anuncia o pedido final. Estabiliza-se se concedida e o réu não recorrer. A estabilização não faz coisa julgada, e a ação para rever pode ser proposta em 2 anos.", "Resumo PDF 7 + aula em áudio"], ["Cautelar antecedente: o autor indica a lide e o direito a acautelar. O pedido principal vem em 30 dias, nos mesmos autos, sem novas custas. A eficácia cessa se não formulado, se não efetivada em 30 dias ou se o pedido for improcedente.", "Resumo PDF 7 + aula em áudio"], ["Art. 302: o beneficiár
