<!doctype html>
<html lang="pt-BR"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Mini Conceitos</title><meta name="theme-color" content="#2f2119">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Lora:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--cream:#f4ecdc;--cream-2:#fff8f0;--sand:#eadcc3;--salmon:#d88f79;--salmon-2:#efb6a3;--brown:#8a5a2b;--brown-2:#5b3a22;--brown-3:#2f2119;--gold:#c28b2f;--ink:#352d24;--muted:#766b5d;--white:#fffdf9;--green:#3fa36b;--red:#b5482f;
--tema:#F9A825;--tema-t:#FFF8E1;--tema-t2:#FFECB3;--tema-d:#8A5200}
*{box-sizing:border-box;margin:0}
body{background:var(--cream);color:var(--ink);font:17px/1.55 Inter,system-ui,sans-serif;min-height:100vh}
body:before{content:"";display:block;height:10px;background:linear-gradient(90deg,var(--salmon) 0 25%,var(--gold) 0 50%,var(--brown) 0 75%,var(--brown-3) 0)}
h1,h2,h3{font-family:Lora,Georgia,serif;color:var(--brown-3);line-height:1.2}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:14px 16px;max-width:820px;margin:0 auto}
header h1{font-size:24px}header small{color:var(--muted);display:block;font-family:Inter;font-size:13px}
nav{display:flex;gap:8px;max-width:820px;margin:0 auto;padding:0 16px 12px}
nav button{flex:1;font:600 15px Inter;padding:10px 6px;background:var(--white);border:3px solid var(--brown-3);border-radius:12px;color:var(--brown-3);cursor:pointer;box-shadow:3px 3px 0 var(--brown-3)}
nav button.on{background:var(--brown-3);color:var(--cream)}
main{max-width:820px;margin:0 auto;padding:6px 16px 60px}
.card{background:var(--white);border:3px solid var(--brown-3);border-radius:16px;box-shadow:5px 5px 0 var(--brown-3);padding:18px;margin-bottom:18px}
.topic{display:block;width:100%;text-align:left;cursor:pointer;font:inherit;background:var(--tema-t);border-left-width:12px;border-left-color:var(--tema)}
.topic h3{font-size:20px}.topic p{color:var(--muted);font-size:14px;margin-top:4px}
.chip{display:inline-block;font:700 12px Inter;letter-spacing:.04em;text-transform:uppercase;padding:3px 10px;border:2px solid var(--brown-3);border-radius:99px;background:var(--tema);color:var(--brown-3);margin-bottom:8px}
.bar{height:10px;border:2px solid var(--brown-3);border-radius:9px;background:var(--white);margin-top:10px;overflow:hidden}.bar i{display:block;height:100%;background:var(--tema)}
.q{border-top:12px solid var(--tema)}
.src{font-size:13px;color:var(--muted);margin-bottom:8px}
.en{font-family:Lora,serif;font-size:19px;color:var(--brown-3);margin-bottom:10px}
.itens{background:var(--tema-t);border:2px dashed var(--tema-d);border-radius:10px;padding:10px 14px;margin:8px 0 12px;font-size:16px}.itens p+p{margin-top:6px}
.alt{display:flex;gap:12px;width:100%;text-align:left;font:inherit;background:var(--white);border:2.5px solid var(--brown-3);border-radius:12px;padding:11px 12px;margin:9px 0;cursor:pointer;box-shadow:3px 3px 0 var(--brown-3)}
.alt:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--brown-3)}
.alt b{flex:none;width:30px;height:30px;border-radius:50%;background:var(--tema-t2);border:2px solid var(--brown-3);display:grid;place-items:center;font-size:14px}
.alt.dis{cursor:default;box-shadow:none;opacity:.8}.alt.dis:active{transform:none}
.alt.ok{border-color:var(--green);background:#e7f5ec;opacity:1}.alt.bad{border-color:var(--red);background:#fbece7;opacity:1}
.fb{margin-top:16px;border-radius:14px;padding:14px;border:2.5px solid}
.fb.ok{background:#e7f5ec;border-color:var(--green)}.fb.bad{background:var(--cream-2);border-color:var(--brown-3)}
.fb .h{display:flex;align-items:center;gap:12px;font:700 18px Lora,serif}
.fb svg{flex:none}.fb .ex{margin-top:10px;font-size:16px}
.obs{margin-top:10px;font-size:14px;background:var(--sand);border-radius:10px;padding:8px 12px;color:var(--brown-2)}
.act{display:flex;gap:10px;margin-top:16px;flex-wrap:wrap}
.btn{font:700 16px Inter;padding:11px 18px;border:3px solid var(--brown-3);border-radius:12px;background:var(--tema);color:var(--brown-3);cursor:pointer;box-shadow:3px 3px 0 var(--brown-3)}
.btn.sec{background:var(--white)}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:18px}
.stat{text-align:center;background:var(--white);border:3px solid var(--brown-3);border-radius:14px;padding:12px 4px;box-shadow:3px 3px 0 var(--brown-3)}.stat b{display:block;font:700 28px Lora,serif}.stat span{font-size:13px;color:var(--muted)}
.list button{display:flex;align-items:center;gap:10px;width:100%;text-align:left;font:inherit;background:var(--white);border:2px solid var(--brown-3);border-radius:10px;padding:9px 12px;margin:7px 0;cursor:pointer}
.dot{width:14px;height:14px;border-radius:50%;border:2px solid var(--brown-3);flex:none;background:var(--sand)}.dot.c{background:var(--green)}.dot.e{background:var(--red)}
.muted{color:var(--muted);font-size:14px}
.ed{display:inline-block;font:600 12px Inter;background:var(--brown-3);color:var(--cream);border-radius:8px;padding:2px 8px;margin:6px 0 0}
.zr{font:600 13px Inter;background:none;border:2px solid var(--red);color:var(--red);border-radius:10px;padding:5px 12px;cursor:pointer;margin:-8px 0 18px}
.fe{margin:0 0 12px;font-size:14px;background:#fbece7;border:2px dashed var(--red);border-radius:10px;padding:8px 12px;color:var(--brown-2)}

.back{font:600 14px Inter;background:none;border:2px solid var(--brown-3);border-radius:10px;padding:5px 12px;color:var(--brown-3);cursor:pointer;margin:0 0 14px}
.rd{border-top:12px solid var(--tema);min-height:230px;display:flex;flex-direction:column;justify-content:space-between}
.rd p{font:500 21px/1.6 Lora,Georgia,serif;color:var(--brown-3)}
.rd p.long{font-size:18px}
.rd .fonte{margin-top:18px;font-size:12px;color:var(--muted);opacity:.75;letter-spacing:.02em}
.tname{font:600 17px Lora,Georgia,serif;color:var(--brown);margin:12px 0 4px;line-height:1.3}
.cnt{font:600 13px Inter;color:var(--muted);margin:0 0 8px}
.nav2{display:flex;gap:12px}.nav2 .btn{flex:1}.btn[disabled]{opacity:.35;cursor:default;box-shadow:none}
.vazio{font-size:15px;color:var(--muted);padding:6px 0}
</style></head><body>
<header><div><h1>Mini Conceitos</h1><small>Revisão rápida · 10 assertivas curtas por tópico</small></div></header>
<main id="app"></main>
<script>
const D=[{"id":"ADM","nome":"Direito Administrativo","c":"#F9A825","t":"#FFF8E1","t2":"#FFECB3","d":"#8A5200","topicos":[{"n":1,"nome":"Regime jurídico e princípios","sub":"","a":[["Legalidade é juridicidade: a Administração se vincula à lei, à Constituição e ao Direito como um todo, e não só à lei em sentido estrito.","Resumo PDF 4"],["O edital é a lei do concurso, mas não se sobrepõe à lei. Se a contraria, a Administração deve corrigi-lo em autotutela, mesmo após as provas. Não há direito adquirido a edital ilegal.","Resumo PDF 4"],["Motivação (Lei 9.784, art. 50): obrigatória nos atos que neguem, limitem ou afetem direitos ou imponham deveres e sanções. Deve ser explícita, clara e congruente.","Resumo PDF 4"],["Motivação aliunde é válida: o ato pode se fundar em pareceres ou decisões anteriores, que passam a integrá-lo. Em casos repetitivos admite-se meio mecânico.","Resumo PDF 4"],["Proporcionalidade: adequação, necessidade e proporcionalidade em sentido estrito. Há ponderação caso a caso, e a supremacia do interesse público não vence automaticamente.","Resumo PDF 4"],["Teoria do órgão: o ato é imputado ao órgão ou entidade, e não ao agente. Por isso a vítima processa o Estado.","Resumo PDF 4"],["Dupla garantia (STF, Tema 940): o agente não é parte passiva legítima na ação da vítima, e o Estado tem regresso contra ele em caso de dolo ou culpa.","Resumo PDF 4"],["Publicidade oficial não pode ter nomes, símbolos ou imagens de promoção pessoal (CF, art. 37, §1º). Nepotismo é vedado sem necessidade de lei formal (SV 13).","Resumo PDF 4"],["Lei 13.140, art. 32: as câmaras de prevenção e resolução administrativa de conflitos dirimem conflitos entre órgãos da Administração. A submissão é facultativa e o acordo é título executivo extrajudicial.","Resumo PDF 4"],["Autotutela (Súmulas 346 e 473 do STF): anula-se o ato ilegal e revoga-se o inconveniente, respeitados direitos adquiridos. Só ato discricionário é revogável. Anular ato favorável decai em 5 anos, salvo má-fé (Lei 9.784, art. 54).","Resumo PDF 4"]]},{"n":2,"nome":"LINDB/Lei 13.655","sub":"","a":[["Art. 20 da LINDB: não se decide com base em valores jurídicos abstratos sem considerar as consequências práticas. A motivação deve mostrar a necessidade e a adequação da medida. Princípios não são proibidos.","Resumo PDF 5"],["Art. 21: a decisão que invalida ato, contrato ou norma deve indicar expressamente as consequências jurídicas e administrativas e as condições de regularização proporcional e equânime.","Resumo PDF 5"],["Art. 22: a interpretação de normas de gestão considera os obstáculos e as dificuldades reais do gestor, sem prejuízo dos direitos dos administrados.","Resumo PDF 5"],["Art. 22, §§2º e 3º: na sanção pesam a natureza e a gravidade da infração, os danos, agravantes, atenuantes e antecedentes. Sanções já aplicadas pelo mesmo fato entram na dosimetria.","Resumo PDF 5"],["Art. 23: a decisão que fixa interpretação nova sobre norma de conteúdo indeterminado, impondo novo dever ou condicionamento de direito, deverá prever regime de transição quando indispensável.","Resumo PDF 5"],["Art. 24: a revisão da validade de ato já produzido considera as orientações gerais da época. Mudança posterior de orientação não invalida situações plenamente constituídas.","Resumo PDF 5"],["Orientações gerais (art. 24): atos públicos de caráter geral, jurisprudência majoritária e prática administrativa reiterada e amplamente aceita.","Resumo PDF 5"],["Art. 26: o compromisso para eliminar irregularidade ou incerteza exige oitiva do órgão jurídico e só produz efeitos após publicação oficial. Não pode desonerar permanentemente de dever e deve prever sanção por descumprimento.","Resumo PDF 5"],["Art. 27: a decisão pode impor compensação por benefícios indevidos ou prejuízos anormais ou injustos, ouvidas as partes.","Resumo PDF 5"],["Arts. 28 a 30: o agente responde só por dolo ou erro grosseiro. A consulta pública sobre atos normativos é facultativa (\"poderá\"). Regulamentos, súmulas administrativas e respostas a consultas vinculam o órgão. A ação declaratória de validade (art. 25) foi vetada.","Resumo PDF 5"]]},{"n":3,"nome":"Administração direta e indireta, entidades, agências","sub":"","a":[["Desconcentração: distribuição de competências dentro da mesma pessoa jurídica, entre órgãos, com hierarquia. Descentralização: transferência a outra pessoa.","Resumo PDF 6 + aula em áudio"],["Guarde: outorga é por lei e transfere titularidade e execução (criação de autarquia). Delegação é por contrato ou ato e transfere só a execução (concessão).","Resumo PDF 6 + aula em áudio"],["Entre a Administração direta e a indireta há vinculação (tutela, controle finalístico), prevista em lei. Não há hierarquia: o Ministério não é superior hierárquico da autarquia.","Resumo PDF 6 + aula em áudio"],["Autarquia: pessoa de direito público, criada por lei específica, com patrimônio e receitas próprios. Seus bens são públicos. Tem prazo em dobro, remessa necessária, precatórios e imunidade recíproca.","Resumo PDF 6 + aula em áudio"],["Autarquia federal litiga na Justiça Federal (CF, art. 109, I). Sua responsabilidade é objetiva (art. 37, §6º) e seu regime de pessoal, estatutário.","Resumo PDF 6 + aula em áudio"],["Fundação pública de direito público é autarquia fundacional, criada por lei. A de direito privado exige lei autorizadora e registro do estatuto. As áreas de atuação são definidas por lei complementar, e MP não trata disso.","Resumo PDF 6 + aula em áudio"],["Empresa pública (capital 100% público, qualquer forma societária) e sociedade de economia mista (S.A., maioria votante pública) são pessoas de direito privado, autorizadas por lei, com personalidade nascida do registro. Regidas pela Lei 13.303/2016.","Resumo PDF 6 + aula em áudio"],["Estatais: pessoal celetista, com concurso, sem estabilidade, mas com motivação na dispensa. Não se sujeitam à falência. Teto remuneratório só se receberem recursos para custeio.","Resumo PDF 6 + aula em áudio"],["Exploradora de atividade econômica segue o regime de empresa privada (art. 173). Prestadora de serviço público em regime não concorrencial pode ter precatório e impenhorabilidade dos bens afetados (ECT). Subsidiárias exigem autorização legislativa, que pode ser genérica.","Resumo PDF 6 + aula em áudio"],["Agências reguladoras (Lei 13.848): autarquias em regime especial, sem subordinação hierárquica, com dirigentes de mandato fixo nomeados após aprovação do Senado. Perdem o cargo só por renúncia, condenação transitada ou PAD. AIR é a regra; consulta pública não é obrigatória para todo ato. Agência executiva é qualificação por decreto, com contrato de gestão.","Resumo PDF 6 + aula em áudio"]]},{"n":4,"nome":"Consórcios públicos e convênios","sub":"","a":[["Consórcio público é a união de entes federativos para a gestão associada de serviços públicos (CF, art. 241; Lei 11.107). Tem personalidade jurídica própria.","Resumo PDF 7 + aula em áudio"],["A personalidade pode ser de direito público (associação pública, que integra a Administração indireta de todos os entes) ou de direito privado, sem fins econômicos.","Resumo PDF 7 + aula em áudio"],["A União só participa se também participarem todos os Estados em cujo território estejam os Municípios consorciados.","Resumo PDF 7 + aula em áudio"],["Formação: protocolo de intenções, publicado na imprensa oficial, ratificado por lei de cada ente, que se converte em contrato de consórcio. Dispensa-se a ratificação do ente que já disciplinou por lei sua participação.","Resumo PDF 7 + aula em áudio"],["Contrato de rateio é o único meio de os entes entregarem recursos ao consórcio. Formaliza-se a cada exercício, exige prévia e suficiente dotação orçamentária e veda despesas genéricas.","Resumo PDF 7 + aula em áudio"],["Ente que não consigna a dotação no rateio pode ser excluído, após prévia suspensão. Despesa fora do contrato de rateio pode configurar improbidade.","Resumo PDF 7 + aula em áudio"],["Contrato de programa regula as obrigações na gestão associada de serviços, como saneamento, e subsiste mesmo se o consórcio for extinto.","Resumo PDF 7 + aula em áudio"],["Pessoal do consórcio é regido pela CLT, com observância das normas de direito público sobre licitação, contratos, prestação de contas e admissão.","Resumo PDF 7 + aula em áudio"],["O consórcio responde por seus atos e se sujeita ao controle externo do Tribunal de Contas. Os recursos repassados continuam públicos.","Resumo PDF 7 + aula em áudio"],["Convênio é ajuste de cooperação para objetivos comuns, com interesses convergentes. Não há preço, em regra não cria pessoa jurídica e exige prestação de contas. A Lei 14.133 se aplica no que couber (art. 184).","Resumo PDF 7 + aula em áudio"]]},{"n":5,"nome":"Terceiro setor e Lei 13.019","sub":"","a":[["Terceiro setor: entidades privadas, sem fins lucrativos, de interesse público, ao lado do Estado e do mercado. Compõem-no Sistema S, OS, OSCIP e as OSC do MROSC. Recebem recursos públicos, mas se sujeitam a transparência e prestação de contas.","Resumo PDF 8 + aula em áudio"],["OS (Lei 9.637): qualificação dada pelo Poder Executivo, por ato discricionário. O instrumento é o contrato de gestão. O STF (ADI 1923) a admite, exigindo procedimento público, objetivo e impessoal.","Resumo PDF 8 + aula em áudio"],["OSCIP (Lei 9.790): qualificação dada pelo Ministério da Justiça, por ato vinculado. O instrumento é o termo de parceria. Sociedades comerciais e organizações partidárias não podem ser qualificadas.","Resumo PDF 8 + aula em áudio"],["Perda da qualificação de OSCIP: qualquer cidadão pode pedir, em via administrativa ou judicial. Quem sabe de irregularidade e não comunica responde solidariamente.","Resumo PDF 8 + aula em áudio"],["O título de OS ou OSCIP não é condição para receber recursos públicos ou celebrar parceria.","Resumo PDF 8 + aula em áudio"],["MROSC (Lei 13.019): regime das parcerias entre a Administração e as OSC. Substitui o convênio nas parcerias com entidades privadas sem fins lucrativos, ressalvada, por exemplo, a participação complementar no SUS.","Resumo PDF 8 + aula em áudio"],["Três instrumentos: termo de colaboração (proposta da Administração, com repasse), termo de fomento (proposta da OSC, com repasse) e acordo de cooperação (sem repasse).","Resumo PDF 8 + aula em áudio"],["A regra é o chamamento público. Dispensa (art. 30): urgência (até 180 dias), guerra e calamidade. Inexigibilidade (art. 31): inviabilidade de competição. O PMIS é só um canal de proposta e não condiciona o chamamento.","Resumo PDF 8 + aula em áudio"],["Requisitos da OSC: estatuto de relevância pública, destinação do patrimônio a entidade congênere, escrituração contábil e tempo mínimo com CNPJ ativo: 1 ano (Municípios), 2 (Estados) e 3 (União).","Resumo PDF 8 + aula em áudio"],["Execução: plano de trabalho e divulgação na internet e na sede (a sede não dispensa a internet). Pagam-se despesas com equipe e custos indiretos, mas não servidor da Administração. Sanções: advertência, suspensão (até 2 anos) e declaração de inidoneidade.","Resumo PDF 8 + aula em áudio"]]},{"n":6,"nome":"Normas municipais de organização, Leis 7.671/91, 9.226/97, Dec. 1.192/17","sub":"","a":[["Lei 7.671/1991 reorganiza o Executivo de Curitiba em administração direta e indireta. A direta tem órgãos colegiados, de assessoramento, secretarias meio (Administração, Recursos Humanos, Finanças) e secretarias fim.","Resumo PDF 9 + aula em áudio"],["O Prefeito pode criar por decreto até duas secretarias extraordinárias, para programas de duração transitória (art. 3º). O Gabinete do Vice-Prefeito integra a estrutura básica.","Resumo PDF 9 + aula em áudio"],["Administração indireta na redação original: autarquias (IPPUC, IMAP e IPMC), fundações públicas (Fundação Cultural de Curitiba e FREI) e sociedades de economia mista (COHAB-CT, URBS e CIC).","Resumo PDF 9 + aula em áudio"],["A Lei 7.671 menciona empresas públicas como tipo possível, mas não relaciona nenhuma. As estatais adequam seus estatutos às novas competências (art. 36).","Resumo PDF 9 + aula em áudio"],["A Lei 9.226/1997 criou o Programa Municipal de Publicização. O Decreto 1.192/2017 o regulamenta, com base na decisão do STF na ADI 1923 sobre Organizações Sociais.","Resumo PDF 9 + aula em áudio"],["Podem ser OS pessoas jurídicas de direito privado sem fins lucrativos, em forma de fundação ou associação, nas áreas social, educacional, ambiental, científica, cultural, esportiva e de saúde. Exigem pareceres do órgão promotor e da Comissão Municipal de Publicização.","Resumo PDF 9 + aula em áudio"],["Qualificação de OS: por chamamento público, conduzido por Comissão de Qualificação, com edital de no mínimo 30 dias, e formalizada por decreto do Prefeito. A desqualificação cabe a qualquer tempo, com ampla defesa.","Resumo PDF 9 + aula em áudio"],["Contrato de gestão: cláusulas obrigatórias (objeto, metas com indicadores, recursos, prazo, sanções, bens e servidores cedidos). A minuta passa pela Procuradoria Geral do Município e pela Comissão, e o extrato é publicado no Diário Oficial e no Portal da Transparência.","Resumo PDF 9 + aula em áudio"],["Com mais de uma OS qualificada: chamamento público seletivo, com recurso em 5 dias úteis. Com uma só OS: Comunicado de Interesse Público, com manifestação em até 15 dias.","Resumo PDF 9 + aula em áudio"],["Controle: Conselho da OS, supervisão da administração signatária e fiscalização do Tribunal de Contas do Estado. Relatório anual da Comissão de Avaliação em até 90 dias. Intervenção só com risco comprovado, por até 180 dias. Servidor cedido tem ônus para a origem, e a remuneração paga pela OS não se incorpora ao cargo.","Resumo PDF 9 + aula em áudio"]]},{"n":7,"nome":"Advocacia pública e responsabilidade do parecerista","sub":"","a":[["Regra geral (LINDB, art. 28): o agente público só responde pessoalmente por decisões ou opiniões técnicas em caso de dolo ou erro grosseiro. Culpa leve não basta.","Resumo PDF 3"],["A responsabilidade do agente é subjetiva, nunca objetiva. Vale para o gestor e para o parecerista.","Resumo PDF 3"],["Parecer, em regra, é ato opinativo (STF, MS 24.073 e MS 24.631). O facultativo não vincula a autoridade.","Resumo PDF 3"],["Parecer obrigatório não vinculante: o administrador pode divergir, desde que motive.","Resumo PDF 3"],["Parecer vinculante (a lei manda decidir nos termos dele) deixa de ser só opinativo. Admite-se responsabilidade solidária do parecerista.","Resumo PDF 3"],["Nos demais casos, o parecerista só responde por erro grave inescusável, culpa grave ou má-fé.","Resumo PDF 3"],["Gestor que segue parecer fundamentado presume-se de boa-fé e afasta o erro grosseiro. Isso não protege dolo, conluio nem parecer manifestamente ilegal.","Resumo PDF 3"],["Lei 14.133, art. 53: a assessoria jurídica faz controle prévio de legalidade ao fim da fase preparatória, com linguagem simples, clara e objetiva. A análise pode ser dispensada em casos definidos (baixo valor, baixa complexidade, minutas padronizadas).","Resumo PDF 3"],["Lei 14.133, art. 10: a defesa do agente por ato praticado com estrita observância de parecer é feita pela advocacia pública, a critério do agente, nas esferas administrativa, controladora e judicial, mesmo após deixar o cargo. Cai se houver prova de ilícito doloso.","Resumo PDF 3"],["Improbidade (Lei 14.230/21) só admite dolo. Parecer equivocado, por si só, não é improbidade, e divergência interpretativa baseada em jurisprudência, ainda que não pacificada, também não (art. 1º, §8º). A inviolabilidade do advogado vale nos limites da lei.","Resumo PDF 3"]]},{"n":8,"nome":"Atos administrativos","sub":"","a":[["Ato administrativo é declaração da Administração que produz efeitos jurídicos imediatos, sob regime de direito público e controle judicial. Fato administrativo é atuação material, sem declaração de vontade.","Resumo PDF 10 + aula em áudio"],["Elementos: competência, finalidade, forma, motivo e objeto. Competência, finalidade e forma são sempre vinculadas. O mérito administrativo (conveniência e oportunidade) está no motivo e no objeto do ato discricionário.","Resumo PDF 10 + aula em áudio"],["Atributos: presunção de legitimidade e veracidade (relativa), imperatividade, exigibilidade e autoexecutoriedade. Esta só existe com previsão legal ou urgência. Nem todo ato tem todos os atributos: o enunciativo não tem imperatividade.","Resumo PDF 10 + aula em áudio"],["Motivação (Lei 9.784, art. 50): exigida nos atos que neguem, limitem ou afetem direitos, e pode ser per relationem. Pela teoria dos motivos determinantes, o motivo declarado vincula a validade do ato, mesmo se a motivação fosse dispensada.","Resumo PDF 10 + aula em áudio"],["Abuso de poder: excesso de poder (extrapola a competência) ou desvio de finalidade. A Lei 4.717 (art. 2º) lista cinco vícios: incompetência, forma, objeto, inexistência de motivos e desvio de finalidade.","Resumo PDF 10 + aula em áudio"],["Anulação: por ilegalidade, pela Administração ou pelo Judiciário, com efeitos ex tunc. Revogação: por conveniência e oportunidade, só pela Administração, com efeitos ex nunc e respeito a direitos adquiridos.","Resumo PDF 10 + aula em áudio"],["Cassação: o beneficiário descumpre condição. Caducidade: nova norma torna o ato incompatível. Contraposição: novo ato de competência diversa com efeito oposto.","Resumo PDF 10 + aula em áudio"],["Convalidação (Lei 9.784, art. 55): vícios sanáveis, sem lesão ao interesse público nem prejuízo a terceiros. Em regra, competência (não exclusiva) e forma (não essencial). Motivo, objeto e finalidade não se convalidam.","Resumo PDF 10 + aula em áudio"],["Ato simples (um órgão), composto (uma vontade e um ato de verificação, como o visto) e complexo (duas vontades de órgãos diferentes que se fundem). Licença é vinculada e definitiva; autorização é discricionária e precária.","Resumo PDF 10 + aula em áudio"],["Controle judicial: legalidade, razoabilidade e proporcionalidade, e não o mérito. Tema 138: ato que repercute em interesses individuais exige contraditório e ampla defesa. Em concurso, o Judiciário não substitui a banca na correção, salvo ilegalidade (Tema 485).","Resumo PDF 10 + aula em áudio"]]},{"n":28,"nome":"Improbidade: Acordo de Não Persecução Cível (ANPC)","sub":"","a":[["O ANPC (Lei 8.429/92, art. 17-B) é a solução consensual da improbidade: o investigado assume obrigações e a ação não segue ou é encerrada.","Resumo PDF 2"],["O MP \"poderá\" celebrar o acordo, por conveniência e oportunidade. Não é direito subjetivo, e o juiz não pode suprir a recusa do MP.","Resumo PDF 2"],["Resultados mínimos: integral ressarcimento do dano e reversão da vantagem indevida à pessoa jurídica lesada. O ressarcimento não pode ser parcial.","Resumo PDF 2"],["Requisitos cumulativos (§1º): oitiva do ente lesado, aprovação do órgão do MP em até 60 dias e homologação judicial.","Resumo PDF 2"],["Ouvir o ente lesado não é exigir sua aquiescência: a concordância dele não é requisito de validade nem de eficácia (Res. CNMP 306, art. 9º).","Resumo PDF 2"],["ADIs 7042 e 7043 (STF): a legitimidade do MP e a do ente lesado para a ação e para o ANPC são concorrentes e disjuntivas, e não subsidiárias.","Resumo PDF 2"],["O ANPC pode ser feito na investigação, no curso da ação ou na execução da sentença, inclusive após o trânsito em julgado.","Resumo PDF 2"],["Descumprimento: impedimento de novo acordo por 5 anos, contados do conhecimento pelo MP. A decisão homologatória é título executivo judicial.","Resumo PDF 2"],["O ANPP (penal) não vincula o promotor do patrimônio público nem impede a ação de improbidade: as esferas penal e civil são independentes.","Resumo PDF 2"],["Prescrição (art. 23): 8 anos do fato e 4 anos intercorrente. O inquérito civil suspende por no máximo 180 dias. Ressarcimento por ato doloso é imprescritível (Tema 897).","Resumo PDF 2"]]},{"n":9,"nome":"Processo administrativo: Lei 16.466/2024, Decreto 435/2026 e prescrição","sub":"","a":[["Lei 16.466/2024 (processo administrativo de Curitiba): nos casos omissos aplicam-se o CPC e a Lei 9.784. O meio eletrônico é obrigatório, e não facultativo.","Resumo PDF 11"],["Prazos do processo, em regra, em dias úteis: 5 para os atos (prorrogáveis por igual período), 3 de antecedência para a intimação, 15 para o recurso.","Resumo PDF 11"],["Decisão após a instrução: 30 dias, prorrogáveis de forma motivada, com teto de 6 meses. A prorrogação não é livre.","Resumo PDF 11"],["Recurso único, em 15 dias da publicação, em regra sem efeito suspensivo. As decisões do Prefeito e das autoridades máximas encerram a instância administrativa.","Resumo PDF 11"],["Reconsideração: 15 dias para pedir e 15 para julgar. Os prazos ficam suspensos de 20 de dezembro a 20 de janeiro.","Resumo PDF 11"],["Intimação sem confirmação de leitura se efetiva em 10 dias corridos, a única contagem em dias corridos. Por edital, em 3 dias úteis da publicação.","Resumo PDF 11"],["Intimação defeituosa é nula, mas o comparecimento do interessado sana o vício. Provas ilícitas são inadmissíveis.","Resumo PDF 11"],["Decadência para anular atos favoráveis: 5 anos, salvo má-fé ou ofensa direta à Constituição. Nos efeitos patrimoniais contínuos conta-se do primeiro pagamento.","Resumo PDF 11"],["Processo sancionador: defesa em 10 dias úteis, e infrações e sanções dependem de lei. A prescrição intercorrente de 3 anos é da Lei 9.873 (federal), não da lei de Curitiba.","Resumo PDF 11"],["Súmula 633 do STJ: a Lei 9.784 se aplica subsidiariamente a Estados e Municípios, para a decadência, se não houver norma local e específica.","Resumo PDF 11"]]},{"n":10,"nome":"Direito administrativo sancionador","sub":"","a":[["Súmula Vinculante 5: a falta de defesa técnica por advogado no processo administrativo disciplinar não ofende a Constituição. A Súmula 343 do STJ está superada.","Resumo PDF 12"],["Contraditório e ampla defesa são obrigatórios no processo disciplinar. A Súmula Vinculante 21 proíbe exigir depósito ou arrolamento prévio para recorrer na via administrativa.","Resumo PDF 12"],["Súmula 18 do STF: pela falta residual, não compreendida na absolvição pelo juízo criminal, é admissível a punição administrativa do servidor.","Resumo PDF 12"],["Inimputabilidade reconhecida no juízo criminal por doença mental impede a demissão do servidor. A Administração deve avaliar licença para tratamento ou aposentadoria por invalidez.","Resumo PDF 12"],["Súmulas do STJ: 650 (demissão vinculada nas hipóteses do art. 132 da Lei 8.112), 651 (demissão por improbidade sem condenação judicial prévia) e 592 (excesso de prazo só gera nulidade com prejuízo).","Resumo PDF 12"],["Controle judicial do processo disciplinar (Súmula 665 do STJ): limita-se à regularidade do procedimento e à legalidade do ato, sem reexame do mérito.","Resumo PDF 12"],["Lei 14.133, art. 156: advertência, multa, impedimento de licitar e contratar (até 3 anos) e declaração de inidoneidade (3 a 6 anos). Defesa prévia em 15 dias úteis.","Resumo PDF 12"],["Multa da Lei 14.133: de 0,1% a 20% do faturamento bruto do último exercício, nunca inferior à vantagem auferida. Sem faturamento, de R$ 6 mil a R$ 60 milhões (Lei Anticorrupção).","Resumo PDF 12"],["Lei Anticorrupção e Lei de Improbidade podem ser aplicadas em conjunto, sem bis in idem, desde que não haja sanções idênticas. A improbidade exige dolo, e a sanção é judicial.","Resumo PDF 12"],["Prescrição: a Lei 9.873/1999 vale só para a esfera federal. Estados e Municípios sem lei própria usam, por analogia, o Decreto 20.910 (5 anos), sem a intercorrente da lei federal.","Resumo PDF 12"]]},{"n":11,"nome":"TAC e autocomposição na Administração municipal de Curitiba","sub":"","a":[["Art. 26 da LINDB: a autoridade pode celebrar compromisso com os interessados para eliminar irregularidade, incerteza jurídica ou situação contenciosa. Exige oitiva do órgão jurídico e produz efeitos após a publicação oficial.","Resumo PDF 13"],["O compromisso do art. 26 não pode desonerar permanentemente de dever nem condicionar direito reconhecido por orientação geral.","Resumo PDF 13"],["LC 141/2023 de Curitiba: trata dos meios alternativos de solução de litígios, judiciais e extrajudiciais, e autoriza câmaras de prevenção e resolução administrativa de conflitos na Procuradoria-Geral.","Resumo PDF 13"],["A LC 141/2023 autoriza súmulas administrativas e pareceres referenciais, que vinculam a Administração.","Resumo PDF 13"],["Transação com devedor: o valor é consolidado com IPCA, multa e juros, e cada parcela é atualizada pelo IPCA com juros de 1% ao mês.","Resumo PDF 13"],["A falta de pagamento de qualquer parcela por mais de 60 dias revoga o parcelamento automaticamente, sem notificação.","Resumo PDF 13"],["O termo de transação traz confissão irrevogável e irretratável do débito, interrompe a prescrição, suspende a exigibilidade e importa renúncia a discutir o débito. Não gera novação.","Resumo PDF 13"],["O desconto especial chega a 100% de juros e multa moratória, para créditos em atraso há mais de 7 anos ou de devedor em recuperação judicial ou falência. Nunca há desconto sobre o principal.","Resumo PDF 13"],["Quando o Município é devedor, há chamamento público ou convite para acordo com deságio mínimo de 20% (piso, e não teto), com pagamento por RPV ou precatório.","Resumo PDF 13"],["Na Justiça do Trabalho, sendo o Município responsável subsidiário (Súmula 331 do TST), só há acordo se o devedor principal for insolvente.","Resumo PDF 13"]]},{"n":12,"nome":"Licitações: princípios, modalidades e critérios de julgamento (Lei 14.133)","sub":"","a":[["Lei 14.133, art. 5º: 21 princípios, entre eles planejamento, transparência, segregação de funções, vinculação ao edital, julgamento objetivo, segurança jurídica e desenvolvimento nacional sustentável. Aplica-se também a LINDB.","Resumo PDF 14"],["Ordem das fases (art. 17): o julgamento vem antes da habilitação, ao contrário da Lei 8.666. A inversão é possível se motivada e prevista no edital.","Resumo PDF 14"],["Modalidades (art. 28): pregão, concorrência, concurso, leilão e diálogo competitivo. Credenciamento, pré-qualificação, PMI e registro de preços são procedimentos auxiliares.","Resumo PDF 14"],["O pregão é obrigatório para bens e serviços comuns, com critério de menor preço ou maior desconto. O critério do leilão é o maior lance.","Resumo PDF 14"],["Diálogo competitivo: cabe para inovação ou quando a Administração não consegue definir sozinha a solução. As propostas finais têm no mínimo 60 dias úteis depois do diálogo.","Resumo PDF 14"],["A comissão de contratação tem no mínimo três servidores efetivos ou empregados públicos, e não comissionados.","Resumo PDF 14"],["Critérios de julgamento (art. 33): menor preço, maior desconto, melhor técnica ou conteúdo artístico, técnica e preço, maior lance e maior retorno econômico (só para contrato de eficiência).","Resumo PDF 14"],["Na técnica e preço, a ponderação da técnica pode chegar a 70%. Serviços intelectuais acima de R$ 300 mil seguem melhor técnica ou técnica e preço.","Resumo PDF 14"],["Em obras e serviços de engenharia, proposta abaixo de 75% do valor orçado é inexequível. Modo de disputa fechado isolado é vedado no menor preço e maior desconto.","Resumo PDF 14"],["A habilitação é exigida só do licitante vencedor. É vedado exigir faturamento mínimo, e o capital ou patrimônio líquido mínimo vai até 10% do valor estimado.","Resumo PDF 14"]]},{"n":13,"nome":"Contratação direta e procedimentos auxiliares (Lei 14.133)","sub":"","a":[["A regra é licitar (art. 37, XXI, da CF). Contratação direta tem três figuras: inexigibilidade (art. 74, competição inviável), dispensa (art. 75, competição possível) e licitação dispensada (art. 76, alienação de bens).","Resumo PDF 15"],["O rol de inexigibilidade do art. 74 é exemplificativo (a lei diz em especial). O rol de dispensa do art. 75 é taxativo.","Resumo PDF 15"],["Inexigibilidade para serviço técnico especializado exige notória especialização, e a Lei 14.133 não exige mais a natureza singular. É vedada para serviços de publicidade e divulgação.","Resumo PDF 15"],["Contratação direta indevida, com dolo, fraude ou erro grosseiro: o contratado e o agente público respondem solidariamente pelo dano (art. 73). Erro simples não basta.","Resumo PDF 15"],["Processo de contratação direta (art. 72): demanda, ETP, análise de riscos, termo de referência, estimativa de despesa, parecer jurídico, razão da escolha do contratado e justificativa de preço.","Resumo PDF 15"],["Dispensa por valor: obras, serviços de engenharia e manutenção de veículos até R$ 130.984,20, e demais compras e serviços até R$ 65.492,11. Cálculo por exercício, unidade gestora e ramo de atividade, vedado o fracionamento.","Resumo PDF 15"],["Emergência ou calamidade: contrato de até um ano, vedadas a prorrogação e a recontratação da mesma empresa.","Resumo PDF 15"],["Licitação dispensada (art. 76): a alienação exige interesse público justificado e avaliação prévia. Imóveis exigem autorização legislativa e, em regra, leilão.","Resumo PDF 15"],["Procedimentos auxiliares (art. 78): credenciamento, pré-qualificação, PMI, sistema de registro de preços e registro cadastral. Não são modalidades de licitação.","Resumo PDF 15"],["Registro de preços (arts. 82 a 86): registrar preço não é contratar. A adesão (carona) é limitada a 50% por órgão aderente e ao dobro no total.","Resumo PDF 15"]]},{"n":15,"nome":"Contratos administrativos: Lei 14.133/2021","sub":"","a":[["Art. 89: contratos regem-se por suas cláusulas e pelo direito público, com aplicação supletiva do direito privado. Desequilíbrio jurídico a favor da Administração, compensado pelo equilíbrio econômico-financeiro.","Resumo PDF 16"],["O instrumento escrito é obrigatório. O contrato verbal é nulo, salvo pequena compra de pronto pagamento (até R$ 10 mil). A divulgação no PNCP é condição de eficácia.","Resumo PDF 16"],["Garantia (arts. 96 a 100): o contratado escolhe entre caução, seguro-garantia e fiança bancária. Limite de 5% do valor do contrato, até 10% em obras de alta complexidade.","Resumo PDF 16"],["Prerrogativas (art. 104): modificar e extinguir unilateralmente, fiscalizar, aplicar sanções e ocupar provisoriamente bens e serviços. Cláusulas econômico-financeiras não se alteram sem concordância do contratado.","Resumo PDF 16"],["Duração: serviços e fornecimentos contínuos, até 5 anos, prorrogáveis até 10.","Resumo PDF 16"],["Alteração unilateral (art. 125): o contratado é obrigado a aceitar acréscimos ou supressões de até 25% do valor inicial, e até 50% em reforma de edifício ou equipamento.","Resumo PDF 16"],["Alteração por acordo (art. 124): substituir a garantia, mudar o regime de execução ou a forma de pagamento e restabelecer o equilíbrio. O pedido de reequilíbrio deve ser feito antes da prorrogação, sob pena de preclusão.","Resumo PDF 16"],["Reajuste e repactuação previstos no contrato vão por apostila, sem termo aditivo. Acréscimo de objeto exige termo aditivo.","Resumo PDF 16"],["Mão de obra com dedicação exclusiva: a Administração responde subsidiariamente pelos encargos trabalhistas, se falhar na fiscalização, e solidariamente pelos previdenciários (art. 121).","Resumo PDF 16"],["O contratado pode pedir a extinção por suspensão superior a 3 meses ou atraso de pagamento superior a 2 meses. Pagamento antecipado é vedado, salvo sensível economia ou condição indispensável.","Resumo PDF 16"]]},{"n":16,"nome":"Lei das Estatais (Lei 13.303/2016) e Contrato Público para Solução Inovadora (LC 182/2021)","sub":"","a":[["Lei 13.303/2016: estatuto da empresa pública, da sociedade de economia mista e de suas subsidiárias, de qualquer ente, inclusive do Município. Vale para atividade econômica e para serviço público.","Resumo PDF 17"],["Governança: gestão de riscos, compliance, auditoria interna, Comitê de Auditoria Estatutário e Código de Conduta. Administradores precisam de reputação ilibada e notório conhecimento.","Resumo PDF 17"],["Não pode ser administrador Secretário Municipal, parlamentar ou quem atuou em partido ou campanha nos últimos 36 meses. O STF validou a vedação (ADI 7331).","Resumo PDF 17"],["Prazo de gestão unificado de até 2 anos, com até 3 reconduções. O Conselho de Administração tem no mínimo 25% de membros independentes.","Resumo PDF 17"],["Estatal pequena (receita inferior a R$ 90 milhões) fica fora apenas das regras de governança. Licitação e contratos continuam valendo.","Resumo PDF 17"],["A regra é a licitação, salvo dispensa e inexigibilidade. O art. 28, §3º, afasta a licitação para atividade-fim e oportunidades de negócio.","Resumo PDF 17"],["Dispensa por valor: até R$ 100 mil (obras e engenharia) e R$ 50 mil (demais). A inexigibilidade é vedada para serviços de publicidade.","Resumo PDF 17"],["A habilitação, em regra, vem depois do julgamento. Contratos duram até 5 anos, com exceções.","Resumo PDF 17"],["Acréscimos e supressões de até 25% (50% em reforma): o contratado PODERÁ aceitar, e não é obrigado, ao contrário da Lei 14.133.","Resumo PDF 17"],["Sanções: advertência, multa e suspensão de até 2 anos. Não há declaração de inidoneidade na Lei das Estatais. CPSI (LC 182/2021): edital descreve o problema, divulgado com 30 dias corridos; contrato de até 12 meses, prorrogável por mais 12, com teto de R$ 1,6 milhão.","Resumo PDF 17"]]},{"n":17,"nome":"Decretos municipais de Curitiba sobre a Lei 14.133/2021","sub":"","a":[["Os decretos de Curitiba sobre a Lei 14.133 aplicam-se em conjunto, conforme o objeto. O Decreto 380/2023 fixa definições e exige análise prévia da PGM para decretos novos ou alterações.","Resumo PDF 18"],["Transição da Lei 8.666 terminou em 22/12/2023 (Decreto 2.236/2023 prorrogou a data original de 30 de novembro).","Resumo PDF 18"],["Decreto 385/2023: prazos mínimos para propostas de 8 dias úteis (bens), 10 (serviços e obras comuns), 25 (especiais), 35 (semi-integrada e técnica e preço) e 60 (integrada).","Resumo PDF 18"],["Impugnação e esclarecimento: até 3 dias úteis antes da sessão, com resposta em 3 dias úteis e efeito vinculante. Recurso: intenção em 20 minutos, razões em 3 dias úteis e decisão em 10.","Resumo PDF 18"],["ETP (Decreto 383): dos 15 elementos, só 5 são sempre obrigatórios (necessidade, quantidades, valor estimado, parcelamento e conclusão). É facultativo abaixo dos valores do art. 75, I e II.","Resumo PDF 18"],["Pesquisa de preços (Decreto 384): média simples de 3 ou mais preços, sem extremos, de até 6 meses antes do edital. Sem 3 referências, vale o menor preço, justificado.","Resumo PDF 18"],["Habilitação: atestado de capacidade técnica de até 50% do objeto. Diligência: até 3 oportunidades de 2 dias úteis. É vedado exigir faturamento mínimo, e o MEI é dispensado de balanço.","Resumo PDF 18"],["O cadastro municipal não pode ser exigido como condição de participação (art. 143 do Decreto 701). O CRC vale no máximo 12 meses.","Resumo PDF 18"],["Decreto 700: reajuste (índice, por apostila), repactuação (serviço contínuo com dedicação exclusiva, interregno mínimo de 1 ano) e revisão (fato imprevisível, a qualquer tempo). O pedido deve ser feito antes da prorrogação, e a simples ressalva não basta.","Resumo PDF 18"],["Sanções: multa de 0,5% a 30%, impedimento de até 3 anos (só no Município) e inidoneidade de 3 a 6 anos (todos os entes), com defesa de 15 dias úteis. SRP: ata de 1 ano, carona de 50% por órgão e o dobro no total. Obras: inexequível abaixo de 75% do orçado.","Resumo PDF 18"]]},{"n":18,"nome":"Parcerias público-privadas e concessões (Lei 11.079/2004)","sub":"","a":[["PPP não é qualquer concessão: a concessão comum, remunerada só por tarifa, não é PPP.","Resumo PDF 19"],["A PPP tem valor mínimo de R$ 10 milhões, prazo mínimo de prestação de 5 anos e contrato de 5 a 35 anos.","Resumo PDF 19"],["Na concessão patrocinada há tarifa dos usuários mais contraprestação pública. Na administrativa, a Administração é a usuária direta ou indireta.","Resumo PDF 19"],["A patrocinada aplica subsidiariamente a Lei 8.987. A administrativa aplica só alguns dos seus artigos.","Resumo PDF 19"],["A contraprestação é paga depois da disponibilização do serviço. O aporte de recursos é a exceção e não é contraprestação.","Resumo PDF 19"],["A SPE é constituída antes do contrato, e a Administração não pode ter a maioria do capital votante.","Resumo PDF 19"],["Regulação, jurisdição e poder de polícia são indelegáveis e não podem ser objeto de PPP.","Resumo PDF 19"],["A consulta pública dura no mínimo 30 dias e se encerra pelo menos 7 dias antes da publicação do edital.","Resumo PDF 19"],["A licitação da PPP é por concorrência ou diálogo competitivo, com autorização fundamentada em estudo técnico.","Resumo PDF 19"],["Os financiadores podem assumir temporariamente o controle da SPE (step-in), sem assumir em definitivo a execução do objeto.","Resumo PDF 19"]]},{"n":19,"nome":"Parcerias e delegações em Curitiba: PARS S.A., PMPE e parcerias com OSC (Decreto 1.067/2016)","sub":"","a":[["A PARS S.A. é sociedade por ações de direito privado, vinculada à Secretaria de Planejamento, Finanças e Orçamento.","Resumo PDF 20"],["O Município mantém no mínimo 50% mais uma das ações da PARS com direito a voto.","Resumo PDF 20"],["A PARS tem capital inicial de R$ 6 milhões e taxa de administração de 4% sobre o valor total do Fundo Garantidor.","Resumo PDF 20"],["O CGPE é presidido pelo Secretário do Governo Municipal e tem 5 membros, incluindo o presidente do IPPUC.","Resumo PDF 20"],["Concessões e PPP devem ser submetidas ao CGPE antes do início dos estudos de estruturação.","Resumo PDF 20"],["A estruturação dos projetos é feita preferencialmente pela PARS, e não de forma exclusiva.","Resumo PDF 20"],["As licenças dos projetos do PMPE têm tramitação prioritária com prazo máximo, sem licença tácita.","Resumo PDF 20"],["O Decreto 1.067/2016 regulamenta a Lei 13.019 (parcerias com OSC), e não a PPP.","Resumo PDF 20"],["A regra é o chamamento público, com edital divulgado com 30 dias de antecedência. O PMIS não é pré-requisito do chamamento.","Resumo PDF 20"],["Nas parcerias com OSC o aditivo não pode ampliar o valor em mais de 30%, a rescisão exige aviso de 60 dias e a suspensão chega a 2 anos.","Resumo PDF 20"]]}]},{"id":"CON","nome":"Direito Constitucional","c":"#43A047","t":"#E8F5E9","t2":"#C8E6C9","d":"#1B5E20","topicos":[{"n":1,"nome":"Teoria da Constituição e hermenêutica","sub":"","a":[["Interpretar é atribuir sentido, e não só descrever um sentido pronto. A hermenêutica constitucional não abandona os métodos gerais: complementa-os com princípios próprios.","Resumo PDF 2"],["Unidade da Constituição: as normas de uma mesma Constituição são interpretadas de forma sistemática, harmonizando-se entre si.","Resumo PDF 2"],["Máxima efetividade: dá-se à norma o sentido que mais eficácia lhe confira, e nenhuma palavra, inciso ou artigo é supérfluo.","Resumo PDF 2"],["Concordância prática: harmonização entre bens e direitos em conflito, sem sacrificar totalmente nenhum deles.","Resumo PDF 2"],["Interpretação evolutiva liga-se à mutação constitucional: muda o sentido da norma, e não o texto.","Resumo PDF 2"],["Métodos segundo Canotilho: jurídico clássico, tópico-problemático (Viehweg), hermenêutico-concretizador (Hesse), científico-espiritual (Smend) e normativo-estruturante (Müller).","Resumo PDF 2"],["Tópico-problemático vai do problema à norma. Hermenêutico-concretizador vai da Constituição ao problema, com base no círculo hermenêutico.","Resumo PDF 2"],["Eficácia (José Afonso da Silva): plena (aplicabilidade imediata e integral), contida (o legislador pode restringir) e limitada (depende de regulamentação).","Resumo PDF 2"],["Quanto à alterabilidade, a CF/88 é rígida. A emenda exige 3/5 dos membros de cada Casa, em dois turnos (art. 60, §2º).","Resumo PDF 2"],["O STF não admite norma constitucional originária inconstitucional (ADI 815): cláusulas pétreas limitam só o poder constituinte derivado.","Resumo PDF 2"]]},{"n":2,"nome":"Poder constituinte e princípios fundamentais","sub":"","a":[["O poder constituinte originário é inicial, autônomo e incondicionado, rompe com a ordem anterior e institui novo Estado. É de fato, político. Para os jusnaturalistas, o direito natural o limita.","Resumo PDF 3"],["Direito anterior compatível com a nova Constituição é recebido (recepção). Só perde vigor o incompatível.","Resumo PDF 3"],["O poder derivado é secundário, de direito, condicionado e limitado. Divide-se em reformador (emendas, art. 60) e decorrente (Constituições Estaduais).","Resumo PDF 3"],["O ADCT é obra do poder constituinte originário e tem a mesma hierarquia da Constituição, apesar da eficácia temporária.","Resumo PDF 3"],["Mutação constitucional é mudança informal de sentido da norma, sem alterar o texto.","Resumo PDF 3"],["Limites formais da emenda: iniciativa de 1/3 de uma Casa, Presidente ou mais da metade das Assembleias. Votação por 3/5 em dois turnos em cada Casa. Promulgação pelas Mesas, sem sanção nem veto.","Resumo PDF 3"],["Limites circunstanciais: não há emenda na vigência de intervenção federal, estado de defesa ou estado de sítio (art. 60, §1º).","Resumo PDF 3"],["Limites materiais (cláusulas pétreas, art. 60, §4º): forma federativa, voto direto, secreto, universal e periódico, separação dos Poderes e direitos e garantias individuais. Proíbem emenda tendente a abolir, mas não a ampliação de direitos.","Resumo PDF 3"],["Proposta de emenda rejeitada ou prejudicada só pode ser reapresentada na sessão legislativa seguinte (art. 60, §5º).","Resumo PDF 3"],["Fundamentos (art. 1º): soberania, cidadania, dignidade da pessoa humana, valores sociais do trabalho e da livre iniciativa e pluralismo político. Poderes: Legislativo, Executivo e Judiciário (o MP não é Poder). Objetivos estão no art. 3º, e os princípios das relações internacionais no art. 4º.","Resumo PDF 3"]]},{"n":3,"nome":"Ações do controle concentrado","sub":"","a":[["Legitimados universais (CF, art. 103): Presidente da República, Mesas do Senado e da Câmara, PGR, Conselho Federal da OAB e partido político com representação no Congresso. Não precisam de pertinência temática.","Resumo PDF 4"],["Legitimados especiais, que exigem pertinência temática: Mesa de Assembleia Legislativa, Governador, confederação sindical e entidade de classe de âmbito nacional. Federação sindical não tem legitimidade.","Resumo PDF 4"],["Proposta a ADI, não se admite desistência (Lei 9.868, art. 5º).","Resumo PDF 4"],["A decisão em ADI é irrecorrível, salvo embargos de declaração, e não cabe ação rescisória. Tem efeito erga omnes e vinculante para o Judiciário e a Administração.","Resumo PDF 4"],["No processo objetivo não há prazo recursal em dobro para a Fazenda (ADI 5.814). Pessoa física não pode ser amicus curiae (ADI 3.396 AgR).","Resumo PDF 4"],["ADC: a petição inicial deve indicar controvérsia judicial relevante sobre a aplicação da norma.","Resumo PDF 4"],["ADO: declarada a omissão, dá-se ciência ao Poder competente. Se for órgão administrativo, o prazo é de 30 dias, ou prazo razoável fixado excepcionalmente.","Resumo PDF 4"],["ADPF (Lei 9.882) tem os mesmos legitimados da ADI. Admite exame de direito pré-constitucional, omissões do poder público (estado de coisas inconstitucional) e conjunto de decisões judiciais reiteradas.","Resumo PDF 4"],["ADPF não serve para desconstituir coisa julgada, nem para interpretar, revisar ou cancelar súmula vinculante (rito do art. 103-A, §2º). Sua decisão é irrecorrível e sem rescisória.","Resumo PDF 4"],["A medida provisória pode ser objeto de ADI. Convertida em lei, a ação prossegue se houver continuidade normativa, com aditamento se a alteração for substancial. MP não trata de matéria de lei complementar.","Resumo PDF 4"]]},{"n":4,"nome":"Controle difuso, modulação, súmulas vinculantes, controle estadual","sub":"","a":[["Controle difuso: qualquer juiz ou tribunal examina a constitucionalidade como questão prejudicial no caso concreto. Efeitos, em regra, inter partes e ex tunc.","Resumo PDF 5"],["Cabe em qualquer ação, inclusive na ação civil pública, desde que a inconstitucionalidade não seja o pedido principal.","Resumo PDF 5"],["Cláusula de reserva de plenário (CF, art. 97): a inconstitucionalidade só se declara pela maioria absoluta dos membros do tribunal ou do órgão especial.","Resumo PDF 5"],["SV 10: viola a reserva de plenário a decisão de órgão fracionário que, sem declarar a inconstitucionalidade, afasta a incidência da lei no todo ou em parte.","Resumo PDF 5"],["Dispensa a reserva de plenário: pronunciamento anterior do plenário ou órgão especial do próprio tribunal ou do STF (CPC, art. 949, p. único). Também não vale para juiz singular nem turma recursal.","Resumo PDF 5"],["Resolução do Senado (art. 52, X): suspende a lei declarada inconstitucional pelo STF em controle difuso. É discricionária e, na visão tradicional, dá eficácia erga omnes.","Resumo PDF 5"],["Modulação (Lei 9.868, art. 27): por 2/3 dos ministros do STF (oito), por segurança jurídica ou excepcional interesse social. Sem modulação, a regra é a nulidade ex tunc, com efeito repristinatório.","Resumo PDF 5"],["Súmula vinculante (art. 103-A): aprovada por 2/3 do STF, após reiteradas decisões sobre matéria constitucional com controvérsia atual e grave insegurança jurídica. Vincula o Judiciário e a Administração, mas não o STF nem o Legislativo ao legislar.","Resumo PDF 5"],["Legitimados da SV: os do art. 103, mais o Defensor Público-Geral da União, os Tribunais e, incidentalmente, o Município, sem suspensão do processo. Descumprimento: reclamação ao STF.","Resumo PDF 5"],["Controle estadual (art. 125, §2º): o TJ julga a representação contra lei estadual ou municipal em face da Constituição Estadual, vedada a legitimação de um só órgão. A lei orgânica não é parâmetro. Lei municipal contra a CF: só ADPF no STF.","Resumo PDF 5"]]},{"n":5,"nome":"Direitos fundamentais: teoria e direitos individuais/sociais","sub":"","a":[["Características dos direitos fundamentais: universalidade, historicidade, inalienabilidade, imprescritibilidade, irrenunciabilidade (em regra), limitabilidade e cumulatividade. Não há direito absoluto.","Resumo PDF 6 + aula em áudio"],["Restrições devem respeitar a proporcionalidade e o núcleo essencial. Na colisão, aplicam-se a ponderação (Alexy) ou a concordância prática (Hesse).","Resumo PDF 6 + aula em áudio"],["Eficácia vertical (contra o Estado) e horizontal (entre particulares). O STF admite a eficácia direta nas relações privadas (RE 201.819 e RE 161.243). O art. 5º, §1º, dá aplicação imediata às normas de direitos fundamentais.","Resumo PDF 6 + aula em áudio"],["Art. 5º, §2º: o rol é aberto. §3º: tratado de direitos humanos aprovado por 3/5 em dois turnos em cada Casa equivale a emenda constitucional. Os demais têm status supralegal (SV 25).","Resumo PDF 6 + aula em áudio"],["Titulares: pessoas naturais, pessoas jurídicas (no que couber) e estrangeiros, residentes ou não.","Resumo PDF 6 + aula em áudio"],["Igualdade: ações afirmativas são constitucionais (cotas raciais: ADPF 186 e ADC 41). Restrições em concurso só se justificadas pela natureza do cargo (Súmula 683). Isenção de taxa para servidores, sem igualdade substancial, é inconstitucional.","Resumo PDF 6 + aula em áudio"],["Liberdade de expressão pondera-se com honra e imagem e não prevalece sempre. Reunião: pacífica, sem armas, sem autorização, mas com prévio aviso. Associação: dissolução só por decisão judicial transitada em julgado; suspensão por decisão judicial.","Resumo PDF 6 + aula em áudio"],["Quebra de sigilo telefônico exige ordem judicial. Dados cadastrais (nome, filiação, endereço) podem ser acessados por autoridades sem ordem (STF). Sigilo bancário e fiscal: ordem judicial ou CPI.","Resumo PDF 6 + aula em áudio"],["Domicílio (art. 5º, XI): consentimento, flagrante, desastre ou socorro, e ordem judicial apenas de dia. Entrada em flagrante exige fundadas razões (Tema 280). Pequena propriedade rural familiar é impenhorável. Prova ilícita é inadmissível e presunção de inocência vai até o trânsito em julgado.","Resumo PDF 6 + aula em áudio"],["Direitos sociais (art. 6º) são fundamentais, de aplicação imediata, e não meras normas programáticas. Aplicam-se o mínimo existencial e a vedação do retrocesso. Vaga em creche e pré-escola é dever do Estado (Tema 548).","Resumo PDF 6 + aula em áudio"]]},{"n":6,"nome":"Remédios constitucionais e ações constitucionais","sub":"","a":[["Habeas corpus protege a liberdade de locomoção contra ilegalidade ou abuso de poder. É gratuito, dispensa advogado e pode ser preventivo (salvo-conduto) ou liberatório.","Resumo PDF 7 + aula em áudio"],["Não cabe habeas corpus quanto ao mérito de punição disciplinar militar (CF, art. 142, §2º).","Resumo PDF 7 + aula em áudio"],["Habeas data conhece ou retifica informações do impetrante em registros de entidades governamentais ou de caráter público. Exige prova da recusa administrativa (Súmula 2 do STJ). É gratuito.","Resumo PDF 7 + aula em áudio"],["Mandado de segurança protege direito líquido e certo, não amparado por HC ou HD, contra ato de autoridade. Exige prova pré-constituída. O prazo é de 120 dias da ciência do ato, decadencial.","Resumo PDF 7 + aula em áudio"],["Não cabe mandado de segurança contra lei em tese (Súmula 266 do STF). Não há condenação em honorários (Súmula 105 do STJ e Súmula 512 do STF).","Resumo PDF 7 + aula em áudio"],["Mandado de segurança coletivo: partido com representação no Congresso e organização sindical, entidade de classe ou associação com um ano de constituição. É substituição processual, sem autorização individual (Súmula 629).","Resumo PDF 7 + aula em áudio"],["No MS coletivo, basta que o direito atinja parte da categoria (Súmula 630), e a coisa julgada se limita aos membros do grupo.","Resumo PDF 7 + aula em áudio"],["Mandado de injunção (Lei 13.300): cabe quando a falta de norma regulamentadora inviabiliza direitos e liberdades constitucionais e prerrogativas ligadas à nacionalidade, soberania e cidadania.","Resumo PDF 7 + aula em áudio"],["No mandado de injunção, a eficácia pode ser concretista: o juiz fixa prazo ao legislador e, persistindo a omissão, estabelece as condições do exercício. Não serve para compelir ato administrativo concreto.","Resumo PDF 7 + aula em áudio"],["Ação popular: só o cidadão (eleitor) propõe, para anular ato lesivo ao patrimônio público, à moralidade, ao meio ambiente ou ao patrimônio histórico e cultural. Pessoa jurídica não propõe (Súmula 365). Autor é isento de custas, salvo má-fé, e prescreve em 5 anos. O MP não é autor originário.","Resumo PDF 7 + aula em áudio"]]},{"n":7,"nome":"Reserva do possível, mínimo existencial, PcD, Idoso","sub":"","a":[["Reserva do possível é limite fático e jurídico à efetivação dos direitos sociais, ligado a recursos e razoabilidade. Não pode esvaziar o mínimo existencial (ADPF 45).","Resumo PDF 8 + aula em áudio"],["Cabe ao Poder Público provar a falta de recursos, e não apenas alegá-la.","Resumo PDF 8 + aula em áudio"],["Mínimo existencial é o núcleo que garante vida digna, extraído da dignidade humana e do art. 6º: saúde básica, educação fundamental, moradia e assistência.","Resumo PDF 8 + aula em áudio"],["O Judiciário pode impor obrigações de fazer diante de omissão que viola o mínimo existencial, sem ofender a separação dos Poderes (RE 592.581 e RE 410.715).","Resumo PDF 8 + aula em áudio"],["Saúde: os entes são solidariamente responsáveis, e o autor demanda qualquer um (Tema 793). A falta de dotação orçamentária não impede ordem judicial de medicamento essencial. Fora do SUS, o dever é excepcional, com requisitos do STF.","Resumo PDF 8 + aula em áudio"],["Aplicam-se a vedação do retrocesso social e a proibição da proteção insuficiente.","Resumo PDF 8 + aula em áudio"],["A Convenção sobre os Direitos das Pessoas com Deficiência tem status de emenda constitucional (art. 5º, §3º). A LBI adota o modelo biopsicossocial: impedimento de longo prazo em interação com barreiras, avaliado por equipe multiprofissional.","Resumo PDF 8 + aula em áudio"],["A pessoa com deficiência é plenamente capaz. A curatela é excepcional, proporcional e limitada a atos patrimoniais e negociais. Existe a tomada de decisão apoiada. A recusa de adaptação razoável exige demonstrar ônus desproporcional e indevido.","Resumo PDF 8 + aula em áudio"],["Educação inclusiva em escola regular. Escolas privadas também cumprem e não podem cobrar a mais (ADI 5357). Em concursos há reserva de vagas e adaptações razoáveis (CF, art. 37, VIII).","Resumo PDF 8 + aula em áudio"],["Pessoa idosa: 60 anos ou mais. Prioridade na tramitação, especial a partir de 80. Vedado reajuste de plano de saúde por faixa etária a partir de 60. Gratuidade no transporte urbano aos 65. Medidas de proteção cabem por ameaça ou violação por família, sociedade, Estado ou conduta da própria pessoa, e o MP pode requerê-las. Alimentos são obrigação solidária.","Resumo PDF 8 + aula em áudio"]]},{"n":8,"nome":"Federação e competências","sub":"","a":[["A Federação é cláusula pétrea (CF, art. 60, §4º, I). União, Estados, DF e Municípios são autônomos (art. 18), com auto-organização, autogoverno, autolegislação e autoadministração. Não há direito de secessão.","Resumo PDF 9 + aula em áudio"],["Competência material exclusiva da União (art. 21) é indelegável. A comum (art. 23) é de todos os entes, em cooperação.","Resumo PDF 9 + aula em áudio"],["Legislativa privativa da União (art. 22) pode ser delegada aos Estados por lei complementar, sobre questões específicas. A competência remanescente é dos Estados (art. 25, §1º).","Resumo PDF 9 + aula em áudio"],["Concorrente (art. 24): a União edita normas gerais e os Estados suplementam. Sem lei federal, os Estados exercem a competência plena. A lei federal superveniente suspende a estadual no que for contrária.","Resumo PDF 9 + aula em áudio"],["Florestas, caça, pesca e fauna são competência concorrente. Trânsito, transporte e populações indígenas são privativos da União.","Resumo PDF 9 + aula em áudio"],["O Município é ente federativo, com Lei Orgânica própria. Legisla sobre interesse local e suplementa a legislação federal e estadual (art. 30). SV 38: pode fixar o horário de funcionamento do comércio. Não legisla sobre matéria privativa da União.","Resumo PDF 9 + aula em áudio"],["Bens da União (art. 20): terras devolutas indispensáveis à defesa, rios que banham mais de um Estado, mar territorial, recursos minerais. Dos Estados (art. 26): águas superficiais ou subterrâneas e ilhas fluviais e lacustres. O Município não tem lista própria na Constituição.","Resumo PDF 9 + aula em áudio"],["Intervenção federal (arts. 34 a 36) é exceção à autonomia: integridade nacional, invasão, grave comprometimento da ordem pública, livre exercício dos Poderes, finanças, execução de lei federal ou decisão judicial e princípios sensíveis. O decreto é do Presidente e vai ao Congresso em 24 horas.","Resumo PDF 9 + aula em áudio"],["Nos casos do art. 34, VI e VII, e do art. 35, IV, o decreto dispensa a apreciação do Legislativo e se limita a suspender o ato impugnado, se bastar.","Resumo PDF 9 + aula em áudio"],["Intervenção estadual em Município (art. 35), em rol taxativo: dívida fundada não paga por 2 anos consecutivos, falta de prestação de contas, não aplicação do mínimo em ensino e saúde, e garantia de princípios da Constituição Estadual ou execução de lei ou decisão judicial. A Constituição Estadual não cria outras hipóteses. Não cabe RE contra o acórdão do TJ que defere a intervenção (Súmula 637).","Resumo PDF 9 + aula em áudio"]]},{"n":9,"nome":"Municípios, Lei Orgânica de Curitiba, Constituição do Paraná, intervenção","sub":"","a":[["O Município é ente federativo autônomo (CF, art. 18), com auto-organização pela Lei Orgânica, e não por Constituição. Não tem Poder Judiciário próprio.","Resumo PDF 10 + aula em áudio"],["Criação de Município: lei estadual, dentro do período fixado por lei complementar federal, após estudo de viabilidade e plebiscito com a população dos Municípios envolvidos (art. 18, §4º).","Resumo PDF 10 + aula em áudio"],["Lei Orgânica (art. 29): votada em dois turnos, com interstício mínimo de dez dias, aprovada por dois terços da Câmara, que a promulga. Não há sanção nem veto do Prefeito.","Resumo PDF 10 + aula em áudio"],["Prefeito e Vice: mandato de 4 anos, eleição no primeiro domingo de outubro, com segundo turno em Municípios com mais de 200 mil eleitores. Posse em 1º de janeiro.","Resumo PDF 10 + aula em áudio"],["Prefeito é julgado pelo TJ nos crimes comuns. Para crimes federais ou eleitorais, vai ao TRF ou TRE (Súmula 702 do STF).","Resumo PDF 10 + aula em áudio"],["Vereadores: número proporcional à população (Curitiba tem 38). Subsídio fixado por lei de uma legislatura para a seguinte, até 75% do subsídio dos deputados estaduais nas cidades com mais de 500 mil habitantes. Inviolabilidade por opiniões, palavras e votos no exercício do mandato e na circunscrição do Município.","Resumo PDF 10 + aula em áudio"],["Despesa da Câmara (art. 29-A): limitada a percentual da receita tributária do ano anterior (4,5% entre 500 mil e 3 milhões de habitantes). A folha não passa de 70% do orçamento. É crime de responsabilidade do Prefeito repassar a mais, não repassar até o dia 20 ou repassar menos que o fixado.","Resumo PDF 10 + aula em áudio"],["Controle externo (art. 31): da Câmara, com auxílio do Tribunal de Contas. O parecer prévio sobre as contas do Prefeito só deixa de prevalecer por dois terços da Câmara. Tema 835: a Câmara julga as contas de governo e de gestão, para fins de inelegibilidade. Não se criam novos tribunais de contas municipais.","Resumo PDF 10 + aula em áudio"],["Decreto-Lei 201/1967: crimes de responsabilidade são julgados pelo Judiciário; infrações político-administrativas, pela Câmara, com cassação. Tema 917: lei de iniciativa parlamentar que cria despesa, sem tratar da estrutura da Administração, não usurpa a competência do Executivo. SV 13 veda nepotismo nos três Poderes.","Resumo PDF 10 + aula em áudio"],["Região metropolitana: instituída pelo Estado por lei complementar (art. 25, §3º). Na ADI 1842, o STF decidiu que a competência sobre saneamento é compartilhada entre Estado e Municípios da região. Confira os textos da Lei Orgânica de Curitiba e da Constituição do Paraná.","Resumo PDF 10 + aula em áudio"]]},{"n":10,"nome":"Poder Legislativo, processo legislativo e Tribunal de Contas","sub":"","a":[["Imunidade material (art. 53, caput): parlamentares são invioláveis, civil e penalmente, por opiniões, palavras e votos, desde que haja conexão com o mandato (Tema 469 do STF). Não é absoluta.","Resumo PDF 11"],["O vereador tem imunidade material apenas no Município e no exercício do mandato (art. 29, VIII). Não tem imunidade formal.","Resumo PDF 11"],["Imunidade formal: o congressista só pode ser preso em flagrante de crime inafiançável, e a Casa decide em 24 horas, por maioria absoluta, se mantém a prisão.","Resumo PDF 11"],["Recebida a denúncia por crime posterior à diplomação, a Casa pode sustar a ação por maioria absoluta, em 45 dias.","Resumo PDF 11"],["Foro por prerrogativa no STF: crimes cometidos durante o mandato e relacionados às funções (AP 937).","Resumo PDF 11"],["CPI: poderes de investigação próprios das autoridades judiciais, com requerimento de 1/3, fato determinado e prazo certo, sem reserva de jurisdição. Conclusões vão ao Ministério Público.","Resumo PDF 11"],["Lei ordinária exige maioria simples, presente a maioria absoluta. Emenda constitucional exige 3/5 em dois turnos.","Resumo PDF 11"],["Iniciativa privativa do Executivo (art. 61, §1º): servidores, organização administrativa, cargos e regime jurídico, também por simetria no Município. A sanção não convalida o vício de iniciativa.","Resumo PDF 11"],["Medida provisória: vigora por 60 dias, prorrogáveis por mais 60, e tranca a pauta após 45 dias. Se não convertida, perde eficácia desde a edição. É vedada em matéria penal, processual, nacionalidade e direitos políticos.","Resumo PDF 11"],["Tribunal de Contas: Súmula Vinculante 3 (contraditório, salvo na concessão inicial de aposentadoria). Súmula 347 (afasta lei inconstitucional no caso concreto). Tema 899: prescreve o ressarcimento fundado só em decisão de Tribunal de Contas.","Resumo PDF 11"]]},{"n":11,"nome":"Poder Executivo, Poder Judiciário e CNJ","sub":"","a":[["Presidente: eleição em dois turnos, por maioria absoluta dos votos válidos. Se ninguém alcança, nova eleição em até 20 dias entre os dois mais votados. Posse em 5 de janeiro (EC 111/2021). Governadores tomam posse em 6 de janeiro.","Resumo PDF 12"],["Vacância de Presidente e Vice nos 2 primeiros anos: eleição direta em 90 dias. Nos 2 últimos anos: eleição indireta, pelo Congresso, em 30 dias. O eleito completa o mandato do antecessor.","Resumo PDF 12"],["Se o Presidente não assumir em 10 dias da data fixada para a posse, salvo força maior, o cargo é declarado vago. Ausência do País por mais de 15 dias exige licença do Congresso.","Resumo PDF 12"],["Câmara autoriza a instauração do processo contra o Presidente por 2/3. O STF (ADI 5540) decidiu que essa regra não se estende aos governadores.","Resumo PDF 12"],["Definir crimes de responsabilidade é competência privativa da União (Súmula Vinculante 46). O Prefeito responde por crimes comuns no TJ, e a Câmara julga as infrações político-administrativas do Decreto-Lei 201/1967.","Resumo PDF 12"],["Decreto autônomo (art. 84, VI): só para organização e funcionamento da administração, sem aumento de despesa nem criação ou extinção de órgãos, e para extinguir funções ou cargos vagos.","Resumo PDF 12"],["Ingresso na magistratura: concurso, com a OAB em todas as fases, e 3 anos de atividade jurídica. STF: 11 ministros, brasileiros natos, de 35 a 70 anos, aprovados por maioria absoluta do Senado.","Resumo PDF 12"],["Quinto constitucional: advogados e membros do MP com mais de 10 anos de carreira, por lista sêxtupla, depois tríplice, com nomeação em 20 dias.","Resumo PDF 12"],["CNJ: 15 membros, presidido pelo Presidente do STF, com Corregedor Nacional Ministro do STJ, excluído da distribuição. Inclui um do MPU, um do MP estadual, 2 advogados (OAB) e 2 cidadãos. Membros julgados pelo Senado nos crimes de responsabilidade.","Resumo PDF 12"],["CNJ: reclamações, avocação de processos disciplinares e revisão de processos disciplinares julgados há menos de 1 ano. Competência disciplinar concorrente (ADI 4638). Não exerce jurisdição nem controla o STF (ADI 3367).","Resumo PDF 12"]]},{"n":12,"nome":"Funções essenciais à Justiça, Advocacia Pública e a PGM de Curitiba","sub":"","a":[["Funções essenciais à Justiça (arts. 127 a 135): Ministério Público, Advocacia Pública, Advocacia e Defensoria Pública. Não integram o Judiciário, mas são indispensáveis a ele.","Resumo PDF 13"],["Ministério Público: princípios da unidade, indivisibilidade e independência funcional. Há hierarquia apenas administrativa. Tem autonomia funcional, administrativa e financeira.","Resumo PDF 13"],["Advogado: indispensável à administração da justiça e inviolável por seus atos e manifestações, nos limites da lei. Defensoria: defesa dos necessitados, com autonomia funcional e administrativa.","Resumo PDF 13"],["AGU: representa a União judicial e extrajudicialmente e faz a consultoria do Executivo. O Advogado-Geral é de livre nomeação, maior de 35 anos, de notável saber jurídico.","Resumo PDF 13"],["O art. 132 cita só Estados e DF, mas o STF considera os procuradores municipais parte da advocacia pública.","Resumo PDF 13"],["Tema 510 do STF: procuradores municipais se submetem ao teto de 90,25% do subsídio dos Ministros do STF, e não ao subsídio do Prefeito.","Resumo PDF 13"],["Honorários de sucumbência dos advogados públicos (art. 85, §19, CPC) são constitucionais (ADI 6.053), mas sujeitos ao teto remuneratório.","Resumo PDF 13"],["Lei Orgânica de Curitiba, art. 74: representação judicial e extrajudicial, assessoramento e consultoria jurídica cabem aos Procuradores do Município. O Procurador-Geral é de livre nomeação do Prefeito, preferencialmente entre os da carreira.","Resumo PDF 13"],["A cobrança judicial e extrajudicial da dívida ativa é exclusiva da Procuradoria, e as atribuições são exclusivas dos procuradores de carreira (Lei 15.461/2019).","Resumo PDF 13"],["Lei 16.200/2023: crescimento horizontal só em anos pares (até 40%, 80% avaliação e 20% títulos). Vertical por merecimento só em anos ímpares (até 20% das vagas, 80% títulos e 20% avaliação). Não há direito subjetivo, e as vagas não se acumulam.","Resumo PDF 13"]]},{"n":13,"nome":"Administração Pública e servidores na CF: arts. 37 a 41 e teto remuneratório","sub":"","a":[["Princípios expressos do art. 37 (LIMPE): legalidade, impessoalidade, moralidade, publicidade e eficiência. Razoabilidade e supremacia do interesse público são implícitos.","Resumo PDF 14"],["Funções de confiança são exercidas exclusivamente por servidores efetivos. Cargos em comissão são para direção, chefia e assessoramento. O aprovado tem prioridade sobre novos concursados durante o prazo.","Resumo PDF 14"],["Súmula Vinculante 13: veda o nepotismo nos três Poderes, até o terceiro grau.","Resumo PDF 14"],["Greve de servidores: na omissão legislativa aplica-se a Lei 7.783. Tema 531: a Administração deve descontar os dias parados, salvo compensação ou greve provocada por conduta ilícita do Poder Público.","Resumo PDF 14"],["A remuneração só se fixa ou altera por lei específica, com revisão geral anual. É vedada a vinculação e a equiparação (Súmula Vinculante 37). A remuneração é irredutível.","Resumo PDF 14"],["Teto geral: subsídio dos Ministros do STF. Nos Municípios, o do Prefeito. Nos Estados, o do Governador (Executivo), dos Deputados (Legislativo) e dos Desembargadores (Judiciário), este 90,25% do subsídio do STF.","Resumo PDF 14"],["Subteto único (Desembargador) é facultado a Estados e DF. Os Municípios não têm subteto. Procuradores municipais seguem o teto de 90,25% do STF (Tema 510).","Resumo PDF 14"],["EC 135/2024: parcelas indenizatórias só ficam fora do teto se previstas em lei ordinária nacional.","Resumo PDF 14"],["Acumulação: dois cargos de professor, um de professor com outro de qualquer natureza (EC 138/2025) e dois de profissionais de saúde. Exige compatibilidade de horários, respeitado o teto. Tema 384: o teto incide sobre cada vínculo isoladamente.","Resumo PDF 14"],["Estabilidade: após 3 anos de efetivo exercício, com avaliação especial de desempenho. Perda do cargo: sentença transitada, processo administrativo com ampla defesa ou avaliação periódica. Ressarcimento por improbidade dolosa é imprescritível (Tema 897).","Resumo PDF 14"]]},{"n":14,"nome":"Tributação e finanças na CF: EC 132, repartição de receitas e precatórios","sub":"","a":[["EC 132/2023 criou o IBS (Estados, DF e Municípios), a CBS (federal) e o Imposto Seletivo. O IBS substitui ICMS e ISS, e a CBS substitui PIS e Cofins. IPTU e ITBI continuam municipais.","Resumo PDF 15"],["Regulamentação: LC 214/2025. O IBS é gerido por um Comitê Gestor nacional.","Resumo PDF 15"],["Transição: 2026 é ano de testes (CBS 0,9% e IBS 0,1%). CBS plena em 2027. IBS cresce de 2029 a 2032, e ICMS e ISS são extintos em 2033.","Resumo PDF 15"],["Art. 156-A: não cumulatividade ampla, tributação no destino, alíquota única por ente e não incidência sobre exportações.","Resumo PDF 15"],["Competência municipal (art. 156): IPTU, ITBI e ISS. ITBI não incide em integralização de capital nem em fusão e incorporação, salvo atividade preponderante imobiliária.","Resumo PDF 15"],["IPTU pode ser progressivo no tempo e em razão do valor, e a EC 132 permitiu também por localização e uso.","Resumo PDF 15"],["COSIP (art. 149-A): custeia a iluminação pública e, desde a EC 132, também sistemas de monitoramento. Contribuição de melhoria exige obra e valorização.","Resumo PDF 15"],["Repartição: Municípios ficam com 100% do IR retido de seus servidores, 50% do ITR, 50% do IPVA e 25% do ICMS. FPM: 22,5% do IR e do IPI, mais 1% em dezembro, julho e setembro. É vedada a retenção das receitas partilhadas (art. 160).","Resumo PDF 15"],["Despesa com pessoal no Município: 60% da receita corrente líquida (6% Legislativo e 54% Executivo). O art. 167 veda vinculação de impostos, salvo exceções como saúde e educação.","Resumo PDF 15"],["Precatórios (art. 100): ordem cronológica, após o trânsito em julgado. Apresentados até 1º de fevereiro, entram no orçamento seguinte e são pagos até o fim do exercício (EC 136/2025). Alimentares têm preferência, e idosos, doentes graves e PcD têm superpreferência. É vedado fracionar para RPV, e a cessão não exige anuência do devedor.","Resumo PDF 15"]]},{"n":15,"nome":"Ordem econômica, política urbana e função social da propriedade","sub":"","a":[["Art. 170: a ordem econômica funda-se na valorização do trabalho humano e na livre iniciativa, com princípios como função social da propriedade, livre concorrência, defesa do consumidor e do meio ambiente.","Resumo PDF 16"],["A livre iniciativa admite relativização por outros princípios, em harmonização e ponderação constitucional.","Resumo PDF 16"],["Art. 173: a exploração direta de atividade econômica pelo Estado é exceção, só por segurança nacional ou relevante interesse coletivo. Estatais econômicas não têm privilégios fiscais não extensivos ao setor privado.","Resumo PDF 16"],["Art. 174: como agente normativo e regulador, o Estado fiscaliza, incentiva e planeja. O planejamento é determinante para o setor público e indicativo para o privado.","Resumo PDF 16"],["Monopólio da União (art. 177): petróleo e gás, refinação, importação e exportação, transporte por conduto e minerais nucleares. Radioisótopos de meia-vida curta podem ser produzidos sob permissão.","Resumo PDF 16"],["Política urbana (art. 182): executada pelo Município. Plano diretor aprovado pela Câmara, obrigatório para cidades com mais de 20 mil habitantes.","Resumo PDF 16"],["Solo urbano não edificado: sucessivamente, parcelamento ou edificação compulsórios, IPTU progressivo no tempo e desapropriação com títulos da dívida pública (resgate em até 10 anos, com aprovação do Senado). Não se pulam etapas.","Resumo PDF 16"],["Usucapião urbana: até 250 m², 5 anos, para moradia. Rural: até 50 hectares, 5 anos, com trabalho e moradia. Imóveis públicos não são usucapidos.","Resumo PDF 16"],["Reforma agrária: compete à União, por interesse social, com títulos da dívida agrária em até 20 anos. Não podem ser desapropriadas a pequena e média propriedade (se o dono não tiver outra) e a propriedade produtiva.","Resumo PDF 16"],["Função social rural: aproveitamento racional, recursos naturais e meio ambiente, normas trabalhistas e bem-estar. Súmula Vinculante 49 (livre concorrência) e 38 (horário do comércio é competência do Município).","Resumo PDF 16"]]},{"n":16,"nome":"Seguridade social, saúde (SUS), assistência social e dispensação de medicamentos","sub":"","a":[["Seguridade social (art. 194): saúde, previdência e assistência social. Só a previdência é contributiva. Saúde e assistência alcançam quem delas necessitar.","Resumo PDF 17"],["Nenhum benefício pode ser criado ou ampliado sem fonte de custeio total. As contribuições sociais respeitam a noventena, e não a anterioridade anual.","Resumo PDF 17"],["Os requisitos da imunidade das entidades beneficentes exigem lei complementar (Tema 32 do STF).","Resumo PDF 17"],["Saúde é direito de todos e dever do Estado. O SUS é uma rede regionalizada e hierarquizada, com descentralização, atendimento integral e participação da comunidade.","Resumo PDF 17"],["Mínimos de aplicação em saúde: União 15% da receita corrente líquida, Estados 12% e Municípios 15% dos impostos.","Resumo PDF 17"],["A iniciativa privada participa do SUS de forma complementar, com preferência para as filantrópicas. É vedada subvenção a entidades com fins lucrativos.","Resumo PDF 17"],["BPC: um salário mínimo ao idoso de 65 anos ou mais e à pessoa com deficiência com renda per capita de até 1/4 do salário mínimo. O critério não é absoluto (STF). O BPC é federal, e ao Município cabem benefícios eventuais.","Resumo PDF 17"],["Ações de saúde: os entes são solidários, mas o juiz direciona
